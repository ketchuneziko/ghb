/* Фраза для печати берётся из CONFIG.phrase: из неё вырезаем имя Марии
   и знак «!», остаток («Я ЛЮБЛЮ ТЕБЯ,») остаётся в коде, а имя подставляется
   переменной who. Правишь phrase в CONFIG — меняется и принтер, и финал. */
const CODE_HEAD = (function(){
  let s = (CONFIG.phrase || 'Я ЛЮБЛЮ ТЕБЯ, МАРИЯ!').toUpperCase().trim();
  const her = (CONFIG.her || '').toUpperCase().trim();
  if (her && s.indexOf(her) >= 0) s = s.split(her).join('');
  s = s.replace(/[\s!?.…\-]+$/g, '');      // хвост: «!» и пробелы — долой, запятую оставляем
  s = s.replace(/^[\s,.!?;:…\-]+/g, '');   // если имя стояло в начале фразы
  return (s || 'Я ЛЮБЛЮ ТЕБЯ,') + ' ';
})();

const CODE_LINES = function(){
  return [
    [{v:'# print_i_love_u.py'}],
    [{v:'who = "' + CONFIG.her.toUpperCase() + '"'}],
    [{v:'for '}, {b:0}, {v:' in range('}, {b:1}, {v:'):'}],
    [{v:'    love.give(who, "'}, {b:2}, {v:'")'}],
    [{b:3}, {v:'("' + CODE_HEAD + '" + who)'}]
  ];
};
const CODE_ANS = ['день', '1000000', 'ВСЁ', 'print'];
const CODE_TILES = ['день', 'ночь', '7', '1000000', 'ВСЁ', 'ничего', 'print', 'delete'];
const CODE_ERR = [
  'Строка 3: NameError: «{X}»',
  'Строка 3: range({X}) — мало',
  'Строка 4: «{X}» — я хочу больше',
  'Строка 5: SyntaxError: «{X}»'
];

const L8 = {
  name:'КОД',
  hint:'ЗАПОЛНИ ПРОПУСКИ И ЖМИ ПУСК',
  hintY:false,          // подсказку рисуем сами — внутри терминала
  intro:[D('him','Я не мастер красивых слов.'), D('him','Но код писать умею. Почини его — и он всё скажет за меня.')],
  outro:[D('her','Ты правда написал это для меня?'), D('him','Каждую строчку. И ещё напишу.')],
  enter(){
    this.t = 0; this.lives = 3; this.sel = 0;
    this.fill = [null,null,null,null];
    this.mode = 'edit'; this.modeT = 0;
    this.lines = CODE_LINES();
    const R = mulberry32(20260930);
    this.tiles = CODE_TILES.slice();
    for(let i=this.tiles.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); const t=this.tiles[i]; this.tiles[i]=this.tiles[j]; this.tiles[j]=t; }
    this.out = ['$ python print_i_love_u.py', 'жду команды...'];
    this.outShown = 99; this.mistakes = 0; this.hintOn = false;
    this.blanksR = [null,null,null,null];
    this.tileR = [];
    this.printT = 0; this.flash = 0;
    this.pending = null;
  },
  curBlank(){ for(let i=0;i<4;i++){ const k=(this.sel+i)%4; if(!this.fill[k]) return k; } return this.sel; },
  put(tok){
    const b = this.curBlank();
    this.fill[b] = tok; Snd.type();
    let n = -1;
    for(let i=0;i<4;i++){ const k=(b+1+i)%4; if(!this.fill[k]){ n = k; break; } }
    if(n>=0) this.sel = n;
  },
  clearBlank(){ this.fill[this.sel] = null; Snd.blip(); },
  cycle(dir){
    const b = this.sel;
    let i = this.tiles.indexOf(this.fill[b]);
    i = (i + dir + this.tiles.length + (i<0?1:0)) % this.tiles.length;
    this.fill[b] = this.tiles[i]; Snd.type();
  },
  run(){
    if(this.mode !== 'edit') return;
    for(let i=0;i<4;i++){ if(!this.fill[i]){ this.say('Строка '+[3,3,4,5][i]+': пропуск не заполнен'); Snd.bad(); return; } }
    this.mode = 'comp'; this.modeT = 0; Snd.clack();
  },
  say(s){ this.out.push(s); this.outShown = 0; if(this.out.length>7) this.out.shift(); },
  compileDone(){
    let bad = -1;
    for(let i=0;i<4;i++){ if(this.fill[i] !== CODE_ANS[i]){ bad = i; break; } }
    if(bad < 0){
      this.mode = 'print'; this.printT = 0; this.printLine = 0;
      this.out.push('компиляция... ОК'); this.out.push('запуск...');
      Snd.note(880,0.08,'square',0.12);
    } else {
      this.mistakes++; this.lives--; this.mode = 'err'; this.modeT = 0;
      this.out.push('Traceback (most recent call last):');
      this.out.push(CODE_ERR[bad].replace('{X}', this.fill[bad]));
      this.out.push('Программа обиделась. Попробуй ещё.');
      if(this.mistakes >= 2) this.hintOn = true;
      shake(5); Snd.bad();
      if(this.lives <= 0) loseLevel('Программа сломалась окончательно. Но я всё равно люблю.');
    }
  },
  update(dt){
    this.t += dt;
    if(this.flash>0) this.flash -= dt;
    if(this.mode==='comp'){
      this.modeT += dt;
      if(this.modeT > 0.85) this.compileDone();
    } else if(this.mode==='err'){
      this.modeT += dt;
      if(this.modeT > 0.9 && this.lives>0){ this.mode='edit'; this.sel = this.curBlank(); }
    } else if(this.mode==='print'){
      this.printT += dt;
      const seq = [CODE_HEAD + CONFIG.her.toUpperCase() + '!',
                   '♥ напечатано: 1 страница',
                   '[OK] завершено без ошибок'];
      const step = 0.75;
      const idx = Math.floor(this.printT/step);
      while(this.printLine < Math.min(idx+1, seq.length)){
        this.out.push(seq[this.printLine]); this.printLine++;
        Snd.note(660 + this.printLine*160, 0.07, 'square', 0.10);
        fx(W*0.5, H*0.72, 6, CONFIG.P.pink, 60, 0.5);
      }
      if(this.printT > step*seq.length + 0.7) winLevel(LEVELS.indexOf(this));
    }
    // «печатающийся» вывод терминала
    if(this.outShown < 99){ this.outShown = 99; }
  },
  key(k){
    if(this.mode==='print') return;
    if(k==='ArrowLeft'){ this.sel = (this.sel+3)%4; Snd.blip(); return; }
    if(k==='ArrowRight'){ this.sel = (this.sel+1)%4; Snd.blip(); return; }
    if(k==='ArrowUp'){ this.cycle(-1); return; }
    if(k==='ArrowDown'){ this.cycle(1); return; }
    if(k==='Backspace'){ this.clearBlank(); return; }
    if(k>='1' && k<='8'){ const i = parseInt(k,10)-1; if(i<this.tiles.length) this.put(this.tiles[i]); return; }
    if(k==='F5' || k==='Enter' || k===' '){ this.run(); return; }
  },
  tap(x,y){
    if(this.mode==='print') return;
    // пропуски в коде
    for(let i=0;i<4;i++){
      const r = this.blanksR[i];
      if(r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h){ this.sel = i; Snd.blip(); return; }
    }
    // плитки
    for(let i=0;i<this.tileR.length;i++){
      const r = this.tileR[i];
      if(r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h){ this.put(r.tok); return; }
    }
    // кнопка запуска
    const rb = this.runRect;
    if(rb && x>=rb.x && x<=rb.x+rb.w && y>=rb.y && y<=rb.y+rb.h){ this.run(); return; }
    // кнопка «стереть»
    const rc = this.clrRect;
    if(rc && x>=rc.x && x<=rc.x+rc.w && y>=rc.y && y<=rc.y+rc.h){ this.clearBlank(); return; }
  },
  draw(){
    const P = CONFIG.P;
    drawWallpaper(this.t*0.2);
    ctx.fillStyle = 'rgba(10,6,22,.72)'; ctx.fillRect(0,0,W,H);

    // ---- раскладка: окно (код + терминал + кнопки), ниже — плитки ----
    const headH = 12, codeTop = 5, lineH = 12;
    const codeH = codeTop + this.lines.length*lineH + 4;
    const btnH = 22, tilesH = 32;
    const ctrlH = H >= 210 ? 16 : 4;                 // низкий экран — строку управления жертвуем
    const termH = clamp(H - 8 - codeH - btnH - tilesH - ctrlH, 26, 170);
    const wndH = codeH + termH + btnH;
    const wndX = 4, wndW = W-8;
    const wndY = Math.max(4, Math.round((H - (wndH + 5 + tilesH + ctrlH))/2));

    // ---- окно ----
    ctx.fillStyle = UI.dark; ctx.fillRect(wndX-2, wndY-2, wndW+4, wndH+4);
    ctx.fillStyle = UI.line; ctx.fillRect(wndX-1, wndY-1, wndW+2, wndH+2);
    ctx.fillStyle = UI.face; ctx.fillRect(wndX, wndY, wndW, wndH);
    ctx.fillStyle = UI.face2; ctx.fillRect(wndX, wndY, wndW, headH);
    text('print_i_love_u.py', wndX+3, wndY+1, {sc:1, color:UI.text});
    const dot = this.mode==='err' ? P.red : (this.mode==='edit' ? P.green : P.gold);
    ctx.fillStyle = dot;
    if(this.mode!=='edit' || Math.floor(this.t*2)%2===0) ctx.fillRect(wndX+wndW-9, wndY+5, 3, 3);

    // ---- код ----
    let y = wndY + headH + codeTop;
    const x0 = wndX + 4;
    for(let li=0; li<this.lines.length; li++){
      text(String(li+1), x0, y, {sc:1, color:'#4a3670'});
      let x = x0 + 11;
      for(const s of this.lines[li]){
        if(s.b === undefined){
          const isStr = /".*"/.test(s.v);
          const col = s.v.charAt(0)==='#' ? '#5a4680' : (isStr ? P.green : '#e6dcf7');
          ctx.save(); ctx.beginPath(); ctx.rect(wndX, wndY+headH, wndW, codeH); ctx.clip();
          text(s.v, x, y, {sc:1, color:col});
          ctx.restore();
          x += textW(s.v,1);
        } else {
          const val = this.fill[s.b];
          const label = val || '???';
          const bw2 = Math.min(Math.max(textW(label,1)+6, 20), wndW - (x - wndX) - 6);
          const sel = (this.sel===s.b && this.mode==='edit');
          ctx.fillStyle = sel ? 'rgba(255,209,102,.22)' : 'rgba(107,79,160,.30)';
          ctx.fillRect(x, y-1, bw2, 11);
          ctx.fillStyle = sel ? P.gold : '#6b4fa0';
          ctx.fillRect(x, y-1, bw2, 1); ctx.fillRect(x, y+9, bw2, 1);
          if(sel && Math.floor(this.t*3)%2===0){ ctx.fillRect(x+bw2+1, y, 3, 8); }
          text(label, Math.round(x+bw2/2), y+1, {sc:1, align:'center', color: val?P.pink2:'#8f83ad'});
          this.blanksR[s.b] = {x:x, y:y-2, w:bw2, h:13};
          x += bw2;
        }
      }
      y += lineH;
    }

    // ---- терминал (внутри того же окна) ----
    const ty0 = wndY + headH + codeH;
    const hintOn = this.t < 4;
    ctx.fillStyle = UI.dark; ctx.fillRect(wndX, ty0-1, wndW, termH+2);
    ctx.fillStyle = '#0d0820'; ctx.fillRect(wndX, ty0, wndW, termH);
    ctx.fillStyle = UI.line; ctx.fillRect(wndX, ty0, wndW, 1);
    if(!(hintOn && termH < 60)) text('ТЕРМИНАЛ', wndX+wndW-3, ty0+2, {sc:1, align:'right', color:'#3a2560'});
    ctx.save(); ctx.beginPath(); ctx.rect(wndX, ty0, wndW, termH); ctx.clip();
    const maxLines = Math.max(1, Math.floor((termH-4)/10));
    const show = this.out.slice(-maxLines);
    let ly = ty0 + 3;
    for(const s of show){
      const col = /ОК|напечатано|Я ЛЮБЛЮ/.test(s) ? P.green : (/Traceback|SyntaxError|Строка|обиделась|мало|больше/.test(s) ? P.red : '#8ce99a');
      text('> '+s, wndX+3, ly, {sc:1, color:col});
      ly += 10;
    }
    if(this.mode==='edit' && Math.floor(this.t*2)%2===0){
      ctx.fillStyle = P.green; ctx.fillRect(wndX+3, Math.min(ly, ty0+termH-4), 4, 1);
    }
    if(this.out.length <= 2 && this.mode==='edit' && this.t >= 4){   // терминал пуст — «шапка» ОС
      ctx.globalAlpha = 0.5 + 0.2*Math.abs(Math.sin(this.t*1.6));
      heart(Math.round(wndX+wndW/2)-10, Math.round(ty0+termH/2)-14, 2, P.pink);
      ctx.globalAlpha = 0.75;
      text('PRINT I LOVE U OS', Math.round(wndX+wndW/2), Math.round(ty0+termH/2)+4, {sc:1, align:'center', color:'#5a4680'});
      ctx.globalAlpha = 1;
    }
    // принтер с выползающей бумагой
    const prx = wndX + wndW - 34, pry = ty0 + termH - 26;
    if(!(hintOn && termH < 60)) drawPrinter(prx, pry, 1, this.t, this.mode==='print' || this.mode==='comp');
    if(this.mode==='print'){
      const k = clamp(this.printT/1.6, 0, 1);
      const ph2 = Math.round(6 + 18*k);
      ctx.fillStyle = P.paper; ctx.fillRect(prx+4, pry-ph2+2, 16, ph2);
      ctx.fillStyle = '#c9bde8';
      for(let i=0;i<Math.floor(ph2/4);i++) ctx.fillRect(prx+6, pry-ph2+4+i*4, 12, 1);
      if(k>0.5) heart(prx+8, pry-6, 1, P.pink);
    }
    if(hintOn){                           // подсказка живёт в пустом терминале
      const a = this.t>3 ? (4-this.t) : 1, sc = 1;
      const tw2 = textW(L8.hint,sc)+8, ph2 = LH(sc)+6;
      const px2 = wndX + Math.max(2, Math.round((wndW-tw2)/2));
      const py2 = ty0 + Math.max(2, Math.round((termH-ph2)/2));
      ctx.globalAlpha = a;
      panel(px2, py2, tw2, ph2, 'rgba(10,7,26,1)', '#3a2560');
      text(L8.hint, wndX+Math.round(wndW/2), py2+4, {sc:sc, align:'center', color:P.gold});
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // ---- кнопки ----
    const byy = wndY + headH + codeH + termH;
    ctx.fillStyle = UI.line; ctx.fillRect(wndX, byy, wndW, 1);
    drawLives(this.lives, wndX+4, byy+6);
    const rw = 58, rx = wndX + wndW - rw - 4, ry = byy + 4;
    const running = (this.mode==='comp');
    drawBtn(rx, ry, rw, 14, running ? 'ЖДИТЕ...' : 'ЗАПУСК ▶', {press:running, color: running?UI.dim:P.green});
    this.runRect = {x:rx, y:ry, w:rw, h:14};
    const cw2 = 42, cx2 = rx - cw2 - 4;
    drawBtn(cx2, ry, cw2, 14, 'СТЕРЕТЬ', {color:UI.dim});
    this.clrRect = {x:cx2, y:ry, w:cw2, h:14};
    if(this.mode==='comp') drawBar(wndX+4, wndY+wndH-3, wndW-8, 3, this.modeT/0.85, P.gold);

    // ---- плитки ----
    const tly = wndY + wndH + 5;
    this.geo = {wndX:wndX, wndY:wndY, wndW:wndW, wndH:wndH, headH:headH, codeH:codeH, ty0:ty0, termH:termH, byy:byy, tly:tly};
    const cols = 4, tw2 = Math.floor((W - 10 - (cols-1)*3)/cols);
    this.tileR = [];
    for(let i=0;i<this.tiles.length;i++){
      const c = i%cols, r = Math.floor(i/cols);
      const tx = 5 + c*(tw2+3), ty2 = tly + r*15;
      const tok = this.tiles[i];
      const used = this.fill.indexOf(tok) >= 0;
      const hint = this.hintOn && CODE_ANS.indexOf(tok) >= 0 && !used;
      ctx.fillStyle = UI.dark; ctx.fillRect(tx-1, ty2-1, tw2+2, 14);
      ctx.fillStyle = used ? '#1d1136' : UI.face2; ctx.fillRect(tx, ty2, tw2, 12);
      if(hint && Math.floor(this.t*4)%2===0){ ctx.fillStyle='rgba(255,209,102,.35)'; ctx.fillRect(tx, ty2, tw2, 12); }
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(tx, ty2, tw2, 1);
      text(tok, Math.round(tx+tw2/2), ty2+2, {sc:1, align:'center', color: used ? '#5a4680' : (hint?P.gold:'#e6dcf7')});
      this.tileR.push({x:tx, y:ty2, w:tw2, h:13, tok:tok});
    }
    if(ctrlH >= 16)
      text(IS_TOUCH ? 'ТАП: ПРОПУСК → ВАРИАНТ' : 'СТРЕЛКИ · 1-8 · ENTER: ПУСК',
           Math.round(W/2), tly + 30, {sc:1, align:'center', color:'#6b4fa0'});
    if(this.mode==='err'){ ctx.fillStyle='rgba(255,107,107,.12)'; ctx.fillRect(0,0,W,H); }
    crtOverlay(this.t);
    bezel();
  }
};

G.screens.dialog.key = function(k){

/* ==========================================================================
   ЧАСТЬ 6 · «С О К»  —  всё, что делает игру живой
   Пиксельные градиенты, переходы-растворения, комбо, частицы, hit-stop,
   вспышки, всплывающие цифры, настройки экрана. Чистый пиксель-арт.
   ========================================================================== */

/* --------------------------------------------------------------------------
   0. СЛУЖЕБНОЕ: состояние «сока»
   -------------------------------------------------------------------------- */
G.crt   = 1;        // 1 = развёртка/блики, 0 = максимально чётко
G.tr    = null;     // текущий переход между экранами
G.stop  = 0;        // hit-stop: кадры «замирания» после сильного удара
G.slow  = 1; G.slowT = 0;
G.flashA = 0; G.flashCol = '#fff6e8';
G.combo = 0; G.comboT = 0; G.comboMax = 0;
G.tilt  = 0;        // микро-наклон камеры при тряске
const JUICE_MAX_FX = 420;

/* --------------------------------------------------------------------------
   1. ЦВЕТ И ПИКСЕЛЬНЫЕ ГРАДИЕНТЫ (дизеринг — без размытия, строго по пикселям)
   -------------------------------------------------------------------------- */
const BAYER4 = [
  [ 0, 8, 2,10],
  [12, 4,14, 6],
  [ 3,11, 1, 9],
  [15, 7,13, 5]
];
function mixCol(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round(lerp((pa>>16)&255, (pb>>16)&255, t));
  const g = Math.round(lerp((pa>>8)&255,  (pb>>8)&255,  t));
  const bl= Math.round(lerp(pa&255,      pb&255,      t));
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
/** Вертикальный дизеринг-градиент. Заливает КАЖДЫЙ пиксель (иначе просвечивает старый кадр). */
function ditherGradVTo(paint, x, y, w, h, cTop, cBot, steps){
  const n = Math.max(2, steps || Math.round(h/4));
  const pal = [];
  for(let i=0;i<=n;i++) pal.push(mixCol(cTop, cBot, i/n));
  for(let py=0; py<h; py++){
    const t = clamp((py+0.5)/h*n - 0.5, 0, n);
    const i0 = clamp(Math.floor(t), 0, n-1);
    const frac = t - i0;
    const cA = pal[i0], cB = pal[i0+1];
    const th = frac*16;                      // упорядоченный дизеринг Байера
    const row = BAYER4[(py+y) & 3];
    for(let px=0; px<w; px++){
      if(row[px & 3] < th) paint(cB, 0, x+px, y+py, 1, 1);
      else                paint(cA, 0, x+px, y+py, 1, 1);
    }
  }
}
/** Мягкое пятно дизерингом: туманность, свечение, луна. */
function veilBlobTo(paint, cx, cy, rad, col){
  const x0 = Math.max(0, Math.floor(cx-rad)), x1 = Math.min(W, Math.ceil(cx+rad));
  const y0 = Math.max(0, Math.floor(cy-rad)), y1 = Math.min(H, Math.ceil(cy+rad));
  for(let py=y0; py<y1; py++){
    const row = BAYER4[py & 3];
    for(let px=x0; px<x1; px++){
      const d = Math.hypot(px-cx, py-cy)/rad;
      if(d>1) continue;
      if(row[px & 3] < (1-d)*(1-d)*16) paint(col, 0, px, py, 1, 1);
    }
  }
}
/** Оборачиваем контекст в «рисовальщик» — так же рисуем в offscreen-кэш. */
function painter(c){
  let last = null;
  return function(c2, th, x, y, w, h){
    if(c2 && c2 !== last){ last = c2; c.fillStyle = c2; }
    c.fillRect(x, y, w, h);
  };
}
function ctxPainter(){
  let last = null;
  return function(c2, th, x, y, w, h){
    if(c2 && c2 !== last){ last = c2; ctx.fillStyle = c2; }
    ctx.fillRect(x, y, w, h);
  };
}
function ditherGradV(x, y, w, h, cTop, cBot, steps){
  ditherGradVTo(ctxPainter(), x, y, w, h, cTop, cBot, steps);
}
/** Полупрозрачная «шторка» дизерингом (туман, затемнение, блик). */
function ditherVeil(x, y, w, h, col, a){
  ctx.fillStyle = col;
  const th = Math.max(0, Math.min(1, a))*16;
  for(let py=0; py<h; py++){
    const row = BAYER4[py & 3];
    for(let px=0; px<w; px++) if(row[px & 3] < th) ctx.fillRect(x+px, y+py, 1, 1);
  }
}
/** Радиальное затемнение по краям кадра (пиксельная виньетка). */
function vignette(str){
  const k = str==null ? 0.5 : str;
  const step = 10;
  for(let i=0;i<step;i++){
    ctx.globalAlpha = (1-i/step)*k*0.16;
    ctx.fillStyle = '#05030c';
    ctx.fillRect(i, i, W-i*2, step);
    ctx.fillRect(i, H-i-step, W-i*2, step);
    ctx.fillRect(i, i+step, step, H-i*2-step*2);
    ctx.fillRect(W-i-step, i+step, step, H-i*2-step*2);
  }
  ctx.globalAlpha = 1;
}
/** Объёмная рамка как в старых окнах. */
function bevel(x, y, w, h, light, dark, fill){
  if(fill){ ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  ctx.fillStyle = light||'rgba(255,255,255,.22)';
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = dark||'rgba(0,0,0,.45)';
  ctx.fillRect(x, y+h-1, w, 1); ctx.fillRect(x+w-1, y, 1, h);
}
/** Мягкая «тень» под объектом. */
function dropShadow(x, y, w, h, a){
  a = a||0.35;
  ctx.fillStyle = 'rgba(6,3,14,'+a+')'; ctx.fillRect(x+2, y+3, w, h); ctx.fillRect(x+1, y+1, w, h);
  ctx.fillStyle = 'rgba(6,3,14,'+(a*0.5)+')'; ctx.fillRect(x-1, y-1, w, h);
}

/* --------------------------------------------------------------------------
   2. ЧАСТИЦЫ — много форм, гравитация, затухание
   -------------------------------------------------------------------------- */
const RINGS = [];
const POPS  = [];

/** fx(x,y,n,col,spd,life,o) — o: {ang,spread,g,drag,s,shape,fade} */
function fx(x, y, n, col, spd, life, o){
  o = o || {};
  if(FX.length > JUICE_MAX_FX) n = Math.max(1, Math.round(n*0.4));
  for(let i=0;i<n;i++){
    const a = (o.ang!=null) ? o.ang + rnd(-(o.spread||0.6), (o.spread||0.6)) : rnd(0, 6.283);
    const s = (spd==null?60:spd) * rnd(0.35, 1);
    FX.push({
      x:x, y:y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s - (o.lift||0),
      life: life||0.6, t:0,
      col: Array.isArray(col) ? col[rndi(0,col.length-1)] : col,
      s: o.s || rndi(1,2), g: (o.g==null?130:o.g), drag: (o.drag||0),
      shape: o.shape || 'px', v: s, vr: rnd(-7,7)
    });
  }
}
/** Расходящееся кольцо — удар, попадание, появление. */
function ring(x, y, col, to, life, wgt){
  RINGS.push({x:x, y:y, t:0, life:life||0.4, to:to||14, col:col||'#fff6e8', w:wgt||1});
}
/** Всплывающий текст: очки, «+5», «ИДЕАЛЬНО!». */
function popText(x, y, t, col, sc){
  POPS.push({x:x, y:y, t:t, col:col||CONFIG.P.gold, sc:sc||1, age:0, life:0.85});
}
function updateFx(dt){
  for(let i=FX.length-1;i>=0;i--){
    const p = FX[i];
    p.t += dt;
    if(p.t >= p.life){ FX.splice(i,1); continue; }
    p.vy += p.g*dt;
    if(p.drag){ p.vx -= p.vx*p.drag*dt; p.vy -= p.vy*p.drag*dt; }
    if(p.shape==='spark'){ p.rot += p.vr*dt; p.vx = Math.cos(p.rot)*p.v; p.vy = Math.sin(p.rot)*p.v; }
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  for(let i=RINGS.length-1;i>=0;i--){
    const r = RINGS[i]; r.t += dt;
    if(r.t >= r.life) RINGS.splice(i,1);
  }
  for(let i=POPS.length-1;i>=0;i--){
    const p = POPS[i]; p.age += dt;
    if(p.age >= p.life) POPS.splice(i,1);
  }
  if(G.comboT>0){ G.comboT -= dt; if(G.comboT<=0) G.combo = 0; }
}
function drawFx(){
  // кольца — под частицами
  for(const r of RINGS){
    const k = r.t/r.life, e = 1-Math.pow(1-k,2);
    const rad = r.to*e;
    ctx.globalAlpha = (1-k)*0.9;
    ringPix(r.x, r.y, rad, r.col, r.w);
    ctx.globalAlpha = 1;
  }
  for(const p of FX){
    const k = p.t/p.life;
    ctx.globalAlpha = clamp(1-k*k, 0, 1);
    ctx.fillStyle = p.col;
    if(p.shape==='line'){
      const l = 1 + p.v*0.012;
      ctx.fillRect(Math.round(p.x - Math.cos(Math.atan2(p.vy,p.vx))*l), Math.round(p.y - Math.sin(Math.atan2(p.vy,p.vx))*l), p.s*2, p.s);
    } else if(p.shape==='plus'){
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s*2, 1);
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, p.s*2);
    } else {
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    }
  }
  ctx.globalAlpha = 1;
  // всплывающие надписи
  for(const p of POPS){
    const k = p.age/p.life;
    const rise = -14*easeOut(k);
    const a = k<0.7 ? 1 : 1-(k-0.7)/0.3;
    const pop = k<0.18 ? lerp(0.6, 1, k/0.18) : 1;
    ctx.globalAlpha = clamp(a,0,1);
    const sc = p.sc*(pop>1?1:1);
    text(p.t, Math.round(p.x), Math.round(p.y+rise), {sc:sc, align:'center', color:p.col, shadow:'rgba(10,6,22,.9)'});
    ctx.globalAlpha = 1;
  }
}
function easeOut(k){ return 1-Math.pow(1-clamp(k,0,1),3); }

/* --------------------------------------------------------------------------
   3. КОМБО / СЕРИИ
   -------------------------------------------------------------------------- */
function comboAdd(n){
  n = n || 1;
  G.combo += n; G.comboT = 2.4;
  if(G.combo > G.comboMax) G.comboMax = G.combo;
}
function comboBreak(){ G.combo = 0; G.comboT = 0; }
function comboMul(){ return 1 + Math.min(1.5, Math.floor(G.combo/4)*0.25); }
/** Счётчик серии (с «ударным» появлением). align: center | left | right */
function drawCombo(x, y, label, align){
  if(G.combo < 2) return;
  const k = clamp(G.comboT/2.4, 0, 1);
  const col = G.combo>=12 ? CONFIG.P.gold : CONFIG.P.pink2;
  ctx.globalAlpha = clamp(k*2.2, 0, 1);
  const t = (label||'СЕРИЯ')+' x'+G.combo;
  const w = textW(t,1)+8;
  const X = align==='left' ? Math.round(x) : (align==='right' ? Math.round(x-w) : Math.round(x-w/2));
  const bob = G.comboT > 2.15 ? -1 : 0;
  panel(X, Math.round(y)-2+bob, w, 14, 'rgba(20,10,36,.82)', 'rgba(107,79,160,.75)');
  text(t, X+4, y+1+bob, {sc:1, color:col});
  if(G.combo>=8 && Math.floor(G.comboT*6)%2===0)
    text('★'+comboMul().toFixed(2).slice(1), X+w+3, y+1+bob, {sc:1, color:CONFIG.P.gold});
  ctx.globalAlpha = 1;
}

/* --------------------------------------------------------------------------
   4. ТРЯСКА, HIT-STOP, ВСПЫШКА
   -------------------------------------------------------------------------- */
function hitstop(sec){ G.stop = Math.max(G.stop, sec==null?0.06:sec); }
function slowmo(scale, sec){ G.slow = scale; G.slowT = sec; }
function flashScreen(col, a){ G.flashCol = col||'#fff6e8'; G.flashA = Math.max(G.flashA, a||0.5); }
/** Универсальный «удар»: тряска + стоп-кадр + кольцо + искры. */
function impact(x, y, col, mag, ringTo){
  shake(mag==null?4:mag);
  hitstop(0.05);
  ring(x, y, col||CONFIG.P.ink, ringTo||16, 0.34);
  fx(x, y, 8, col||CONFIG.P.gold, 70, 0.4, {g:60, s:1, shape:'px'});
}

/* --------------------------------------------------------------------------
   5. ПЕРЕХОДЫ: пиксельное «растворение» + бегущая строка развёртки
   -------------------------------------------------------------------------- */
const TR_B = 6;                       // размер «пикселя» растворения
let TR_CELLS = null, TR_W = -1, TR_H = -1;
function trCells(){
  const cw = Math.ceil(W/TR_B), ch = Math.ceil(H/TR_B);
  if(TR_W!==W || TR_H!==H || !TR_CELLS || TR_CELLS.length!==cw*ch){
    const R = mulberry32(1337);
    const arr = [];
    for(let i=0;i<cw*ch;i++) arr.push({i:i, k:R()});

/** Затемняющая «шторка» сверху/снизу: плотно у края, дырявенько к центру. */
function scrimTo(paint, x, y, w, h, col, aTop, aBot){
  const n = 7;
  const parts = col.split(',');
  for(let i=0;i<n;i++){
    const y0 = Math.round(y + h*i/n), y1 = Math.round(y + h*(i+1)/n);
    const th = 16*(1 - (i+0.5)/n);
    paint('rgba('+parts[0]+','+parts[1]+','+parts[2]+','+(lerp(aTop,aBot,(i+0.5)/n).toFixed(3))+')', 0);
    for(let py=y0; py<y1; py++){
      const row = BAYER4[py & 3];
      for(let px=0; px<w; px++) if(row[px & 3] < th) paint(null, 0, x+px, py, 1, 1);
    }
  }
}
let SKY = null, SKY_W = -1, SKY_H = -1;
function skyCache(){
  if(SKY && SKY_W===W && SKY_H===H) return SKY;
  SKY_W = W; SKY_H = H;
  SKY = document.createElement('canvas'); SKY.width = W; SKY.height = H;
  const paint = painter(SKY.getContext('2d'));
  const hh = Math.round(H*0.5);
  ditherGradVTo(paint, 0, 0, W, hh, '#2b1a5e', '#181038', Math.max(8, Math.round(hh/4)));
  ditherGradVTo(paint, 0, hh, W, H-hh, '#181038', '#0a0518', Math.max(8, Math.round((H-hh)/4)));
  veilBlobTo(paint, W*0.24, H*0.30, Math.max(W,H)*0.60, 'rgba(126,88,200,.20)');
  veilBlobTo(paint, W*0.82, H*0.12, Math.max(W,H)*0.46, 'rgba(76,201,240,.13)');
  veilBlobTo(paint, W*0.55, H*0.96, Math.max(W,H)*0.42, 'rgba(255,93,143,.10)');
  scrimTo(paint, 0, 0, W, 26, '4,2,14', 0.55, 0.0);      // тёмная полоса под HUD
  return SKY;
}

const BGC = {};
/** Кэшированный фоновый слой: bgCache('ключ', paint => {...}) */
function bgCache(key, build){
  const c = BGC[key];
  if(c && c.width===W && c.height===H) return c;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  build(painter(cv.getContext('2d')), W, H);
  BGC[key] = cv;
  return cv;
}
/** Кэшированное дырявое свечение (радиальное пятно) — рисуется одним drawImage. */
const BLOBS = {};
function blob(col, r){
  const k = col+'|'+r;
  if(BLOBS[k]) return BLOBS[k];
  const d = r*2+2;
  const cv = document.createElement('canvas'); cv.width = d; cv.height = d;
  const paint = painter(cv.getContext('2d'));
  for(let py=0; py<d; py++){
    const row = BAYER4[py & 3];
    for(let px=0; px<d; px++){
      const dist = Math.hypot(px-r, py-r)/r;
      if(dist>1) continue;
      if(row[px & 3] < (1-dist)*(1-dist)*16) paint(col, 0, px, py, 1, 1);
    }
  }
  BLOBS[k] = cv;
  return cv;
}
/** Мягкое пятно на экране: ditherGlow(x, y, r, col, alpha). */
function ditherGlow(x, y, r, col, a){
  const b = blob(col, Math.max(8, Math.round(r/2)));
  ctx.globalAlpha = a;
  ctx.drawImage(b, Math.round(x-b.width/2), Math.round(y-b.height/2));
  ctx.globalAlpha = 1;
}

(function(){
const R = Math.PI*2;
L6.enter = function(){
  this.hintY = 30;

  this.cx = W/2; this.cy = Math.round(H*0.55);

  this.trail = []; this.glowT = 0; this.msg = ''; this.msgT = 0;

};
L6.make = function(ang, spread){
  const r = Math.random();
  return {
    ang:ang, sp:rnd(0.30,0.62)*(Math.random()<0.5?1:-1),
    kind: (r<0.16) ? 'gold' : (r<0.30 ? 'void' : 'good'),
    cool:spread?rnd(0,0.6):0, pop:0, born:0
  };
};
L6.angDiff = function(x){ let d = x - this.a; while(d>Math.PI) d-=R; while(d<-Math.PI) d+=R; return d; };
L6.say = function(t, col){ this.msg = t; this.msgCol = col; this.msgT = 0.8; };
L6.update = function(dt){
  this.t += dt;
  const hard = this.meter > 60;
  if(hard && this.phase === 1){
    this.phase = 2; this.phaseT = 0;
    this.say('ВТОРАЯ ФАЗА!', CONFIG.P.gold);
    flashScreen(CONFIG.P.gold, .22); shake(4); confettiRain(14);
    ring(this.cx, this.cy, CONFIG.P.gold, this.R+14, .7, 1);
    for(let i=0;i<3;i++) this.items.push(this.make(rnd(0,R), false));
  }
  this.phaseT += dt;
  this.rotK = hard ? 4.1 : 3.2;
  this.decayK = hard ? 3.0 : 2.0;
  const rot = this.rotK*dt;
  if(key.left) this.a -= rot;
  if(key.right) this.a += rot;
  if(ptr.down){
    const want = Math.atan2(ptr.y-this.cy, ptr.x-this.cx);
    this.a += clamp(this.angDiff(want), -rot*1.8, rot*1.8);
  }
  this.meter -= dt*((this.decayK) + this.meter*0.018);
  const sup = 1 + this.meter*0.005;
  // след за рукой
  const tx0 = this.cx + Math.cos(this.a)*this.R, ty0 = this.cy + Math.sin(this.a)*this.R;
  this.trail.push({x:tx0, y:ty0, t:0});
  if(this.trail.length > 16) this.trail.shift();
  for(const tr of this.trail) tr.t += dt;

  for(const it of this.items){
    it.ang += it.sp*sup*dt;
    it.born += dt;
    if(it.pop>0) it.pop -= dt;
    if(it.cool>0){ it.cool -= dt; continue; }
    const d = this.angDiff(it.ang);

      it.cool = 1.1; it.pop = 0.3;

        fx(px, py, perfect?10:6, perfect?[CONFIG.P.gold,CONFIG.P.pink2,CONFIG.P.ink]:CONFIG.P.pink, 70, 0.5, {g:40, s:1});
        if(perfect){ shake(2); hitstop(0.035); this.say('ИДЕАЛЬНО!', CONFIG.P.gold); }
        if(G.combo > 0 && G.combo % 5 === 0){

          for(let i=0;i<6;i++) this.items.push(this.make(this.a + rnd(-1.6,1.6), false));
          flashScreen(CONFIG.P.pink, 0.18);

        popText(px, py-6, '+24 ЗОЛОТО', CONFIG.P.gold);
        ring(px, py, CONFIG.P.gold, 30, 0.5);

      } else if(it.kind === 'void'){

        if(this.shield > 0){
          this.shield--; Snd.clack();
          popText(px, py-6, 'ЩИТ!', CONFIG.P.green);
          ring(px, py, CONFIG.P.green, 24, 0.4);
          fx(px, py, 12, CONFIG.P.green, 90, 0.5);
        } else {
          this.meter -= 20; this.bad++; Snd.hurt();
          impact(px, py, '#b197fc', 6, 26);
          popText(px, py-6, '-20', CONFIG.P.red);
          flashScreen('#6b4fa0', 0.30);
          this.say('ПУСТОТА', '#b197fc');
        }
      } else {   // плохая цель
        comboBreak(); this.combo = 0;
        this.meter -= 12; this.bad++; Snd.hurt();
        impact(px, py, CONFIG.P.red, 4, 20);
        popText(px, py-6, '-12', CONFIG.P.red);
        this.say('МИМО', CONFIG.P.red);
      }
      if(this.bad >= 0 && Math.random() < 0.10){

        it.ang = this.a + side*rnd(2.1,3.5);

      }

};

    for(let i=0;i<=n;i++){

      const al = .30 + .22*Math.abs(Math.sin(this.t*6));
      ctx.globalAlpha = al;
      ctx.fillStyle = zc;
      ctx.fillRect(Math.round(cx+Math.cos(a)*Rr), Math.round(cy+Math.sin(a)*Rr), 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // свечение-подсказка у дуги
  if(this.glowT>0){
    ctx.globalAlpha = this.glowT; ctx.fillStyle = P.gold;
    for(let i=0;i<24;i++){ const a=this.a-0.5+i/24; ctx.fillRect(Math.round(cx+Math.cos(a)*(Rr+4)), Math.round(cy+Math.sin(a)*(Rr+4)), 2, 2); }
    ctx.globalAlpha = 1;
  }
  // цели
  for(const it of this.items){
    const px = Math.round(cx+Math.cos(it.ang)*Rr), py = Math.round(cy+Math.sin(it.ang)*Rr);
    const s = 16 + (it.pop>0?Math.round(it.pop*24):0);
    if(FXQ > .4){
      const gc = it.kind==='gold' ? P.gold : (it.kind==='void' ? '#b197fc' : P.pink2);
      glowAt(px, py, s*0.9, gc, .16 + .06*Math.sin(this.t*3 + it.ang*4));
    }
    if(it.kind === 'void'){
      const k = 1 + it.pop*1.4;
      ctx.fillStyle = '#1a0f2e';
      ctx.fillRect(px-Math.round(s*k/2)-1, py-Math.round(s*k/2)-1, Math.round(s*k)+2, Math.round(s*k)+2);
      ctx.fillStyle = '#0a0518';
      ctx.fillRect(px-Math.round(s*k/2), py-Math.round(s*k/2), Math.round(s*k), Math.round(s*k));
      ctx.fillStyle = 'rgba(177,151,252,'+(0.5+0.3*Math.sin(this.t*5)).toFixed(2)+')';
      ctx.fillRect(px-2, py-Math.round(s*k/2), 4, 1);
    } else if(it.kind === 'gold'){
      ctx.fillStyle = '#7a5a10'; ctx.fillRect(px-s/2-1, py-s/2-1, s+2, s+2);
      ctx.fillStyle = CONFIG.P.gold; ctx.fillRect(px-s/2, py-s/2, s, s);
      ctx.fillStyle = '#fff6e8';
      if(Math.floor(this.t*5)%2===0){ ctx.fillRect(px-s/2+2, py-s/2+2, 3, 2); ctx.fillRect(px+2, py+2, 2, 3); }
      heart(px-4, py-s/2-8, 1, CONFIG.P.gold);
    } else {
      if(bothP()) ctx.drawImage(IMG.her, px-s/2, py-s/2, s, s);
      else { ctx.fillStyle = P.pink2; ctx.fillRect(px-s/2, py-s/2, s, s); }
      ctx.fillStyle = '#3a2560'; ctx.fillRect(px-s/2-1, py-s/2-1, s+2, 1); ctx.fillRect(px-s/2-1, py+s/2, s+2, 1);
      heart(px-4, py-s/2-8, 1, P.pink);
    }
  }
  // след
  for(let i=0;i<this.trail.length;i++){
    const tr = this.trail[i], k = i/this.trail.length;
    if(tr.t > 0.4) continue;
    ctx.globalAlpha = (1-tr.t/0.4)*k*0.5;
    ctx.fillStyle = CONFIG.P.gold;
    ctx.fillRect(Math.round(tr.x)-1, Math.round(tr.y)-1, 2, 2);
    ctx.globalAlpha = 1;
  }
  // рука
  const tx = cx + Math.cos(this.a)*Rr, ty = cy + Math.sin(this.a)*Rr;
  for(let i=0;i<=14;i++){
    const k = i/14, x = Math.round(cx+(tx-cx)*k), y = Math.round(cy+(ty-cy)*k);
    ctx.fillStyle = (i>11) ? CONFIG.cHim.skin : CONFIG.cHim.cloth;
    ctx.fillRect(x-1, y-1, 3, 3);
  }
  ctx.fillStyle = CONFIG.cHim.skin;
  ctx.fillRect(Math.round(tx)-4, Math.round(ty)-4, 9, 9);
  ctx.fillStyle = '#c9a184';
  ctx.fillRect(Math.round(tx)-4, Math.round(ty)+5, 9, 2);
  for(let f=0;f<3;f++) ctx.fillRect(Math.round(tx)-3+f*3, Math.round(ty)-7, 2, 4);
  if(this.shield>0){
    ctx.globalAlpha = 0.35 + 0.15*Math.sin(this.t*4);
    ctx.fillStyle = CONFIG.P.green;
    for(let i=0;i<20;i++){
      const a = this.a + (i/20-0.5)*1.1;
      ctx.fillRect(Math.round(tx+Math.cos(a)*11)-1, Math.round(ty+Math.sin(a)*11)-1, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // Танжар в центре
  if(bothP()){
    const s = 26;
    ctx.fillStyle = '#241445'; ctx.fillRect(cx-s/2-2, cy-s/2-2, s+4, s+4);
    ctx.drawImage(IMG.him, cx-s/2, cy-s/2, s, s);
  } else drawGuy(cx, cy+10, CONFIG.cHim, 1, 0);
  // шкала в общей плашке
  const bw = Math.min(W-40, 180), bx = Math.round(W/2-bw/2), by = 15;
  ctx.fillStyle = 'rgba(9,5,20,.72)'; ctx.fillRect(bx-7, 0, bw+14, 25);
  ctx.fillStyle = 'rgba(107,79,160,.55)'; ctx.fillRect(bx-7, 24, bw+14, 1);
  text('ЛЮБОВЬ', W/2, 2, {sc:1, align:'center', color:this.meter>70?P.gold:P.dim});
  hudBar(bx, by, bw, 8, this.meter/100, this.meter>70?P.gold:P.pink, P.gold);
  if(this.meter<28){
    ctx.globalAlpha = 0.25+0.25*Math.sin(this.t*9);
    ctx.fillStyle = P.red; ctx.fillRect(bx, by-2, bw, 12);
    ctx.globalAlpha = 1;
  }
  if(this.phase > 1){
    const a = .5+.5*Math.abs(Math.sin(this.t*5));
    ctx.globalAlpha = a;
    text('ФАЗА 2 — БЫСТРЕЕ', W/2, 28, {sc:1, align:'center', color:P.gold});
    ctx.globalAlpha = 1;
  }
  drawCombo(6, H-15, 'ЦЕПЬ', 'left');
  if(this.msgT>0){
    ctx.globalAlpha = clamp(this.msgT*1.6,0,1);
    text(this.msg, W/2, H-16, {sc:1, align:'center', color:this.msgCol, shadow:'#120a24'});
    ctx.globalAlpha = 1;
  }
  if(this.bad>0) text('МИМО: '+this.bad, W-6, H-13, {sc:1, align:'right', color:P.red});
  vignette(0.5);
  crtOverlay(this.t); bezel();
};
})();

/* ==========================================================================
   2 · РИТМ СЕРДЦА — типы нот, «идеально», ЛИХОРАДКА
   ========================================================================== */
(function(){
const NOTE_GOOD = 0, NOTE_GOLD = 1, NOTE_SHARD = 2;
L7.enter = function(){
  this.hintY = 30;
  this.t = 0; this.meter = 50; this.bpm = 92; this.next = 1.4; this.sent = 0; this.total = 30;
  this.tx = Math.round(W*0.30); this.ty = Math.round(H*0.56); this.speed = 105;
  this.beats = []; this.pulse = 0; this.msg = ''; this.msgT = 0;
  this.hits = 0; this.miss = 0; this.perfect = 0;
  this.fever = 0; this.feverT = 0; this.rainbow = 0;
  this.travel = (W + 20 - this.tx) / this.speed;
  this.beatPhase = 0;
};
L7.update = function(dt){
  this.t += dt;
  if(this.feverT>0){
    this.feverT -= dt;
    this.fever = clamp(this.feverT/6, 0, 1);
    if(this.feverT<=0){ this.fever = 0; this.say('ЛИХОРАДКА ОКОНЧЕНА', CONFIG.P.dim); }
  }
  this.winGood = clamp(8 - (this.bpm-92)/26, 5, 8);
  this.winMax  = clamp(24 - (this.bpm-92)/7, 14, 24);
  while(this.sent < this.total && this.t > this.next - this.travel - 0.2){
    const r = Math.random();
    const kind = (r<0.14) ? NOTE_SHARD : (r<0.30 ? NOTE_GOLD : NOTE_GOOD);
    this.beats.push({tb:this.next, x:W+20, hit:false, dead:false, sounded:false, kind:kind, k:0});
    this.next += 60/this.bpm;
    this.bpm = Math.min(190, this.bpm + 3.0);
    this.sent++;
  }
  for(const b of this.beats){
    b.x = this.tx + (b.tb - this.t)*this.speed;
    b.k = clamp((W+20 - b.x)/(W+20 - this.tx), 0, 1);
    if(!b.sounded && this.t >= b.tb){
      b.sounded = true; this.pulse = 1; this.beatPhase = 1;
      Snd.note(150, 0.09, 'triangle', 0.16);
      ring(this.tx, this.ty, this.fever>0?CONFIG.P.gold:'rgba(255,93,143,', 26, 0.28);
    }
    if(!b.hit && this.t > b.tb + 0.17){
      b.dead = true; this.miss++; this.meter -= 7; Snd.bad();
      comboBreak();
      shake(3); flashScreen(CONFIG.P.red, 0.14);
      this.say('МИМО', CONFIG.P.red);
      popText(this.tx, this.ty-22 - (this.miss%3)*9, '-7', CONFIG.P.red);
    }
  }
  this.beats = this.beats.filter(b => !b.dead && b.x > -30);
  if(this.pulse>0) this.pulse -= dt*3;
  if(this.beatPhase>0) this.beatPhase -= dt*3.5;
  if(this.msgT>0) this.msgT -= dt;
  if(this.sent>=this.total && !this.beats.length && this.t > this.next + 0.5){
    if(this.meter>=100) winLevel(LEVELS.indexOf(this)); else loseLevel('Сбились с ритма. Ещё раз!');
  }
  if(this.meter>=100){ this.meter = 100; winLevel(LEVELS.indexOf(this)); }
  if(this.meter<=0) loseLevel('Сердце сбилось. Ещё разок!');
};
L7.say = function(t, col){ this.msg = t; this.msgCol = col||CONFIG.P.ink; this.msgT = 0.6; };
L7.hit = function(){
  if(this.feverT>0) slowmo(0.55, 0.12);
  let best = null, bd = 1e9;
  for(const b of this.beats){ const d = Math.abs(b.x - this.tx); if(!b.hit && d < bd){ bd = d; best = b; } }
  if(best && bd < (this.winMax||20)){
    best.hit = true; best.dead = true;
    const near = bd < (this.winGood||7);
    let gain;
    if(best.kind === NOTE_SHARD){
      comboBreak(); this.meter -= 6; Snd.hurt(); shake(5);
      flashScreen('#8a6ab0', 0.26);
      this.say('ОСКОЛОК!', '#b197fc');
      popText(this.tx, this.ty-22, '-6', '#b197fc');
      fx(this.tx, this.ty, 12, '#b197fc', 90, 0.5);
      return;
    }
    this.hits++;
    if(near) this.perfect++;
    comboAdd(1);
    const base = near ? 6 : 3.5;
    const kind = (best.kind===NOTE_GOLD) ? 2 : 1;
    const fever = this.feverT>0 ? 2 : 1;
    gain = base * kind * fever;
    this.meter += gain;
    Snd.coin();
    const col = (best.kind===NOTE_GOLD) ? CONFIG.P.gold : (near ? CONFIG.P.gold : CONFIG.P.pink2);
    popText(this.tx, this.ty-22, '+'+Math.round(gain), col);
    ring(this.tx, this.ty, col, near?24:16, 0.3);
    fx(this.tx, this.ty, near?12:7, [col, CONFIG.P.pink, CONFIG.P.ink], near?100:70, 0.5, {g:40});
    if(near){ hitstop(0.04); this.say('ИДЕАЛЬНО!', CONFIG.P.gold); }
    else if(best.kind===NOTE_GOLD) this.say('ЗОЛОТАЯ!', CONFIG.P.gold);
    else this.say('В ТАКТ', CONFIG.P.pink2);
    if(this.feverT>0) this.meter += 1;
    if(G.combo > 0 && G.combo % 8 === 0 && this.feverT<=0){
      this.feverT = 6; this.fever = 1;
      this.say('★ ЛИХОРАДКА ★', CONFIG.P.gold);
      flashScreen(CONFIG.P.gold, 0.35);
      slowmo(0.35, 0.35);
      for(let i=0;i<20;i++) fx(this.tx+rnd(-20,20), this.ty+rnd(-20,20), 1, CONFIG.P.gold, 120, 0.9, {g:0});
    }
  } else {
    this.meter -= 3; comboBreak();
    this.say('НЕ В ТАКТ', CONFIG.P.red); Snd.bad();
    popText(this.tx, this.ty-22, '-3', CONFIG.P.red);
    shake(2);
  }
};
L7.key = function(k){ if(k===' '||k==='Enter') this.hit(); };
L7.tap = function(){ this.hit(); };
L7.draw = function(){
  const P = CONFIG.P;
  if(this.feverT>0){
    const sk = Math.floor(this.t*3) % 4;
    ctx.drawImage(bgCache('fever'+sk, paint=>{
      ditherGradVTo(paint, 0, 0, W, H, '#4a1038', '#1a0620', 14);
      veilBlobTo(paint, W*0.3, H*0.35, Math.max(W,H)*0.7, 'rgba(255,93,143,.20)');
      veilBlobTo(paint, W*0.75, H*0.6, Math.max(W,H)*0.6, 'rgba(76,201,240,.14)');
    }), 0, 0);
    ctx.globalAlpha = 0.10+0.08*Math.abs(Math.sin(this.t*6));
    ctx.fillStyle = CONFIG.P.gold; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  } else {
    skyBg(this.t);
  }
  // «электрокардиограмма» на фоне
  ctx.fillStyle = 'rgba(255,93,143,.16)';
  const ekg = [0,0,0,4,-6,10,-4,0,0,0];
  for(let x=0;x<W;x++){
    const i = Math.floor(((x + this.t*40) % (W)) / (W/ekg.length));
    ctx.fillRect(x, Math.round(H*0.30) - ekg[Math.min(ekg.length-1,i)], 1, 1);
  }
  // волна такта
  const ph = 60/this.bpm;
  const bp = 1 - clamp((this.t % ph)/ph, 0, 1);
  const rad = this.R2 || Math.max(8, Math.round(this.ty*0.10));
  if(bp > 0.80){
    ctx.globalAlpha = (bp-0.80)*5;
    ringPix(this.tx, this.ty, Math.round(rad*2.2), this.feverT>0?P.gold:P.pink, 1);
    ctx.globalAlpha = 1;
  }
  // звёзды неба
  if(FXQ > .4){
    ctx.fillStyle = '#cfe0ff';
    for(let i=0;i<18;i++){
      const R = mulberry32(i*7+3);
      const x = (R()*W) | 0, y = (R()*H*0.6) | 0;
      const a = .2 + .8*Math.abs(Math.sin(this.t*(.5+R()) + R()*6));
      ctx.globalAlpha = a*.5;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
  // мишень
  const pulse = this.pulse;
  ctx.fillStyle = '#2a2050'; ctx.fillRect(this.tx-13, this.ty-13, 26, 26);
  heart(this.tx-9 - Math.round(pulse*1.5), this.ty-9 - Math.round(pulse*1.5), 2 + (pulse>0.4?1:0), P.pink);
  // сердца-ноты
  for(const b of this.beats){
    if(b.x > W+6) continue;
    // хвост у ноты
    ctx.globalAlpha = .25;
    ctx.fillStyle = b.kind===NOTE_GOLD ? P.gold : (b.kind===NOTE_SHARD ? '#b197fc' : P.pink);
    ctx.fillRect(Math.round(b.x)+4, this.ty-3, 7, 1);
    ctx.globalAlpha = 1;
    const y = this.ty-3;
    if(b.kind === NOTE_GOLD){
      heart(Math.round(b.x)-4, y, 1, P.gold);
      ctx.globalAlpha=0.5; heart(Math.round(b.x)-4, y, 1, '#fff6e8'); ctx.globalAlpha=1;
    } else if(b.kind === NOTE_SHARD){
      ctx.fillStyle = '#b197fc';
      const s2 = 4;
      ctx.fillRect(Math.round(b.x)-s2, y-s2+2, s2*2, s2*2);
      ctx.fillStyle = '#5b3fa0';
      ctx.fillRect(Math.round(b.x)-s2+1, y-s2+3, 2, 2);
      ctx.fillRect(Math.round(b.x)+s2-3, y-1, 2, 2);
      ctx.fillRect(Math.round(b.x)-1, y+s2-2, 2, 2);
    } else {
      heart(Math.round(b.x)-4, y, 1, P.pink);
      ctx.globalAlpha = 0.4; heart(Math.round(b.x)-4, y, 1, '#ffd6e4'); ctx.globalAlpha = 1;
    }
  }
  // шкала в общей плашке
  const bw = Math.min(W-40, 180), bx = Math.round(W/2-bw/2), by = 15;
  ctx.fillStyle = 'rgba(9,5,20,.72)'; ctx.fillRect(bx-7, 0, bw+14, 25);
  ctx.fillStyle = 'rgba(107,79,160,.55)'; ctx.fillRect(bx-7, 24, bw+14, 1);
  text(this.feverT>0 ? 'ЛИХОРАДКА!' : 'РИТМ', W/2, 2, {sc:1, align:'center', color:this.feverT>0?P.gold:P.dim});
  hudBar(bx, by, bw, 8, this.meter/100, this.meter>70?P.gold:P.pink, P.gold);
  ctx.fillStyle = '#120a24';
  for(let i=1;i<4;i++) ctx.fillRect(bx+Math.round(bw*i/4), by, 1, 8);
  if(this.feverT>0){
    const w2 = 30, k2 = clamp(this.feverT/6,0,1);
    ctx.fillStyle = '#120a24'; ctx.fillRect(bx, by+11, w2, 3);
    ctx.fillStyle = P.gold; ctx.fillRect(bx, by+11, Math.round(w2*k2), 3);
  }
  // сообщение
  if(this.msgT>0){
    ctx.globalAlpha = clamp(this.msgT*1.7,0,1);
    text(this.msg, this.tx, this.ty-34, {sc:1, align:'center', color:this.msgCol, shadow:'#1b1035'});
    ctx.globalAlpha = 1;
  }
  chip(6, H-13, 'ПОПАЛО: '+this.hits+'/'+this.total, P.ink);
  drawCombo(W-6, H-13, 'РИТМ', 'right');
  if(this.miss>0) text('МИМО: '+this.miss, W-6, H-26, {sc:1, align:'right', color:P.red});
  vignette(0.4);
  crtOverlay(this.t); bezel();
};
})();

/* ==========================================================================
   3 · ДОЖДЬ ИЗ СЕРДЕЦ — золото, магнит, щит, замедление, серии
   ========================================================================== */
(function(){
L1.enter = function(){
  this.hintY = 22;
  this.px = W/2; this.py = H-24; this.items=[]; this.spawn=0.5; this.t=0;
  this.caught=0; this.need=24; this.lives=3; this.miss=0;
  this.combo=0; this.best=0; this.windy=0; this.inv=0; this.pw=0; this.pwT=0; this.pwMax=0;
  this.groundH = H-12;
};
L1.update = function(dt){
  this.t += dt;
  if(this.pwT>0){ this.pwT -= dt; if(this.pwT<=0){ this.pw=0; this.pwT=0; } }
  const slow = (this.pw==='slow');
  const sp = 120*dt;
  if(key.left) this.px -= sp;
  if(key.right) this.px += sp;
  if(ptr.down){ this.px = lerp(this.px, ptr.x, 0.30); }
  this.px = clamp(this.px, 14, W-14);
  // ветер во второй половине
  const half = this.caught >= Math.round(this.need*0.5);
  if(half){
    const w = Math.sin(this.t*0.9)*26 + Math.sin(this.t*0.37)*14;
    this.windy = w;
    this.extra = (this.extra||0) - dt;
    if(this.extra <= 0){
      this.extra = 0.55;
      this.items.push(this.spawnItem(0.28));
    }
  } else this.windy = 0;
  this.spawn -= dt;
  if(this.spawn<=0){
    this.spawn = Math.max(0.20, 0.66 - this.t*0.010);
    this.items.push(this.spawnItem());
  }
  const basketY = this.py-34;
  for(const it of this.items){
    it.y += it.vy*(slow?0.45:1)*dt; it.sw += dt*3;
    if(this.windy) it.x = clamp(it.x + this.windy*dt, 8, W-8);
    if(this.pw==='magnet' && !it.bad && it.kind!=='power'){
      const dx = this.px - it.x;
      if(Math.abs(dx) < 46) it.x += Math.sign(dx)*Math.min(Math.abs(dx), 120*dt);
    }
    const dx = Math.abs(it.x - this.px), dy = Math.abs(it.y - basketY);
    if(dx < 18 && dy < 14){
      it.dead = 1;
      if(it.kind === 'power'){
        this.pw = it.power; this.pwT = (it.power==='shield'?9:5); this.pwMax = this.pwT;
        Snd.fanfare(); popText(it.x, it.y-8, POWERS.find(p=>p.id===it.power).label, '#fff6e8');
        ring(it.x, it.y, '#fff6e8', 26, 0.45);
        fx(it.x, it.y, 14, [CONFIG.P.sky, CONFIG.P.green, '#b197fc'], 90, 0.6);
        if(it.power==='shield') this.shield = 1;
        flashScreen('#fff6e8', 0.18);
      } else if(it.kind === 'gold'){
        this.caught += 3; this.combo += 3; Snd.coin();
        popText(it.x, it.y-8, '+3', CONFIG.P.gold);
        ring(it.x, it.y, CONFIG.P.gold, 24, 0.35);
        fx(it.x, it.y, 12, CONFIG.P.gold, 80, 0.5);
        hitstop(0.03);
      } else if(it.bad){
        comboBreak();
        if(this.pw==='shield'){
          this.pw = 0; this.pwT = 0; Snd.clack();
          popText(it.x, it.y-8, 'ЩИТ СПАС', CONFIG.P.green);
          ring(it.x, it.y, CONFIG.P.green, 22, 0.4);
        } else {
          this.lives--; this.inv = 1.0; Snd.hurt(); shake(5);
          impact(it.x, it.y, '#7a6ea0', 5, 22);
          flashScreen('#6b4fa0', 0.25);
        }
      } else {
        this.caught++; this.combo++;
        const perfect = dx < 9;
        Snd.coin();
        popText(it.x, it.y-8, perfect?'ТОЧНО!':'+1', perfect?CONFIG.P.gold:CONFIG.P.pink2);
        ring(it.x, it.y, perfect?CONFIG.P.gold:CONFIG.P.pink2, perfect?20:13, 0.3);
        fx(it.x, it.y, perfect?9:5, perfect?[CONFIG.P.gold,CONFIG.P.pink2]:CONFIG.P.pink, 70, 0.45, {g:60});
        if(perfect) hitstop(0.025);
        if(this.combo > this.best) this.best = this.combo;
        if(this.combo > 0 && this.combo % 6 === 0){
          popText(this.px, this.py-52, 'СЕРИЯ x'+this.combo, CONFIG.P.gold);
          for(let i=0;i<3;i++) this.items.push(this.spawnItem(0, true));
          flashScreen(CONFIG.P.pink, 0.15);
        }
      }
    }
    if(it.y > H+10){ it.dead=1; if(!it.bad && it.kind!=='power') this.miss++; }
  }
  this.items = this.items.filter(i=>!i.dead);
  if(this.inv>0) this.inv -= dt;
  if(this.caught>=this.need) winLevel(LEVELS.indexOf(this));
  else if(this.lives<=0) loseLevel('Туча попалась... давай ещё раз.');
};
L1.spawnItem = function(badP, forceGood){
  const t = this.t;
  let kind = 'heart', bad = false, power = null, gold = false;
  if(!forceGood){
    const r = Math.random();
    if(t > 4 && r < Math.min(0.26, 0.09+t*0.009)){ kind = 'cloud'; bad = true; }
    else if(r < 0.34){ kind = 'power'; power = pickPower(); }
    else if(r < 0.42){ kind = 'gold'; gold = true; }

  return {x:rnd(10,W-10), y:-8, vy:rnd(46,70)+t*2.0, bad:bad, kind:kind, power:power, sw:rnd(0,6), rot:0};
};

})();

   ЧАСТЬ 7.2 · НОВЫЕ МЕХАНИКИ (2/2): ЛАБИРИНТ, ЗОНТ, МЕМОРИ, ПРИНТЕР, КОД

/* ==========================================================================
   4 · ЛАБИРИНТ — свет фонаря, сердца-ключи (+время), два сомнения
   ========================================================================== */
(function(){
const _e = L2.enter;
L2.enter = function(){
  _e.call(this);
  this.limit = 85;
  this.fog = 1;
  this.pickups = [];
  this.got = 0;
  this.visited = 0;
  // разложить «сердечки-ключи» по лабиринту
  const cells = [];
  for(let y=1;y<this.gh-1;y++) for(let x=1;x<this.gw-1;x++)
    if(this.grid[y][x]===0 && !(x===1&&y===1) && !(x===this.goal.x&&y===this.goal.y)) cells.push([x,y]);
  const R = mulberry32(77123);
  const n = Math.min(5, cells.length);
  for(let i=0;i<n;i++){
    const c = cells.splice(Math.floor(R()*cells.length), 1)[0];
    if(!c) break;
    this.pickups.push({gx:c[0], gy:c[1], x:this.ox+(c[0]+0.5)*this.tile, y:this.oy+(c[1]+0.5)*this.tile, got:0, k:0});
  }
  // третий «сомневающийся» — быстрее
  if(this.blobs.length < 3 && cells.length){
    const c = cells[Math.floor(cells.length*0.6)];
    this.blobs.push({gx:c[0], gy:c[1], x:this.ox+(c[0]+0.5)*this.tile, y:this.oy+(c[1]+0.5)*this.tile,
                     tx:this.ox+(c[0]+0.5)*this.tile, ty:this.oy+(c[1]+0.5)*this.tile, m:0, dir:[1,0], sp:1.35});
  }
  for(const b of this.blobs) b.sp = b.sp || 1;
};
L2.update = function(dt){
  this.t += dt;
  const sp = 70*dt, r = this.rad;
  let dx=0, dy=0;
  if(key.left) dx--; if(key.right) dx++; if(key.up) dy--; if(key.down) dy++;
  if(dx) this.face = dx>0?0:1;
  if(!dx && !dy && ptr.down){
    const tx = ptr.x - this.p.x, ty = ptr.y - this.p.y;
    if(Math.abs(tx)>3) dx = tx>0?1:-1;
    if(Math.abs(ty)>3) dy = ty>0?1:-1;
  }
  const len = Math.hypot(dx,dy)||1;
  this.moveTo(this.p.x + dx/len*sp, this.p.y + dy/len*sp, r);
  // сомнения
  for(const b of this.blobs){
    b.m += dt;
    const spx = 38*b.sp*dt;
    const ddx = b.tx-b.x, ddy = b.ty-b.y;
    if(Math.hypot(ddx,ddy)>1){ b.x += Math.sign(ddx)*Math.min(Math.abs(ddx),spx); b.y += Math.sign(ddy)*Math.min(Math.abs(ddy),spx); }
    else {
      const opts = [[1,0],[-1,0],[0,1],[0,-1]].filter(o=>!this.solid(this.ox+(b.gx+o[0]+0.5)*this.tile, this.oy+(b.gy+o[1]+0.5)*this.tile));
      if(opts.length){ const o = pick(opts); b.gx+=o[0]; b.gy+=o[1];
        b.tx = this.ox+(b.gx+0.5)*this.tile; b.ty = this.oy+(b.gy+0.5)*this.tile; }
    }
    if(this.inv<=0 && Math.hypot(b.x-this.p.x, b.y-this.p.y) < this.tile*0.6){
      this.inv = 1.8; this.lives--; Snd.hurt(); shake(5);
      impact(this.p.x, this.p.y, '#b197fc', 5, 22);
      comboBreak();
    }
  }
  if(this.inv>0) this.inv -= dt;
  // сердечки-ключи
  for(const k of this.pickups){
    if(k.got) continue;
    k.k += dt;
    if(Math.hypot(k.x-this.p.x, k.y-this.p.y) < this.tile*0.75){
      k.got = 1; this.got++;
      this.limit = Math.min(120, this.limit + 6);
      Snd.coin(); comboAdd(1);
      popText(k.x, k.y-8, '+6с', CONFIG.P.gold);
      ring(k.x, k.y, CONFIG.P.gold, 20, 0.35);
      fx(k.x, k.y, 10, CONFIG.P.gold, 70, 0.5);
    }
  }
  // цель
  const gxp = this.ox + (this.goal.x+0.5)*this.tile, gyp = this.oy + (this.goal.y+0.5)*this.tile;
  if(Math.hypot(gxp-this.p.x, gyp-this.p.y) < this.tile*0.9) winLevel(LEVELS.indexOf(this));
  if(this.lives<=0) loseLevel('Сомнения догнали. Ещё раз!');
  if(this.limit > 0){
    this.limit -= dt;
    if(this.limit <= 0) loseLevel('Время вышло. Лабиринт подождёт.');
  }
};
L2.draw = function(){
  const T = this.tile, P = CONFIG.P;
  if(!this.fogPal){
    this.fogPal = {
      wall:[], floor:[], floor2:[],
      top:[], bot:[]
    };
    for(let i=0;i<=8;i++){
      const k = 0.09 + (i/8)*0.91;
      this.fogPal.wall.push(mixCol('#120a24','#4d3480', k*0.9+0.1));
      this.fogPal.top.push(mixCol('#1b1035','#6b4fa0', k));
      this.fogPal.bot.push(mixCol('#0a0518','#241445', k));
      this.fogPal.floor.push(mixCol('#0d0820','#1b1035', k));
      this.fogPal.floor2.push(mixCol('#0d0820','#22143f', k));
    }
  }
  const FP = this.fogPal;
  ctx.fillStyle = '#0a0518'; ctx.fillRect(0,0,W,H);
  const torch = this.tile*3.0 + Math.sin(this.t*9)*this.tile*0.14;
  for(let y=0;y<this.gh;y++) for(let x=0;x<this.gw;x++){
    const px0 = this.ox+x*T, py0 = this.oy+y*T;
    const cx0 = px0+T/2, cy0 = py0+T/2;
    const d = Math.hypot(cx0-this.p.x, cy0-this.p.y);
    const ki = Math.round(clamp(Math.max(0.09, 1 - d/(torch+T)), 0, 1)*8);   // туман войны
    if(this.grid[y][x]===1){
      ctx.fillStyle = FP.wall[ki];  ctx.fillRect(px0,py0,T,T);
      ctx.fillStyle = FP.top[ki];   ctx.fillRect(px0,py0,T,2);
      ctx.fillStyle = FP.bot[ki];   ctx.fillRect(px0,py0+T-2,T,2);
    } else {
      ctx.fillStyle = ((x+y)%2===0) ? FP.floor[ki] : FP.floor2[ki];
      ctx.fillRect(px0,py0,T,T);
    }
  }
  // цель (маяк)
  const gxp = this.ox + (this.goal.x+0.5)*T, gyp = this.oy + (this.goal.y+0.5)*T;
  const bd = Math.hypot(gxp-this.p.x, gyp-this.p.y);
  if(bd < 999){
    // луч-маяк: видно издалека
    const ba = .10 + .07*Math.sin(this.t*3);
    ctx.globalAlpha = ba;
    for(let i=0;i<5;i++) ctx.fillRect(Math.round(gxp)-1, Math.round(gyp) - 16 - i*6, 2, 6);
    ctx.globalAlpha = 1;
    glowAt(gxp, gyp, 16 + Math.sin(this.t*3)*2, P.pink2, .22);
  }
  drawGirl(gxp, gyp+7, CONFIG.cHer, this.psc, 0);
  heart(gxp-4, gyp-20+Math.sin(this.t*3)*2, 1, P.pink);
  // сердечки-ключи
  for(const k of this.pickups){
    if(k.got) continue;
    const b = 1 + Math.abs(Math.sin(k.k*2.2))*0.18;
    const d = Math.hypot(k.x-this.p.x, k.y-this.p.y);
    ctx.globalAlpha = clamp(0.30 + 0.70*(1-d/(this.tile*7)), 0.3, 1);   // маяк вдалеке
    heart(Math.round(k.x)-4, Math.round(k.y)-3-b*2, 1, P.gold);
    ctx.globalAlpha = 1;
  }
  // сомнения
  for(const b of this.blobs){
    const s = Math.max(3, Math.round(T*0.3));
    const cx = Math.round(b.x), cy = Math.round(b.y);
    ctx.globalAlpha = clamp(0.35 + 0.65*(1 - Math.hypot(b.x-this.p.x, b.y-this.p.y)/(this.tile*5)), 0.35, 1);
    ctx.fillStyle = '#0a0518'; ctx.fillRect(cx-s-1, cy-s-1, s*2+2, s*2+2);
    ctx.fillStyle = '#3a2560'; ctx.fillRect(cx-s, cy-s, s*2, s*2);
    ctx.fillStyle = '#8a5ab0'; ctx.fillRect(cx-s+1, cy-s+1, s*2-2, s*2-2);
    const ex = Math.round(Math.cos(b.m*2)*1), ey = Math.round(Math.sin(b.m*3)*1);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(cx-3+ex, cy-2+ey, 2, 2); ctx.fillRect(cx+2+ex, cy-2+ey, 2, 2);
    if(Math.floor(b.m*3)%2===0){ ctx.fillStyle='rgba(177,151,252,.35)'; ctx.fillRect(cx-s-2, cy-s-2, s*2+4, 1); }
    ctx.globalAlpha = 1;
  }
  // игрок
  if(!(this.inv>0 && Math.floor(this.t*20)%2)) drawGuy(this.p.x, this.p.y+7, CONFIG.cHim, this.psc, this.face);
  // фонарь: тёплое пятно + «конус» в сторону взгляда
  glowAt(this.p.x, this.p.y, torch, P.gold, .11);
  glowAt(this.p.x, this.p.y, torch*0.55, P.gold, .10);
  {
    const fa = this.face*Math.PI/2 + (this.face===0?0:0);
    for(let i=0;i<14;i++){
      const d = this.tile*0.6 + i*this.tile*0.22;
      ctx.globalAlpha = .05 * (1 - i/14);
      ctx.fillStyle = P.gold;
      ctx.fillRect(Math.round(this.p.x + Math.cos(fa)*d - 2), Math.round(this.p.y + Math.sin(fa)*d - 1), 4, 3);
    }
    ctx.globalAlpha = 1;
  }
  // пыль из-под ног
  if(Math.random() < .25) fx(this.p.x + rnd(-2,2), this.p.y + 6, 1, '#5a4680', 16, .35, {g:20, s:1});
  drawLives(this.lives, 6, 6);
  const s2 = Math.ceil(Math.max(0, this.limit||0));
  chip(W-6, 4, s2+'с', (this.limit<18 ? CONFIG.P.red : CONFIG.P.ink), true);
  text('ВЕДИ: ' + (IS_TOUCH?'ПАЛЕЦ':'СТРЕЛКИ'), W-6, 18, {sc:1, align:'right', color:'#6b4fa0'});
  if(this.got>0) chip(6, 18, 'КЛЮЧИ: '+this.got, CONFIG.P.gold);
  vignette(0.85);
  crtOverlay(this.t); bezel();
};
})();

/* ==========================================================================
   5 · НЕ ПРОМОКНИ — порывы, лужи, бонусы, зонт наклоняется
   ========================================================================== */
(function(){
L3.enter = function(){
  this.px=W/2; this.t=0; this.lives=3; this.inv=0; this.spawn=0.6; this.items=[]; this.win=40;
  this.hintY = 40;                       // подсказка — ниже HUD
  this.gust = 0; this.gustT = 6; this.tilt = 0; this.combo=0; this.dodge=0;
  this.pw = 0; this.pwT = 0; this.pwMax = 0; this.puddleY = H-10;
  this.rain = 1;
  this._boltT = rnd(3, 7);
  this.groundY = H - 16;
};
L3.update = function(dt){
  this.t += dt; this.win -= dt;
  updateLightning(this, dt);
  const sp = 130*dt*(this.pw==='slow'?0.55:1);
  const px0 = this.px;
  if(key.left) this.px -= sp;
  if(key.right) this.px += sp;
  if(ptr.down) this.px = lerp(this.px, ptr.x, 0.25);
  this.px = clamp(this.px, 12, W-12);
  this.tilt = lerp(this.tilt, clamp((this.px-px0)/(dt*130),-1,1)*0.35, 0.25);
  if(this.pwT>0){ this.pwT -= dt; if(this.pwT<=0) this.pw=0; }
  // порывы ветра — телеграф + рывок
  this.gustT -= dt;
  if(this.gustT <= 0){
    this.gustT = rnd(4.5, 7);
    this.gustDir = Math.random()<0.5?-1:1;
    this.gust = 0.9;             // сила
    this.gustTell = 0.9;         // предупреждение
  }
  if(this.gustTell > 0){
    this.gustTell -= dt;
    if(this.gustTell <= 0) this.gust = 1.1;
  } else if(this.gust > 0) this.gust -= dt*0.8;
  const wind = (this.t>14 ? Math.sin(this.t*0.8)*20 : 0) + (this.gust>0 ? this.gustDir*this.gust*70 : 0);
  this.wind = wind;
  this.spawn -= dt;
  if(this.spawn<=0){
    this.spawn = Math.max(0.13, 0.5 - this.t*0.008);
    const r = Math.random();
    const kind = r<0.18 ? 'heart' : (r<0.40 ? 'cloud' : (r<0.48 ? 'power' : 'drop'));
    this.items.push({x:rnd(8,W-8), y:-10, vy:rnd(90,150)+this.t*1.6, kind:kind, sw:rnd(0,6), power: kind==='power'?pickPower():null});
  }
  for(const it of this.items){
    it.y += it.vy*dt; it.sw += dt*4;
    it.x = clamp(it.x + wind*dt*0.5, 5, W-5);
    if(Math.abs(it.x-this.px) < 11 && Math.abs(it.y-(H-30)) < 15){
      it.dead = 1;
      if(it.kind==='heart'){
        Snd.coin(); comboAdd(1); this.combo++;
        popText(it.x, it.y-6, '+', CONFIG.P.pink2);
        fx(it.x, it.y, 6, CONFIG.P.pink, 60, 0.4);
        if(G.combo>0 && G.combo%5===0) popText(this.px, H-60, 'ДОЖДЬ x'+G.combo, CONFIG.P.gold);
      } else if(it.kind==='power'){
        this.pw = it.power; this.pwT = 5; this.pwMax = 5;
        Snd.fanfare(); popText(it.x, it.y-6, POWERS.find(p=>p.id===it.power).label, CONFIG.P.ink);
        ring(it.x, it.y, '#fff6e8', 22, 0.4);
      } else if(this.inv<=0){
        if(it.kind==='cloud'){
          if(this.pw==='shield'){ this.pw=0; this.pwT=0; Snd.clack(); popText(it.x,it.y-6,'ЩИТ',CONFIG.P.green); }
          else { this.lives--; this.inv=1.0; Snd.hurt(); shake(5); impact(it.x,it.y,'#6ea0ff',5,20); flashScreen('#3a5a8a',0.22); comboBreak(); }
        } else {
          this.inv = 0.7; Snd.blip(); this.lives -= 0;
          fx(it.x,it.y,6,'#6ea0ff',50,0.35);
        }
      }
    }
    if(it.y>H+8) it.dead=1;
  }
  this.items = this.items.filter(i=>!i.dead);
  if(this.inv>0) this.inv -= dt;
  if(this.win<=0){ winLevel(LEVELS.indexOf(this)); }
  if(this.lives<=0) loseLevel('Промок... но я быстро!');
};
L3.draw = function(){
  const P = CONFIG.P;
  // фон: дождь + мокрое небо (дизеринг — один раз, дальше из кэша)
  ctx.drawImage(bgCache('rain', paint=>{ ditherGradVTo(paint,0,0,W,H,'#2a2050','#141024',12); veilBlobTo(paint,W*0.3,H*0.2,W*0.7,'rgba(90,70,150,.25)'); }), 0, 0);
  clouds(this.t, 8, 5, 0.35);

  drawCity(this.t, this.groundY, false);

  for(let i=0;i<3;i++){
    const yy = this.groundY - 4 - i*5;

    ctx.fillStyle = '#8fa8d8';

    ctx.globalAlpha = 1;
  }
  // капли: толще, под углом ветра, с брызгами о землю
  const wind = this.wind || 0;
  const rainN = 54;
  const sl = clamp(wind*0.12, -6, 6);
  for(let i=0;i<rainN;i++){
    const R = mulberry32(i*3+5);
    const x = (R()*W + this.t*(34 + sl*3) + wind*this.t*8) % W;
    const y = (R()*H + this.t*300) % H;
    ctx.fillStyle = i%4 ? 'rgba(140,180,255,.30)' : 'rgba(190,220,255,.5)';
    ctx.fillRect(Math.round(x), Math.round(y), 1, 5 + (i%4)*2);
    ctx.fillRect(Math.round(x+sl*0.5), Math.round(y+5), 1, 1);
  }
  // вспышка молнии
  drawLightning(this.t, this._bolt);
  // порыв — стрелки
  if(this.gustTell>0){
    const dir = this.gustDir;
    ctx.globalAlpha = 0.25 + 0.35*Math.abs(Math.sin(this.t*10));
    ctx.fillStyle = P.sky;
    for(let i=0;i<3;i++){
      const ax = dir>0 ? (10+i*14) : (W-10-i*14), ay = 40;
      ctx.fillRect(ax, ay, 6, 1); ctx.fillRect(ax-dir*2, ay, 2, 1);
    }
    ctx.globalAlpha = 1;
  }
  if(this.wind && Math.abs(this.wind) > 20){
    ctx.globalAlpha = 0.3;
    for(let i=0;i<8;i++){
      const y = ((i*41 + this.t*70) % (H-30)) + 10;
      const x = ((i*97 + this.t*220) % (W+30)) - 15;
      ctx.fillStyle = P.sky; ctx.fillRect(Math.round(x), Math.round(y), 8, 1);
    }
    ctx.globalAlpha = 1;
  }
  // предметы
  for(const it of this.items){
    const x = Math.round(it.x + Math.sin(it.sw)*3), y = Math.round(it.y);
    if(it.kind==='drop'){
      ctx.fillStyle='#6ea0ff'; ctx.fillRect(x-1,y-4,2,6); ctx.fillRect(x-2,y-2,4,2);
    } else if(it.kind==='power'){
      ctx.fillStyle='rgba(255,246,232,.22)'; ctx.fillRect(x-8,y-8,16,16);
      drawPowerIcon(it.power, x-6, y-6, this.t+it.sw);
    } else if(it.kind==='cloud'){
      ctx.fillStyle='#3c3358'; ctx.fillRect(x-9,y-5,18,7);
      ctx.fillStyle='#4e4372'; ctx.fillRect(x-5,y-9,11,5); ctx.fillRect(x-1,y-12,7,4);
      ctx.fillStyle='#8ce99a'; ctx.fillRect(x-1,y+2,2,4);
    } else heart(x-4,y-3,1,P.pink);
  }
  // мокрая земля + отражения + лужи с кругами от капель
  wetGround(H-12, this.t);
  ctx.fillStyle='#2f5a8a';
  const poff = Math.floor(this.t*7)%23;
  for(let i=0;i<W;i+=23) ctx.fillRect((i+poff)%W, H-8, Math.min(10, W-((i+poff)%W)), 2);
  drawPuddles(this.t, H-11);
  // отражение зонта в луже
  ctx.globalAlpha = .12;
  ctx.fillStyle = P.pink;
  ctx.fillRect(Math.round(this.px)-9, H-11, 18, 2);
  ctx.globalAlpha = 1;
  // игрок с зонтом (наклон)
  const bx=Math.round(this.px), by=H-16;
  drawGuy(this.px, H-14, CONFIG.cHim, 2, 0);
  const uy = H-14-32, tl = Math.round(this.tilt*6);
  ctx.fillStyle='#2a2050'; ctx.fillRect(bx-1+tl,uy+4,2,14);
  ctx.fillStyle=P.pink;
  ctx.fillRect(bx-17+tl,uy,34,4); ctx.fillRect(bx-14+tl,uy-3,28,3); ctx.fillRect(bx-9+tl,uy-6,18,3); ctx.fillRect(bx-3+tl,uy-9,6,3);
  ctx.fillStyle=P.pink2; ctx.fillRect(bx-17+tl,uy,34,1);
  // капли скатываются по зонту
  if(Math.floor(this.t*8)%2===0){
    ctx.fillStyle='rgba(180,220,255,.7)';
    const dx2 = bx + Math.round(Math.sin(this.t*3)*12);
    ctx.fillRect(dx2, uy+2, 1, 2);
  }
  if(this.pw==='shield'){
    ctx.globalAlpha = 0.4+0.15*Math.sin(this.t*5);
    for(let i=0;i<20;i++){
      const a = Math.PI + i/19*Math.PI;
      ctx.fillStyle = P.green;
      ctx.fillRect(Math.round(bx+Math.cos(a)*20), Math.round(uy+2+Math.sin(a)*20), 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // HUD
  const bw = W-64;
  hudBar(6,6,bw,7, this.win/40, CONFIG.P.gold);
  chip(W-6, 4, Math.ceil(Math.max(0,this.win))+'с', this.win<8?CONFIG.P.red:CONFIG.P.ink, true);
  drawLives(this.lives, 6, 18);
  if(this.pw && this.pwT>0) powerTimer(this.pw, this.pwT, this.pwMax||this.pwT, W-42, 6);
  drawCombo(6, H-15, 'ДОЖДЬ','left');
  if(this.inv>0 && Math.floor(this.t*20)%2){ ctx.globalAlpha=0.18; ctx.fillStyle=P.red; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  vignette(0.55);
  crtOverlay(this.t); bezel();
};
})();

/* ==========================================================================
   6 · МЕМОРИ — 8 пар 4×4, одна золотая пара, подсказка, перемешивание
   ========================================================================== */
(function(){
const MEM_PAIR = 8;
L4.enter = function(){
  this.t = 0; this.moves=0; this.found=0; this.flip=[]; this.wait=0; this.winT=0;
  this.limit = 115;
  this.pairN = MEM_PAIR;
  this.hint = 'ОТКРОЙ ВСЕ '+MEM_PAIR+' ПАР';
  this.hints = 2; this.hintT = 0; this.hintBtn = null;
  this.streak = 0; this.streakT = 0; this.shuffleFlash = 0;
  this.goldPair = 3;                      // какая пара золотая (даёт время)
  const cols = 4, rows = 4;
  const cw = Math.floor((W-20)/cols), chh = Math.floor((H-84)/rows);
  const s = Math.max(16, Math.min(cw-6, chh-6));
  this.cols=cols; this.rows=rows; this.cs=s;
  this.ox = Math.round((W - (cols*(s+6)-6))/2);
  this.oy = Math.round((H - (rows*(s+6)-6))/2) + 8;
  const pool = ICONS.slice(0, MEM_PAIR);
  const deck = [];
  for(let i=0;i<pool.length;i++){ deck.push(pool[i]); deck.push(pool[i]); }
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  this.goldName = pool[this.goldPair];
  this.hintY = 22;                       // подсказка под HUD
  this.cards = deck.map((n,i)=>({
    n:n, open:false, done:false, gold:(n===this.goldName), flipT:0, hintFlash:0,
    x: this.ox + (i%cols)*(s+6), y: this.oy + Math.floor(i/cols)*(s+6)
  }));
  this.sel = 0;
};
L4.cardAt = function(x,y){
  for(const c of this.cards){ if(x>=c.x && x<=c.x+this.cs && y>=c.y && y<=c.y+this.cs) return c; }
  return null;
};
L4.update = function(dt){
  this.t += dt;
  for(const c of this.cards){
    if(c.flipT>0) c.flipT -= dt;
    if(c.hintFlash>0) c.hintFlash -= dt;
  }
  if(this.wait>0){
    this.wait -= dt;
    if(this.wait<=0){ for(const c of this.flip) c.open=false; this.flip=[]; }
  }
  if(this.winT>0){ this.winT -= dt; if(this.winT<=0){ this.winT=0; winLevel(LEVELS.indexOf(this)); } }
  if(this.hintT>0) this.hintT -= dt;
  if(this.streakT>0){ this.streakT -= dt; if(this.streakT<=0) this.streak=0; }
  if(this.shuffleFlash>0) this.shuffleFlash -= dt;
  if(this.limit > 0){
    this.limit -= dt;
    if(this.limit <= 0 && this.found < this.pairN) loseLevel('Карты устали ждать. Ещё раз?');
  }
};
L4.doOpen = function(c){
  if(!c || c.open || c.done || this.wait>0 || this.flip.length>=2) return;
  c.open = true; c.flipT = 0.22; this.flip.push(c); Snd.flip();
  if(this.flip.length===2){
    this.moves++;
    const [a,b] = this.flip;
    if(a.n===b.n){
      a.done=b.done=true; this.found++;
      const cx = a.x+this.cs/2, cy = a.y+this.cs/2;
      if(a.gold){
        this.limit = Math.min(140, this.limit + 12);
        popText(cx, a.y-2, '+12с', CONFIG.P.gold);
        ring(cx, cy, CONFIG.P.gold, 30, 0.55);
        fx(cx, cy, 14, CONFIG.P.gold, 80, 0.6);
        Snd.fanfare(); flashScreen(CONFIG.P.gold, 0.18);
      } else {
        ring(cx, cy, CONFIG.P.pink, 20, 0.4);
        fx(cx, cy, 8, CONFIG.P.pink, 60, 0.5);
        Snd.coin();
      }
      if(this.streakT>0){
        this.streak++;
        this.limit = Math.min(140, this.limit + 4);
        popText(cx, a.y-this.cs/2+4, 'СЕРИЯ +4с', CONFIG.P.green);
      } else this.streak = 1;
      this.streakT = 6;
      this.flip = [];
      if(this.found>=this.pairN){ this.winT = 0.8; }
      else if(this.found % 3 === 0 && Math.random() < 0.55) this.doShuffle();
    } else { this.wait = 0.7; Snd.bad(); comboBreak(); }
  }
};
L4.doShuffle = function(){
  const closed = this.cards.filter(c=>!c.done);
  const slots = closed.map(c=>({x:c.x, y:c.y}));
  const buckets = {};
  for(const c of closed) (buckets[c.n] = buckets[c.n] || []).push(c);
  let si = 0;
  for(const n in buckets){
    const arr = buckets[n];
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    for(const c of arr){ const sl = slots[si++]; if(sl){ c.x=sl.x; c.y=sl.y; } c.open=false; }
  }
  this.flip=[]; this.wait=0; this.shuffleFlash=0.6;
  Snd.bad(); popText(W/2, 8, 'ПЕРЕМЕШАЛИ!', CONFIG.P.red);
};
L4.useHint = function(){
  if(this.hints<=0 || this.winT>0 || this.wait>0) return;
  const closed = this.cards.filter(c=>!c.done);
  if(closed.length < 2) return;
  const a = closed[0], b = closed.find(c=>c!==a && c.n===a.n);
  if(!b) return;
  a.hintFlash = 1.3; b.hintFlash = 1.3; this.hintT = 1.3;
  this.hints--; Snd.coin();
  popText(a.x+this.cs/2, a.y-4, 'Вот эта пара!', CONFIG.P.gold);
};
L4.key = function(k){
  if(k==='ArrowLeft'){ this.sel=(this.sel+this.cards.length-1)%this.cards.length; Snd.blip(); }
  if(k==='ArrowRight'){ this.sel=(this.sel+1)%this.cards.length; Snd.blip(); }
  if(k==='ArrowUp'){ this.sel=(this.sel+this.cards.length-this.cols)%this.cards.length; Snd.blip(); }
  if(k==='ArrowDown'){ this.sel=(this.sel+this.cols)%this.cards.length; Snd.blip(); }
  if(k===' '||k==='Enter') this.doOpen(this.cards[this.sel]);
  if(k==='h'||k==='H'||k==='р'||k==='Р') this.useHint();
};
L4.tap = function(x,y){
  const hb = this.hintBtn;
  if(hb && x>=hb.x && x<=hb.x+hb.w && y>=hb.y && y<=hb.y+hb.h){ this.useHint(); return; }
  const c=this.cardAt(x,y); if(c){ this.sel=this.cards.indexOf(c); this.doOpen(c); }
};
L4.draw = function(){
  const P = CONFIG.P;
  skyBg(this.t);
  if(this.shuffleFlash>0){ ctx.globalAlpha=this.shuffleFlash*0.4; ctx.fillStyle='#b197fc'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  // HUD
  chip(6, 4, 'ПАР '+this.found+'/'+this.pairN+'  ХОДЫ '+this.moves, this.found>=this.pairN?P.gold:P.ink);
  const s2 = Math.ceil(Math.max(0,this.limit||0));
  chip(W-6, 4, s2+'с', (this.limit<20?P.red:P.ink), true);
  if(this.streak>1) chip(W-6, 19, 'СЕРИЯ x'+this.streak, P.green, true);
  for(let i=0;i<this.cards.length;i++){
    const c = this.cards[i], s=this.cs;
    const isSel = (i===this.sel);
    const isc = Math.max(1, Math.floor(s/12));
    const flipK = c.flipT>0 ? Math.max(0.2, Math.abs(Math.cos((1-c.flipT/0.22)*Math.PI/2))) : 1;
    const fw = Math.max(2, Math.round(s*flipK));
    const fx0 = c.x + Math.round((s-fw)/2);
    if(c.done || c.open){
      ctx.fillStyle='#3a2560'; ctx.fillRect(fx0-2, c.y-2, fw+4, s+4);
      ctx.fillStyle = c.gold ? '#3a2a10' : '#1d1136';
      ctx.fillRect(fx0, c.y, fw, s);
      if(c.gold && c.done && Math.floor(this.t*4)%2===0){
        ctx.fillStyle = 'rgba(255,209,102,.20)'; ctx.fillRect(fx0, c.y, fw, s);
      }
      drawIconAt(c.n, fx0+fw/2, c.y+s/2, isc, c.gold?P.gold:(c.done?P.pink2:P.ink));
    } else {
      ctx.fillStyle='#241445'; ctx.fillRect(fx0-2,c.y-2,fw+4,s+4);
      ctx.fillStyle = isSel ? '#5a3f96' : '#3a2560';
      ctx.fillRect(fx0,c.y,fw,s);
      ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(fx0,c.y,fw,1);
      ctx.fillStyle='rgba(0,0,0,.18)';
      for(let yy=3;yy<s-3;yy+=3) for(let xx=3;xx<fw-3;xx+=3) ctx.fillRect(fx0+xx, c.y+yy, 1, 1);
      if(fw>=16){
        ctx.globalAlpha = 0.55;
        heart(fx0+fw/2, c.y+s/2, Math.max(1, Math.floor(s/24)), isSel?P.pink2:'#6b4fa0');
        ctx.globalAlpha = 1;
      }
      if(isSel){ ctx.fillStyle=P.gold; ctx.fillRect(fx0-1,c.y-1,2,2); ctx.fillRect(fx0+fw-1,c.y-1,2,2); }
    }
    if(c.hintFlash>0){
      ctx.fillStyle = 'rgba(255,209,102,'+(clamp(c.hintFlash,0,1)*0.45).toFixed(2)+')';
      ctx.fillRect(c.x-3,c.y-3,s+6,s+6);
    }
  }
  // кнопка подсказки
  const bw = 96, bx = W-bw-6, by = H-22;
  drawBtn(bx, by, bw, 14, this.hints>0 ? 'ПОДСКАЗКА x'+this.hints : 'ПОДСКАЗКИ НЕТ', {dis: this.hints<=0, color: this.hints>0?P.gold:UI.dim});
  this.hintBtn = {x:bx, y:by, w:bw, h:14};
  vignette(0.5);
  crtOverlay(this.t); bezel();
};
})();

/* ==========================================================================
   ЧАСТЬ 7.3 · НОВЫЕ МЕХАНИКИ (3/3): ПРИНТЕР (заедание, серия) и КОД (2 этапа)

/* ==========================================================================
   7 · PRINT I LOVE YOU — кассета, заедание бумаги, серия, финальный вывод
   ========================================================================== */
(function(){
const _d5 = L5.draw;
L5.enter = function(){
  this.t=0; this.phrase = (CONFIG.phrase||'Я ЛЮБЛЮ ТЕБЯ').toUpperCase();
  this.i=0; this.err=0; this.done=false; this.doneT=0; this.shake=0; this.ink=0;
  this.streak = 0; this.best = 0;
  this.paper = 0;            // 0..1 — кассета/бумага
  this.jam = 0;              // время заедания
  this.jamTotal = 0;
  this.feed = 0;             // анимация протяжки бумаги
  this.broke = false;
  this.keys = this.layout();
  this.kbTop = this.keys.length ? Math.min.apply(null, this.keys.map(k=>k.y)) : H-30;
};
L5.type = function(ch){
  if(this.done) return;
  if(ch === this.phrase[this.i]){
    this.i++; this.ink = 0.14; this.feed = 1; Snd.clack();
    this.streak++; if(this.streak > this.best) this.best = this.streak;
    this.paper += 0.09;
    const k = this.keys.find(k=>k.ch===ch);
    if(k) fx(k.x+k.w/2, k.y+k.h/2, 3, CONFIG.P.gold, 40, 0.3);
    if(this.streak>0 && this.streak%5===0){
      popText(W/2, this.paperY(54)+8, 'СЕРИЯ x'+this.streak, CONFIG.P.gold);
      Snd.coin();
    }
    if(this.paper >= 1 && this.jam<=0){
      this.paper = 0; this.jam = 1.25; this.jamTotal += 1.25;
      this.msg = 'ЗАЕДАЕТ БУМАГА';
      Snd.hurt(); shake(5); flashScreen('#c9bde8', 0.18);
      this.paperYoke = this.paperY(54);
    }
    if(this.i >= this.phrase.length){ this.done = true; this.doneT = 0; Snd.win(); fx(W/2, H/2, 30, CONFIG.P.pink, 110, 0.9); }
  } else {
    this.err++; this.shake = 3; this.streak = 0; Snd.bad();
    this.paper = Math.min(1, this.paper + 0.12);
    comboBreak();
  }
};
L5.update = function(dt){
  this.t += dt;
  if(this.shake>0) this.shake -= dt*10;
  if(this.ink>0) this.ink -= dt;
  if(this.feed>0) this.feed -= dt*3;
  if(this.jam>0){
    this.jam -= dt;
    if(this.jam <= 0){ this.jam = 0; this.msg = ''; }
  }
  if(this.done){ this.doneT += dt; if(this.doneT>1.6) winLevel(LEVELS.indexOf(this)); }
  if(this.err>=3 && !this.broke){ this.broke = true; loseLevel('Опечатался. Но смысл тот же.'); }
};
L5.key = function(k){
  if(k===' ' && this.jam>0) this.jam = Math.min(this.jam, 0.25);   // помогаем принтеру, но печатаем
  if(k.length===1) this.type(k.toUpperCase());
  if(k==='Backspace' && this.i>0){ this.i--; Snd.blip(); }
};
L5.tap = function(x,y){
  for(const kb of this.keys){ if(x>=kb.x && x<=kb.x+kb.w && y>=kb.y && y<=kb.y+kb.h){ this.type(kb.ch); return; } }
  // тап по принтеру во время заедания — чиним
  if(this.jam>0 && y > this.paperY(54)-4 && y < this.paperY(54)+40){
    this.jam = Math.min(this.jam, 0.25); Snd.clack();
  }
};
L5.draw = function(){
  _d5.call(this);
  const P = CONFIG.P, cx = W/2;
  const py0 = this.paperY(54);
  // заедание: дёрганая бумага + красная лампа
  if(this.jam>0){
    const j = Math.round(Math.sin(this.t*40)*(1-this.jam)*1.5);
    ctx.globalAlpha = 0.5 + 0.3*Math.sin(this.t*12);
    ctx.fillStyle = P.red; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    text('ЗАЕДАЕТ БУМАГА! ПРОБЕЛ', cx, py0-10, {sc:1, align:'center', color:P.red, shadow:'#120a24'});
    // «мятая» бумага
    ctx.fillStyle = 'rgba(180,160,200,.25)';
    for(let i=0;i<4;i++) ctx.fillRect(cx-40+j, py0+6+i*10, 80, 1);
  }
  // запас бумаги — вертикальной полоской справа от принтера
  if(!this.done){
    const gx = Math.round(cx)+33, gy = py0+54+8, gh2 = 26;
    ctx.fillStyle = '#120a24'; ctx.fillRect(gx-1, gy-1, 9, gh2+2);
    ctx.fillStyle = '#241445'; ctx.fillRect(gx, gy, 7, gh2);
    const kk = clamp(this.paper,0,1);
    ctx.fillStyle = this.paper>0.7 ? P.red : (this.paper>0.4 ? P.gold : P.green);
    ctx.fillRect(gx+1, gy+gh2-1-Math.round((gh2-2)*kk), 5, Math.round((gh2-2)*kk));
    for(let i=1;i<4;i++){ ctx.fillStyle = 'rgba(18,10,36,.8)'; ctx.fillRect(gx+1, gy+Math.round(gh2*i/4), 5, 1); }
  }
  if(this.streak>=3) drawCombo(cx, H-26, 'РИТМ ПЕЧАТИ');
  if(this.best>this.streak && this.streak===0 && this.i>0) chip(6, H-14, 'ЛУЧШАЯ СЕРИЯ: '+this.best, P.gold);
  // финальный вывод бумаги
  if(this.done){
    const k = clamp((this.doneT-0.4)/1.0, 0, 1);
    if(k>0){
      ctx.globalAlpha = k*0.5; ctx.fillStyle = P.paper;
      ctx.fillRect(W/2-40, H-4, 80, 4+18*k);
      ctx.globalAlpha = 1;
      for(let i=0;i<10;i++){
        const a = this.doneT*2 + i*0.63;

        heart(Math.round(x), Math.round(y), 1, i%3===0?P.gold:P.pink);

};
