/* ==========================================================================
   ДВИЖОК: экран, масштаб, ввод
   ========================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 320, H = 180, SCALE = 1, ORIENT = 0;

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function fit(){
  const vw = innerWidth, vh = innerHeight;
  const portrait = vh > vw*1.08;
  if(portrait){ W = 240; H = clamp(Math.round(240*vh/vw), 300, 470); }
  else { H = 240; W = clamp(Math.round(240*vw/vh), 300, 470); }
  cv.width = W; cv.height = H;
  SCALE = Math.min(vw/W, vh/H);
  if(!isFinite(SCALE) || SCALE<=0) SCALE = 1;
  cv.style.width = Math.floor(W*SCALE)+'px';
  cv.style.height = Math.floor(H*SCALE)+'px';
  ctx.imageSmoothingEnabled = false;
  if(ORIENT !== (portrait?1:0)){ ORIENT = portrait?1:0; if(G.needRelayout) G.needRelayout(); }
}
addEventListener('resize', ()=>{ fit(); });
addEventListener('orientationchange', ()=>setTimeout(fit,120));

// ---- клавиатура
const key = {left:0,right:0,up:0,down:0};
const pressed = {};      // нажатые в этом кадре
addEventListener('keydown', e=>{
  const k = e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Tab'].includes(k)) e.preventDefault();
  if(!pressed[k]){ G.onKey(k); }
  pressed[k] = true;
  if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ф'||k==='Ф') key.left=1;
  if(k==='ArrowRight'||k==='d'||k==='D'||k==='в'||k==='В') key.right=1;
  if(k==='ArrowUp'||k==='w'||k==='W'||k==='ц'||k==='Ц') key.up=1;
  if(k==='ArrowDown'||k==='s'||k==='S'||k==='ы'||k==='Ы'||k==='и'||k==='И') key.down=1;
  Snd.unlock();
});
addEventListener('keyup', e=>{
  const k = e.key; pressed[k] = false;
  if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ф'||k==='Ф') key.left=0;
  if(k==='ArrowRight'||k==='d'||k==='D'||k==='в'||k==='В') key.right=0;
  if(k==='ArrowUp'||k==='w'||k==='W'||k==='ц'||k==='Ц') key.up=0;
  if(k==='ArrowDown'||k==='s'||k==='S'||k==='ы'||k==='Ы'||k==='и'||k==='И') key.down=0;
});

// ---- мышь / палец
const ptr = {x:0,y:0,down:0,tap:0,dx:0};
function toLocal(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  const p = toLocal(e); ptr.x=p.x; ptr.y=p.y; ptr.down=1; ptr.tap=1;
  Snd.unlock(); G.onTap(p.x,p.y);
});
cv.addEventListener('pointermove', e=>{ const p=toLocal(e); ptr.dx = p.x-ptr.x; ptr.x=p.x; ptr.y=p.y; });
cv.addEventListener('pointerup', e=>{ ptr.down=0; });
cv.addEventListener('pointercancel', e=>{ ptr.down=0; });
cv.addEventListener('contextmenu', e=>e.preventDefault());
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints>0;

/* ==========================================================================
   ЗВУК (WebAudio, без файлов)
   ========================================================================== */
const Snd = {
  ac:null, master:null, musicGain:null, on:true, musicOn:true, t:0, step:0, timer:null,
  unlock(){
    if(!this.ac){
      const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination);
      this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.22; this.musicGain.connect(this.master);
      this.startMusic();
    }
    if(this.ac.state === 'suspended') this.ac.resume();
  },
  note(freq, dur, type, vol, when, dest){
    if(!this.ac || !this.on) return;
    const t0 = (when||this.ac.currentTime);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type||'square'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol==null?0.16:vol, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(dest||this.master); o.start(t0); o.stop(t0+dur+0.02);
  },
  slide(f1,f2,dur,type,vol){
    if(!this.ac || !this.on) return;
    const t0=this.ac.currentTime, o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f1,t0); o.frequency.linearRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(vol==null?0.14:vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.02);
  },
  noise(dur,vol){
    if(!this.ac || !this.on) return;
    const n = Math.floor(this.ac.sampleRate*dur);
    const buf = this.ac.createBuffer(1,n,this.ac.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const s = this.ac.createBufferSource(); s.buffer = buf;
    const g = this.ac.createGain(); g.gain.value = vol==null?0.12:vol;
    s.connect(g); g.connect(this.master); s.start();
  },
  blip(){ this.note(660,0.05,'square',0.07); },
  type(){ this.note(rnd(1100,1500),0.03,'square',0.05); },
  coin(){ this.note(880,0.06,'square',0.12); setTimeout(()=>this.note(1320,0.10,'square',0.12),60); },
  hurt(){ this.slide(400,90,0.28,'sawtooth',0.16); },
  bad(){ this.slide(220,140,0.16,'square',0.11); },
  clack(){ this.noise(0.05,0.10); this.note(180,0.05,'triangle',0.10); },
  flip(){ this.note(520,0.05,'triangle',0.10); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.note(f,0.16,'square',0.13),i*90)); },
  fanfare(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>this.note(f,0.22,'square',0.13),i*130)); },
  // ---- музыка
  CH:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],
  ARP:[0,1,2,1,2,1,0,2],
  hz(m){ return 440*Math.pow(2,(m-69)/12); },
  startMusic(){
    const stepDur = 0.20; // 8-е при 150bpm
    let when = this.ac.currentTime+0.1;
    const tick = ()=>{
      if(!this.ac) return;
      const now = this.ac.currentTime;
      while(when < now+0.4){
        const s = this.step, bar = Math.floor(s/8)%4, i = s%8;
        const ch = this.CH[bar];
        if(this.musicOn){
          // бас
          if(i%2===0) this.note(this.hz(ch[0]-24),0.20,'triangle',0.22,when,this.musicGain);
          else if(i===5) this.note(this.hz(ch[0]-17),0.14,'triangle',0.14,when,this.musicGain);
          // арпеджио
          const n = ch[this.ARP[i]]+12;
          this.note(this.hz(n),0.16,'square',0.10,when,this.musicGain);
          if(i===0) this.note(this.hz(ch[2]+24),0.10,'square',0.05,when,this.musicGain);
        }
        this.step++; when += stepDur;
      }
    };
    tick(); this.timer = setInterval(tick, 120);
  }
};

/* ==========================================================================
   ТЕКСТ (bitmap-шрифт, кириллица, одинаково на всех устройствах)
   ========================================================================== */
function glyphOf(ch){ return F.g[ch] || F.g['?'] || null; }
function textW(t, sc){ sc=sc||1; let w=0; for(const ch of t){ const g=glyphOf(ch); w += ((g?g[0]:3)+1); } return Math.max(0,w-1)*sc; }
const TC = new Map();
function textImg(t, sc, color){
  const k = sc+'|'+color+'|'+t; let c = TC.get(k); if(c) return c;
  const w = Math.max(1,Math.ceil(textW(t,sc))), h = F.cell*sc;
  c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d'); g.fillStyle = color;
  let x = 0;
  for(const ch of t){
    const G = glyphOf(ch);
    if(!G){ x += 4*sc; continue; }
    const gw=G[0], gh=G[1], y0=G[2], rows = G[3] ? G[3].split(',') : [];
    for(let r=0;r<rows.length;r++){
      const v = parseInt(rows[r],16); if(!v) continue;
      let run = -1;
      for(let b=0;b<=gw;b++){
        const on = b<gw && ((v>>b)&1);
        if(on && run<0) run = b;
        else if(!on && run>=0){ g.fillRect((x+run)*sc,(y0+r)*sc,(b-run)*sc,sc); run=-1; }
      }
    }
    x += (gw+1)*sc;
  }
  if(TC.size>700) TC.clear();
  TC.set(k,c); return c;
}
// y = верхняя граница строки
function text(t, x, y, o){
  o = o||{};
  const sc = o.sc||1, color = o.color||CONFIG.P.ink;
  const img = textImg(t, sc, color);
  let dx = Math.round(x);
  if(o.align==='center') dx = Math.round(x - img.width/2);
  else if(o.align==='right') dx = Math.round(x - img.width);
  const dy = Math.round(y - 3*sc);
  if(o.shadow){ const s = textImg(t,sc,o.shadow); ctx.drawImage(s, dx+sc, dy+sc); }
  ctx.drawImage(img, dx, dy);
  return img.width;
}
function LH(sc){ return Math.round(12*(sc||1)); }
function wrap(t, maxW, sc){
  const words = t.split(' '); const lines = []; let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(textW(test,sc) > maxW && cur){ lines.push(cur); cur = w; } else cur = test;
  }
  if(cur) lines.push(cur);
  return lines.length?lines:[''];
}

   ========================================================================== */
function px(rows, x, y, sc, pal){
  for(let r=0;r<rows.length;r++){
    const row = rows[r]; let run = -1, cur = '';
    for(let i=0;i<=row.length;i++){
      const c = i<row.length ? row[i] : '.';
      if(c!==cur){
        if(run>=0 && cur!=='.' && pal[cur]){ ctx.fillStyle = pal[cur]; ctx.fillRect(x+run*sc, y+r*sc, (i-run)*sc, sc); }
        run = i; cur = c;
      }
    }
  }
}

function drawGirl(x, y, c, sc, flip){

const HRT = [
  ".##..##.",
  "########",
  "########",
  ".######.",
  "..####..",
  "...##..."
];
function heart(x, y, sc, col){
  ctx.fillStyle = col;
  for(let r=0;r<HRT.length;r++){
    const row = HRT[r]; let run=-1;
    for(let i=0;i<=row.length;i++){
      const on = i<row.length && row[i]==='#';
      if(on && run<0) run=i;
      else if(!on && run>=0){ ctx.fillRect(x+run*sc, y+r*sc, (i-run)*sc, sc); run=-1; }
    }
  }
}
function heartWH(sc){ return [8*sc, 6*sc]; }
// мягкое свечение (пиксельными кольцами)
function glow(x,y,r,col,a){
  ctx.globalAlpha = a;
  for(let i=3;i>=1;i--){
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x,y,r*i/3,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function panel(x,y,w,h,fill,border){
  ctx.fillStyle = border||'#3a2560'; ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle = fill||'#241445'; ctx.fillRect(x,y,w,h);
}
function stars(t){
  // фон-звёзды, детерминированные
  const R = mulberry32(7);
  for(let i=0;i<70;i++){
    const sx = Math.floor(R()*W), sy = Math.floor(R()*H*0.8), ph = R()*6.28;
    const a = 0.25+0.5*Math.abs(Math.sin(t*1.2+ph));
    ctx.fillStyle = 'rgba(255,246,232,'+a.toFixed(2)+')';
    const s = R()<0.15?2:1;
    ctx.fillRect(sx, sy, s, s);
  }
}
function skyBg(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241350'); g.addColorStop(0.55,'#1b1035'); g.addColorStop(1,'#120a24');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  stars(t);
  // луна
  ctx.fillStyle = '#ffeccf'; ctx.fillRect(W-30,18,14,14);
  ctx.fillStyle = '#241350'; ctx.fillRect(W-26,15,10,10);
}
function clouds(t, y0, n, alpha){
  for(let i=0;i<n;i++){
    const R = mulberry32(100+i);
    const sp = 6+R()*10;
    let cx = ((R()*W + t*sp) % (W+60)) - 30;
    const cy = y0 + R()*30;
    ctx.fillStyle = 'rgba(120,90,170,'+(alpha||0.25)+')';
    ctx.fillRect(cx,cy,26,6); ctx.fillRect(cx+6,cy-4,14,5); ctx.fillRect(cx+10,cy-7,8,4);
  }
}

const NODE_META = [
  {name:'РУКА', sub:'держись за руку'},                 // из Print I Love U
  {name:'РИТМ', sub:'попади в сердцебиение'},           // из Print I Love U
  {name:'СЕРДЦА', sub:'лови сердца'},
  {name:'ЛАБИРИНТ', sub:'найди меня'},
  {name:'ЗОНТ', sub:'уклонись от грусти'},
  {name:'МЕМОРИ', sub:'найди 8 пар'},
  {name:'PRINT', sub:'напечатай главное'},
  {name:'ПИСЬМО', sub:'только для тебя'}
];
G.screens.map = {
  enter(){ this.t = 0; G.sel = heartsDone()===NH ? NH : clamp(G.sel, 0, NH-1); },
  nodes(){
    const n = NODE_META.length;
    const cols = W>=H ? 4 : 2;
    const rows = Math.ceil(n/cols);
    const pad = 10;
    const aw = W-pad*2, ah = H-70;
    const cw = aw/cols, ch = ah/rows;
    const out = [];
    for(let i=0;i<n;i++){
      const c = i%cols, r = Math.floor(i/cols);
      out.push({ x: pad + cw*(c+0.5), y: 34 + ch*(r+0.5), i:i });
    }
    return out;
  },
  update(dt){ this.t += dt; },
  draw(){
    skyBg(this.t); clouds(this.t, 10, 3, 0.15);
    const P = CONFIG.P, N = this.nodes();
    text('СОБЕРИ '+NH+' СЕРДЕЦ', W/2, 10, {sc:1, align:'center', color:P.dim});
    // прогресс
    for(let i=0;i<NH;i++){
      const x = W/2 - (NH*18)/2 + i*18;
      heart(x, 22, 2, G.hearts[i] ? P.pink : '#3a2560');
    }
    // дорожка
    ctx.fillStyle = '#3a2560';
    for(let i=0;i<N.length-1;i++){
      const a = N[i], b = N[i+1];
      const steps = 16;
      for(let s=0;s<=steps;s++){
        const x = lerp(a.x,b.x,s/steps), y = lerp(a.y,b.y,s/steps);
        if(Math.floor((s + this.t*6)%4)<2) ctx.fillRect(Math.round(x),Math.round(y),2,2);
      }
    }
    // узлы
    for(const n of N){
      const i = n.i;
      const locked = i<NH ? false : heartsDone()<NH;
      const done = i<NH ? G.hearts[i] : false;
      const selN = (i===G.sel);
      const r = 15;
      const bob = selN ? Math.sin(this.t*5)*2 : 0;
      const x = Math.round(n.x), y = Math.round(n.y+bob);
      const pulse = (i===NH && heartsDone()===NH && !selN);
      if(pulse){
        const g = 0.25+0.35*Math.abs(Math.sin(this.t*2.5));
        ctx.fillStyle = 'rgba(255,209,102,'+g.toFixed(2)+')';
        ctx.fillRect(x-r-5,y-r-5,(r+5)*2,(r+5)*2);
      }
      if(selN){ ctx.fillStyle = 'rgba(255,209,102,.18)'; ctx.fillRect(x-r-4,y-r-4,(r+4)*2,(r+4)*2); }
      ctx.fillStyle = locked ? '#241445' : (done ? '#4a1f3d' : '#2d1a54');
      ctx.fillRect(x-r,y-r,r*2,r*2);
      ctx.fillStyle = locked ? '#3a2560' : (selN?P.gold:(done?P.pink:'#6b4fa0'));
      ctx.fillRect(x-r,y-r,r*2,2); ctx.fillRect(x-r,y+r-2,r*2,2);
      ctx.fillRect(x-r,y-r,2,r*2); ctx.fillRect(x+r-2,y-r,2,r*2);
      // иконка
      drawNodeIcon(i, x, y, locked ? '#4a3670' : (done?P.pink2:P.gold));
      // подпись
      const nm = NODE_META[i].name;
      const sc = textW(nm,1) > (W>=H?90:100) ? 1 : 1;
      text(nm, x, y+r+4, {sc:1, align:'center', color: locked? '#5a4680' : (selN?P.ink:P.dim)});
      if(done) heart(x+r-2, y-r-2, 1, P.pink);
    }
    const sub = G.sel===NH && heartsDone()===NH ? 'ОТКРЫТЬ ПИСЬМО ♥' : (G.sel<NH?NODE_META[G.sel].sub:'');
    text(textW(sub,1) > W-10 ? NODE_META[clamp(G.sel,0,NH)].sub : sub, W/2, H-26, {sc:1, align:'center', color:P.dim});
    const hintLong = IS_TOUCH ? 'ТАПАЙ ПО ИКОНКАМ' : 'СТРЕЛКИ — ВЫБОР, ПРОБЕЛ — ВХОД, М — МУЗЫКА';
    const hintShort = IS_TOUCH ? 'ТАПАЙ ПО ИКОНКАМ' : 'СТРЕЛКИ + ПРОБЕЛ';
    text(textW(hintLong,1) > W-10 ? hintShort : hintLong, W/2, H-14, {sc:1, align:'center', color:'#6b4fa0'});
  },
  key(k){
    const cols = W>=H ? 4 : 2, len = NODE_META.length;
    if(k==='ArrowLeft'){ G.sel = (G.sel + len - 1) % len; Snd.blip(); }
    if(k==='ArrowRight'){ G.sel = (G.sel + 1) % len; Snd.blip(); }
    if(k==='ArrowUp'){ G.sel = (G.sel + len - cols) % len; Snd.blip(); }
    if(k==='ArrowDown'){ G.sel = (G.sel + cols) % len; Snd.blip(); }
    if(k==='r'||k==='R'||k==='к'||k==='К'){ G.hearts = new Array(NH).fill(false); save(); Snd.bad(); }
    if(k===' '||k==='Enter') this.choose();
  },
  tap(x,y){
    const N = this.nodes();
    for(const n of N){ if(Math.abs(x-n.x)<20 && Math.abs(y-n.y)<24){ G.sel = n.i; Snd.blip(); this.choose(); return; } }
  },
  choose(){
    const i = G.sel;
    if(i<NH){ startLevel(i); }
    else { if(heartsDone()===NH){ Snd.fanfare(); go('letter'); } else Snd.bad(); }
  }
};
function drawNodeIcon(i, x, y, col){
  ctx.fillStyle = col;
  const p = (px,py,w,h)=>ctx.fillRect(x+px,y+py,w,h);
  if(i===0){            // рука
    p(-4,0,9,7);
    p(-4,-4,2,5); p(-1,-5,2,6); p(2,-4,2,5);
    p(5,1,2,4);
    p(-3,7,7,3);
  } else if(i===1){     // ритм: сердце + звуковые волны
    heart(x-4, y-3, 1, col);
    p(-9,-2,2,5); p(-7,-1,1,3);
    p(7,-2,2,5); p(6,-1,1,3);
  } else if(i===2){     // сердце
    heart(x-4, y-3, 1, col);
  } else if(i===3){     // лабиринт
    for(let r=0;r<3;r++) for(let c=0;c<3;c++) if((r+c)%2===0) p(-8+c*6,-8+r*6,5,5);
  } else if(i===4){     // зонт
    p(-8,-6,17,3); p(-7,-8,15,2); p(-4,-12,9,4); p(-1,-3,2,9); p(-1,5,3,2);
  } else if(i===5){     // карты
    p(-9,-8,7,11); p(2,-8,7,11);
    ctx.fillStyle = '#241445'; p(-8,-7,5,9); p(3,-7,5,9); ctx.fillStyle = col;
  } else if(i===6){     // принтер
    p(-9,-2,18,9); p(-7,-8,14,6); p(-6,-6,12,1); p(-7,7,14,2);
  } else {              // письмо
    p(-9,-6,18,12); p(-8,-5,16,10);
    ctx.fillStyle = '#241445';
    for(let k=0;k<9;k++){ ctx.fillRect(x-8+k, y-5+k, 1,1); ctx.fillRect(x+8-k, y-5+k, 1,1); }
    ctx.fillStyle = col;
    p(-8,5,16,1);
  }
}

G.screens.dialog = {
  enter(){ this.t=0; Snd.unlock(); },
  update(dt){
    this.t += dt;
    const d = G.dialog; if(!d) return;
    const line = d.lines[d.i];
    if(!line) return;
    if(d.chars < line.text.length){
      d.chars += dt*38;
      if(Math.floor(d.chars) !== this.lastChar){ this.lastChar = Math.floor(d.chars); if(this.lastChar%2===0) Snd.type(); }
      if(d.chars > line.text.length) d.chars = line.text.length;
    }
  },
  advance(){
    const d = G.dialog; if(!d) return;
    const line = d.lines[d.i];
    if(d.chars < line.text.length){ d.chars = line.text.length; return; }
    d.i++; d.chars = 0; this.lastChar = -1;
    if(d.i >= d.lines.length){ const nx = d.next; G.dialog = null; nx(); }
    else Snd.blip();
  },
  key(k){ if(!G.dialog) return; if(k===' '||k==='Enter') this.advance(); },
  tap(){ if(!G.dialog) return; this.advance(); },

/* ---------------------------------------------------------------- УРОВЕНЬ 2 */
const L2 = {
  name:'ЛАБИРИНТ ЧУВСТВ',
  hint:'НАЙДИ МЕНЯ В КОНЦЕ ЛАБИРИНТА',
  intro:[D('him','До тебя иногда надо пройти через лабиринт.'),D('him','Но я его всегда прохожу. Ищи меня в самом конце.')],
  outro:[D('her','Ты нашёл меня.'),D('him','Я бы искал тебя вечно.')],
  enter(){
    const availW = W-16, availH = H-56;
    let t = clamp(Math.round(Math.min(availW,availH)/15), 12, 18);
    let cols = Math.max(4, Math.floor((availW/t - 1)/2));
    let rows = Math.max(3, Math.floor((availH/t - 1)/2));
    // подгоняем, чтобы точно влезло
    while(rows>3 && (rows*2+1)*t > availH) rows--;
    while(cols>4 && (cols*2+1)*t > availW) cols--;
    this.tile = t; this.cols = cols; this.rows = rows;
    this.psc = t >= 16 ? 2 : 1;                 // масштаб спрайта
    this.rad = Math.max(2.5, t*0.30);           // радиус столкновения (важно: меньше коридора)
    this.gw = cols*2+1; this.gh = rows*2+1;
    const R = mulberry32(20240913);
    const grid = [];
    for(let y=0;y<this.gh;y++){ grid.push(new Array(this.gw).fill(1)); }
    const vis = [];
    for(let y=0;y<rows;y++){ vis.push(new Array(cols).fill(false)); }
    const stack = [[0,0]]; vis[0][0]=true; grid[1][1]=0;
    while(stack.length){
      const [cx,cy] = stack[stack.length-1];
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); const tmp=dirs[i]; dirs[i]=dirs[j]; dirs[j]=tmp; }
      let moved = false;
      for(const [dx,dy] of dirs){
        const nx=cx+dx, ny=cy+dy;
        if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&!vis[ny][nx]){
          vis[ny][nx]=true; grid[ny*2+1][nx*2+1]=0; grid[cy*2+1+dy][cx*2+1+dx]=0;
          stack.push([nx,ny]); moved=true; break;
        }
      }
      if(!moved) stack.pop();
    }
    this.grid = grid;
    // BFS: самая дальняя клетка — цель
    const dist = []; for(let y=0;y<this.gh;y++) dist.push(new Array(this.gw).fill(-1));
    const q=[[1,1]]; dist[1][1]=0; let far=[1,1];
    while(q.length){
      const [x,y]=q.shift();
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy;
        if(nx>=0&&ny>=0&&nx<this.gw&&ny<this.gh&&grid[ny][nx]===0&&dist[ny][nx]<0){
          dist[ny][nx]=dist[y][x]+1; q.push([nx,ny]);
          if(dist[ny][nx]>dist[far[1]][far[0]]) far=[nx,ny];
        }
      }
    }
    this.goal = {x:far[0], y:far[1]};
    this.ox = Math.round((W - this.gw*this.tile)/2);
    this.oy = Math.round((H - this.gh*this.tile)/2) - 4;
    this.p = {x: this.ox + 1.5*this.tile, y: this.oy + 1.5*this.tile};
    this.lives = 3; this.t = 0; this.inv = 1.0; this.face = 0;
    // блуждающие «сомнения»
    const open = [];
    for(let y=1;y<this.gh-1;y++) for(let x=1;x<this.gw-1;x++) if(grid[y][x]===0 && (x!==1||y!==1) && !(x===far[0]&&y===far[1])) open.push([x,y]);
    this.blobs = [];
    for(let i=0;i<Math.min(2, Math.floor(open.length/10));i++){
      const c = open[Math.floor(R()*open.length*0.8)+Math.floor(open.length*0.15)];
      this.blobs.push({gx:c[0], gy:c[1], x:0,y:0, tx:0,ty:0, m:0, dir:[1,0]});
      this.blobs[i].x = this.ox + (c[0]+0.5)*this.tile;
      this.blobs[i].y = this.oy + (c[1]+0.5)*this.tile;
      this.blobs[i].tx = this.blobs[i].x; this.blobs[i].ty = this.blobs[i].y;
    }
  },
  solid(x,y){
    const gx = Math.floor((x-this.ox)/this.tile), gy = Math.floor((y-this.oy)/this.tile);
    if(gx<0||gy<0||gx>=this.gw||gy>=this.gh) return true;
    return this.grid[gy][gx]===1;
  },
  moveTo(nx,ny,r){
    if(!this.solid(nx-r, this.p.y-r) && !this.solid(nx+r, this.p.y-r) && !this.solid(nx-r, this.p.y+r) && !this.solid(nx+r, this.p.y+r)) this.p.x = nx;
    if(!this.solid(this.p.x-r, ny-r) && !this.solid(this.p.x+r, ny-r) && !this.solid(this.p.x-r, ny+r) && !this.solid(this.p.x+r, ny+r)) this.p.y = ny;
  },
  update(dt){
    this.t += dt;
    const sp = 70*dt, r = this.rad;
    let dx=0, dy=0;
    if(key.left) dx--; if(key.right) dx++; if(key.up) dy--; if(key.down) dy++;
    if(dx) this.face = dx>0?0:1;
    if(!dx && !dy && ptr.down){
      const tx = ptr.x - this.p.x, ty = ptr.y - this.p.y;
      if(Math.abs(tx)>3) dx = tx>0?1:-1; else dx=0;
      if(Math.abs(ty)>3) dy = ty>0?1:-1; else dy=0;
      if(dx) this.face = dx>0?0:1;
    }
    const len = Math.hypot(dx,dy)||1;
    this.moveTo(this.p.x + dx/len*sp, this.p.y + dy/len*sp, r);
    // блуждалки
    for(const b of this.blobs){
      b.m += dt;
      const spx = 38*dt;
      const ddx = b.tx-b.x, ddy = b.ty-b.y;
      if(Math.hypot(ddx,ddy)>1){ b.x += Math.sign(ddx)*Math.min(Math.abs(ddx),spx); b.y += Math.sign(ddy)*Math.min(Math.abs(ddy),spx); }
      else {
        const opts = [[1,0],[-1,0],[0,1],[0,-1]].filter(o=>!this.solid(this.ox+(b.gx+o[0]+0.5)*this.tile, this.oy+(b.gy+o[1]+0.5)*this.tile));
        if(opts.length){ const o = pick(opts); b.gx+=o[0]; b.gy+=o[1];
          b.tx = this.ox+(b.gx+0.5)*this.tile; b.ty = this.oy+(b.gy+0.5)*this.tile; }
      }
      if(this.inv<=0 && Math.hypot(b.x-this.p.x, b.y-this.p.y) < this.tile*0.6){
        this.inv = 1.8; this.lives--; Snd.hurt(); shake(5);
        fx(this.p.x, this.p.y, 10, '#b197fc', 60, 0.5);
      }
    }
    if(this.inv>0) this.inv -= dt;
    // цель
    const gxp = this.ox + (this.goal.x+0.5)*this.tile, gyp = this.oy + (this.goal.y+0.5)*this.tile;
    if(Math.hypot(gxp-this.p.x, gyp-this.p.y) < this.tile*0.9) winLevel(LEVELS.indexOf(this));
    if(this.lives<=0) loseLevel('Сомнения догнали. Ещё раз!');
  },
  draw(){
    ctx.fillStyle = '#120a24'; ctx.fillRect(0,0,W,H);
    const T = this.tile;
    for(let y=0;y<this.gh;y++) for(let x=0;x<this.gw;x++){
      const px0 = this.ox+x*T, py0 = this.oy+y*T;
      if(this.grid[y][x]===1){
        ctx.fillStyle = '#3a2560'; ctx.fillRect(px0,py0,T,T);
        ctx.fillStyle = '#4d3480'; ctx.fillRect(px0,py0,T,2);
        ctx.fillStyle = '#241445'; ctx.fillRect(px0,py0+T-2,T,2);
      } else {
        ctx.fillStyle = ((x+y)%2===0)? '#1b1035' : '#1d1138'; ctx.fillRect(px0,py0,T,T);
      }
    }
    // свет вокруг игрока
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(this.p.x, this.p.y, T*3.2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    // цель
    const gxp = this.ox + (this.goal.x+0.5)*T, gyp = this.oy + (this.goal.y+0.5)*T;
    glow(gxp, gyp-6, 12, 'rgba(255,168,198,', 0.20);
    drawGirl(gxp, gyp+7, CONFIG.cHer, this.psc, 0);
    heart(gxp-4, gyp-20+Math.sin(this.t*3)*2, 1, CONFIG.P.pink);
    // блуждалки
    for(const b of this.blobs){
      const s = Math.max(3, Math.round(this.tile*0.3));
      ctx.fillStyle = '#5a3a7a';
      ctx.fillRect(Math.round(b.x)-s, Math.round(b.y)-s, s*2, s*2);
      ctx.fillStyle = '#8a5ab0';
      ctx.fillRect(Math.round(b.x)-s+1, Math.round(b.y)-s+1, s*2-2, s*2-2);
      ctx.fillStyle = '#120a24';
      ctx.fillRect(Math.round(b.x)-2, Math.round(b.y)-2, 2, 2); ctx.fillRect(Math.round(b.x)+1, Math.round(b.y)-2, 2, 2);
    }
    // игрок
    if(!(this.inv>0 && Math.floor(this.t*20)%2)) drawGuy(this.p.x, this.p.y+7, CONFIG.cHim, this.psc, this.face);
    drawLives(this.lives, 6, 6);
    text('ВЕДИ: ' + (IS_TOUCH?'ПАЛЕЦ':'СТРЕЛКИ'), W-6, 4, {sc:1, align:'right', color:CONFIG.P.dim});
  }
};

const ICONS = ['heart','letter','flower','star','moon','note'];
function drawIcon(name, x, y, s, col){
  ctx.fillStyle = col;
  const p=(a,b,w,h)=>ctx.fillRect(x+a*s,y+b*s,w*s,h*s);
  if(name==='heart'){ heart(x, y, s, col); }
  else if(name==='letter'){
    p(0,0,10,7); ctx.fillStyle='#241445'; p(1,1,8,5); ctx.fillStyle=col;
    for(let i=0;i<5;i++){ ctx.fillRect(x+(1+i)*s, y+(1+i*0.9)*s, s, s); ctx.fillRect(x+(9-i)*s, y+(1+i*0.9)*s, s, s); }
  }
  else if(name==='flower'){
    p(4,4,2,2);
    p(3,1,4,3); p(1,3,3,4); p(6,3,3,4); p(3,6,4,3);
    ctx.fillStyle='#241445'; p(4,4,2,2); ctx.fillStyle=col; p(4,4,1,1);
    p(4,8,2,3);
  }
  else if(name==='star'){
    p(4,0,2,2); p(3,2,4,2); p(0,4,10,2); p(2,6,6,2); p(3,8,2,2); p(5,8,2,2);
  }
  else if(name==='moon'){
    p(2,0,6,2); p(1,2,4,8); p(5,2,4,8);
    ctx.fillStyle='#241445'; p(3,1,6,2); p(2,3,4,2); ctx.fillStyle=col;
  }
  else if(name==='note'){
    p(1,5,3,4); p(3,1,2,8); p(4,1,5,2); p(8,1,2,6);
  }
}
const ICON_H = {heart:6, letter:7, flower:11, star:10, moon:10, note:9};
function drawIconAt(name, cx, cy, s, col){
  const w = (name==='heart'?8:10)*s, h = (ICON_H[name]||10)*s;
  drawIcon(name, Math.round(cx - w/2), Math.round(cy - h/2), s, col);
}
const L4 = {

  outro:[D('her','У меня хорошая память на тебя.'),D('him','Это взаимно.')],
  enter(){

    const cols = 4, rows = Math.ceil(pairN*2/cols);

    this.oy = Math.round((H - (rows*(s+6)-6))/2) + 6;
    const pool = ICONS.slice(0, pairN);
    const deck = []; for(const n of pool){ deck.push(n); deck.push(n); }
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
    this.cards = deck.map((n,i)=>({n:n, open:false, done:false, fa:0, pop:0, sh: rnd(0,6.28),
      x:this.ox + (i%cols)*(s+6), y:this.oy + Math.floor(i/cols)*(s+6)}));

  cardAt(x,y){

  },
  open(c){
    if(!c || c.open || c.done || this.wait>0 || this.flip.length>=2) return;
    c.open = true; this.flip.push(c); Snd.flip();
    if(this.flip.length===2){
      this.moves++;
      const [a,b] = this.flip;
      if(a.n===b.n){
        a.done=b.done=true; a.pop=b.pop=0.45; this.found++; this.flip=[]; Snd.coin();
        this.streak++; if(this.streak > this.best) this.best = this.streak;

      } else {

        poof((a.x+b.x)/2+this.cs/2, (a.y+b.y)/2+this.cs/2, '#6b4fa0');
      }
    }
  },
  update(dt){
    this.t += dt;
    if(this.sayStreak>0) this.sayStreak -= dt;
    for(const c of this.cards){
      c.fa = approach(c.fa, c.open?1:0, 0.0005, dt);
      if(c.pop>0) c.pop = Math.max(0, c.pop - dt);

    if(k===' '||k==='Enter') this.open(this.cards[this.sel]);

    this.i=0; this.err=0; this.done=false; this.doneT=0; this.shake=0; this.ink=0;
    this.keys = this.layout();
  },
  layout(){
    // уникальные символы фразы + пробел
    let chars = [];
    for(const ch of this.phrase) if(!chars.includes(ch)) chars.push(ch);
    const kbW = Math.min(W-8, 216);
    const maxCols = Math.max(4, Math.floor(kbW/19));
    const keyW = Math.floor(kbW/maxCols), keyH = 16;
    const rowsN = Math.ceil(chars.length/maxCols);
    const kbX = Math.round((W - maxCols*keyW)/2);
    const kbY = H - 12 - rowsN*(keyH+3);
    this.kbTop = kbY; this.kbRows = rowsN;
    const keys = chars.map((ch,i)=>({
      ch:ch, x:kbX + (i%maxCols)*keyW, y:kbY + Math.floor(i/maxCols)*(keyH+3),
      w:keyW-2, h:keyH
    }));
    return keys;
  },
  type(ch){
    if(this.done) return;
    if(ch === this.phrase[this.i]){
      this.i++; this.ink = 0.14; Snd.clack();
      const k = this.keys.find(k=>k.ch===ch);
      if(k) fx(k.x+k.w/2, k.y+k.h/2, 4, CONFIG.P.gold, 40, 0.3);
      if(this.i >= this.phrase.length){ this.done = true; this.doneT = 0; Snd.win(); fx(W/2, H/2, 30, CONFIG.P.pink, 110, 0.9); }
    } else {
      this.err++; this.shake = 3; Snd.bad();

  update(dt){

    if(k.length===1) this.type(k.toUpperCase());
    if(k==='Backspace' && this.i>0){ this.i--; Snd.blip(); }
  },
  tap(x,y){
    for(const kb of this.keys){ if(x>=kb.x && x<=kb.x+kb.w && y>=kb.y && y<=kb.y+kb.h){ this.type(kb.ch); return; } }

  drawPrinter(cx, by){
    const P = CONFIG.P;

    ctx.fillStyle='#3a2560'; ctx.fillRect(cx-30,by-22,60,26);

  paperY(ph){                       // бумага с принтером — по центру между подсказкой и клавиатурой
    const kbTop = (this.kbTop==null) ? H-30 : this.kbTop;
    const topLimit = 44, blockH = ph + 40;
    const want = Math.round((kbTop - 10 - blockH - topLimit)/2) + topLimit;

      ctx.globalAlpha = 1;

    // клавиатура
    for(const kb of this.keys){
      const hot = (!this.done && kb.ch === this.phrase[this.i]);

    this.R = Math.round(Math.min(W*0.33, H*0.30));
    this.items = [];
    for(let i=0;i<5;i++) this.items.push(this.make(Math.random()*6.283, true));
  },
  make(ang, spread){
    return {ang:ang, sp:rnd(0.30,0.62)*(Math.random()<0.5?1:-1), bad:Math.random()<(this.badP||0.34), cool:spread?rnd(0,0.6):0, pop:0};
  },
  angDiff(x){ let d = x - this.a; while(d>Math.PI) d-=6.283185; while(d<-Math.PI) d+=6.283185; return d; },
  update(dt){
    this.t += dt;
    const rot = (this.rotK||3.1)*dt;
    if(key.left) this.a -= rot;
    if(key.right) this.a += rot;
    if(ptr.down){
      const want = Math.atan2(ptr.y-this.cy, ptr.x-this.cx);
      this.a += clamp(this.angDiff(want), -rot*1.7, rot*1.7);
    }
    this.meter -= dt*((this.decayK||2.0) + this.meter*0.018);
    const sup = 1 + this.meter*0.005;
    for(const it of this.items){
      it.ang += it.sp*sup*dt;
      if(it.pop>0) it.pop -= dt;
      if(it.cool>0){ it.cool -= dt; continue; }
      if(Math.abs(this.angDiff(it.ang)) < 0.22){
        const px = this.cx + Math.cos(it.ang)*this.R, py = this.cy + Math.sin(it.ang)*this.R;
        it.cool = 1.1; it.pop = 0.25;
        if(it.bad){
          this.meter -= 13; this.bad++; Snd.hurt(); shake(4); fx(px,py,10,'#8a6ab0',60,0.5);
        } else {
          this.meter += 12; Snd.coin(); fx(px,py,10,CONFIG.P.pink,70,0.5);
        }
        const side = Math.random()<0.5?-1:1;
        it.ang = this.a + side*rnd(2.1,3.5);
        it.bad = Math.random()<(this.badP||0.34);
        it.sp = rnd(0.30,0.62)*(Math.random()<0.5?1:-1);
      }
    }
    if(this.flash>0) this.flash -= dt;
    if(this.meter>=100){ this.meter = 100; winLevel(LEVELS.indexOf(this)); }
    else if(this.meter<=0) loseLevel('Рука сорвалась... давай ещё раз.');
  },
  tap(){ /* движение — удержание, обрабатывается в update через ptr.down */ },
  draw(){
    skyBg(this.t); clouds(this.t, 12, 3, 0.16);
    const P = CONFIG.P, cx = this.cx, cy = this.cy, R = this.R;
    // орбита пунктиром
    for(let i=0;i<44;i++){
      const a = i/44*6.283185 + this.t*0.15;
      ctx.fillStyle = 'rgba(160,140,192,.35)';
      ctx.fillRect(Math.round(cx+Math.cos(a)*R), Math.round(cy+Math.sin(a)*R), 2, 2);
    }
    // цели
    for(const it of this.items){
      const px = Math.round(cx+Math.cos(it.ang)*R), py = Math.round(cy+Math.sin(it.ang)*R);
      const s = 16 + (it.pop>0?Math.round(it.pop*24):0);
      if(it.bad){
        ctx.fillStyle = '#4a3a6a'; ctx.fillRect(px-s/2, py-s/2, s, s);
        ctx.fillStyle = '#6b4fa0'; ctx.fillRect(px-s/2+1, py-s/2+1, s-2, s-2);
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(px-4, py-3, 2, 2); ctx.fillRect(px+2, py-3, 2, 2);
        ctx.fillRect(px-3, py+3, 6, 1);
      } else {
        if(bothP()) ctx.drawImage(IMG.her, px-s/2, py-s/2, s, s);
        else { ctx.fillStyle = P.pink2; ctx.fillRect(px-s/2, py-s/2, s, s); }
        ctx.fillStyle = '#3a2560'; ctx.fillRect(px-s/2-1, py-s/2-1, s+2, 1); ctx.fillRect(px-s/2-1, py+s/2, s+2, 1);
        heart(px-4, py-s/2-8, 1, P.pink);
      }
    }
    // рука
    const tx = cx + Math.cos(this.a)*R, ty = cy + Math.sin(this.a)*R;
    for(let i=0;i<=14;i++){
      const k = i/14, x = Math.round(cx+(tx-cx)*k), y = Math.round(cy+(ty-cy)*k);
      ctx.fillStyle = (i>11) ? CONFIG.cHim.skin : CONFIG.cHim.cloth;
      ctx.fillRect(x-1, y-1, 3, 3);
    }
    // ладонь
    ctx.fillStyle = CONFIG.cHim.skin;
    ctx.fillRect(Math.round(tx)-4, Math.round(ty)-4, 9, 9);
    ctx.fillStyle = '#c9a184';
    ctx.fillRect(Math.round(tx)-4, Math.round(ty)+5, 9, 2);
    for(let f=0;f<3;f++) ctx.fillRect(Math.round(tx)-3+f*3, Math.round(ty)-7, 2, 4);
    // Танжар в центре
    if(bothP()){
      const s = 26;
      ctx.fillStyle = '#241445'; ctx.fillRect(cx-s/2-2, cy-s/2-2, s+4, s+4);
      ctx.drawImage(IMG.him, cx-s/2, cy-s/2, s, s);
    } else drawGuy(cx, cy+10, CONFIG.cHim, 1, 0);
    // шкала любви
    const bw = Math.min(W-40, 180), bx = Math.round(W/2-bw/2), by = 14;
    text('ЛЮБОВЬ', W/2, 3, {sc:1, align:'center', color:P.dim});
    ctx.fillStyle = '#3a2560'; ctx.fillRect(bx, by, bw, 8);
    const fill = Math.max(0, Math.round((bw-2)*clamp(this.meter/100,0,1)));
    ctx.fillStyle = this.meter>70 ? P.gold : P.pink; ctx.fillRect(bx+1, by+1, fill, 6);
    ctx.fillStyle = '#120a24';
    for(let i=1;i<4;i++) ctx.fillRect(bx+Math.round(bw*i/4), by, 1, 8);
    if(this.bad>0) text('МИМО: '+this.bad, W-6, H-13, {sc:1, align:'right', color:P.red});
  }
};

/* --------------------------------------------- УРОВЕНЬ 7 (из PILU): РИТМ СЕРДЦА */
const L7 = {
  name:'РИТМ СЕРДЦА',
  hint:'ЖМИ ПРОБЕЛ В ТАКТ СЕРДЦУ',
  intro:[D('him','Моё сердце бьётся неровно, когда ты рядом.'),D('him','Попробуй попасть в его ритм. Держишь дольше — бьётся быстрее.')],
  outro:[D('her','Оно бьётся в такт с моим.'),D('him','Я это знал.')],
  enter(){
    this.t = 0; this.meter = 50; this.bpm = 92; this.next = 1.4; this.sent = 0; this.total = 30;
    this.tx = Math.round(W*0.30); this.ty = Math.round(H*0.56); this.speed = 105;
    this.beats = []; this.pulse = 0; this.msg = ''; this.msgT = 0; this.hits = 0; this.miss = 0;
    this.travel = (W + 20 - this.tx) / this.speed;
  },
  update(dt){
    this.t += dt;
    // планируем приходы сердец
    while(this.sent < this.total && this.t > this.next - this.travel - 0.2){
      this.beats.push({tb:this.next, x:W+20, hit:false, dead:false, sounded:false});
      this.next += 60/this.bpm;
      this.bpm = Math.min(182, this.bpm + 2.8);
      this.sent++;
    }
    for(const b of this.beats){
      b.x = this.tx + (b.tb - this.t)*this.speed;
      if(!b.sounded && this.t >= b.tb){ b.sounded = true; this.pulse = 1; Snd.note(150, 0.09, 'triangle', 0.16); }
      if(!b.hit && this.t > b.tb + 0.17){
        b.dead = true; this.miss++; this.meter -= 7; Snd.bad();
        this.say('МИМО', CONFIG.P.red);
      }
    }
    this.beats = this.beats.filter(b => !b.dead && b.x > -30);
    if(this.pulse>0) this.pulse -= dt*3;
    if(this.msgT>0) this.msgT -= dt;
    if(this.sent>=this.total && !this.beats.length && this.t > this.next + 0.5){
      if(this.meter>=100) winLevel(LEVELS.indexOf(this)); else loseLevel('Сбились с ритма. Ещё раз!');
    }
    if(this.meter>=100){ this.meter = 100; winLevel(LEVELS.indexOf(this)); }
    if(this.meter<=0) loseLevel('Сердце сбилось. Ещё разок!');
  },
  say(t, col){ this.msg = t; this.msgCol = col||CONFIG.P.ink; this.msgT = 0.55; },
  hit(){
    let best = null, bd = 1e9;
    for(const b of this.beats){ const d = Math.abs(b.x - this.tx); if(!b.hit && d < bd){ bd = d; best = b; } }
    if(best && bd < (this.winMax||20)){
      best.hit = true; best.dead = true; this.hits++;
      if(bd < (this.winGood||7)){ this.meter += 5; this.say('ОТЛИЧНО!', CONFIG.P.gold); }
      else { this.meter += 3; this.say('ХОРОШО', CONFIG.P.pink2); }
      Snd.coin(); fx(this.tx, this.ty, 8, CONFIG.P.pink, 70, 0.4);
    } else {
      this.meter -= 3; this.say('НЕ В ТАКТ', CONFIG.P.red); Snd.bad();
    }
  },
  key(k){ if(k===' '||k==='Enter') this.hit(); },
  tap(){ this.hit(); },
  draw(){
    skyBg(this.t);
    // «электрокардиограмма» на фоне
    ctx.fillStyle = 'rgba(255,93,143,.16)';
    const ekg = [0,0,0,4,-6,10,-4,0,0,0];
    for(let x=0;x<W;x++){
      const i = Math.floor(((x + this.t*40) % (W)) / (W/ekg.length));
      ctx.fillRect(x, Math.round(H*0.30) - ekg[Math.min(ekg.length-1,i)], 1, 1);
    }
    const P = CONFIG.P;
    // дорожка
    ctx.fillStyle = '#2d1a54'; ctx.fillRect(0, this.ty-8, W, 16);
    ctx.fillStyle = 'rgba(160,140,192,.5)';
    for(let x=(this.t*40)%12; x<W; x+=12) ctx.fillRect(Math.round(x), this.ty-9, 6, 1);
    // цель
    const pr = this.pulse>0 ? Math.round(this.pulse*3) : 0;
    ctx.fillStyle = 'rgba(255,209,102,.25)';
    ctx.fillRect(this.tx-13-pr, this.ty-13-pr, 26+pr*2, 26+pr*2);
    ctx.fillStyle = '#3a2560'; ctx.fillRect(this.tx-12, this.ty-12, 24, 24);
    heart(this.tx-8, this.ty-8, 2, P.pink);
    // сердца
    for(const b of this.beats){
      if(b.x > W+6) continue;                       // ещё не прилетели — не рисуем
      heart(Math.round(b.x)-4, this.ty-3, 1, b.hit ? P.gold : P.pink);
      ctx.globalAlpha = 0.4; heart(Math.round(b.x)-4, this.ty-3, 1, '#ffd6e4'); ctx.globalAlpha = 1;
    }
    // шкала
    const bw = Math.min(W-40, 180), bx = Math.round(W/2-bw/2), by = 14;
    text('РИТМ', W/2, 3, {sc:1, align:'center', color:P.dim});
    ctx.fillStyle = '#3a2560'; ctx.fillRect(bx, by, bw, 8);
    ctx.fillStyle = this.meter>70 ? P.gold : P.pink;
    ctx.fillRect(bx+1, by+1, Math.max(0,Math.round((bw-2)*clamp(this.meter/100,0,1))), 6);
    // сообщение
    if(this.msgT>0){
      ctx.globalAlpha = clamp(this.msgT*3,0,1);
      text(this.msg, this.tx, this.ty-30, {sc:1, align:'center', color:this.msgCol, shadow:'#1b1035'});
      ctx.globalAlpha = 1;
    }
    text('ПОПАЛО: '+this.hits+' / '+this.total, 6, H-13, {sc:1, color:P.dim});
    if(this.miss>0) text('МИМО: '+this.miss, W-6, H-13, {sc:1, align:'right', color:P.red});
  }
};

const LEVELS = [L6, L7, L1, L2, L3, L4, L5];

G.screens.letter = {
  enter(){
    this.t = 0; this.printed = 0; this.lineT = 0; this.scroll = 0;
    const maxW = Math.min(W-30, 216);
    this.lines = [];
    for(const l of CONFIG.letter){
      if(!l){ this.lines.push(''); continue; }
      for(const w of wrap(l, maxW-22, 1)) this.lines.push(w);
    }
    this.maxW = maxW;
    this.lh = 12;
    this.maxLines = Math.max(3, Math.floor((H-100)/this.lh));
    Snd.unlock();
  },
  paper(){
    const shown = Math.min(this.maxLines, Math.max(1, Math.min(this.lines.length, this.printed||1)));
    const ph = 26 + shown*this.lh + 10;
    const py0 = Math.max(30, Math.round((H - ph)/2));
    return {ph:ph, py0:py0};
  },
  startLine(){
    const total = Math.min(this.lines.length, this.printed);
    const auto = Math.max(0, total - this.maxLines);
    return clamp(this.printed < this.lines.length ? auto : this.scroll, 0, Math.max(0, this.lines.length - this.maxLines));
  },
  update(dt){
    this.t += dt;
    if(this.printed < this.lines.length){
      this.lineT += dt;
      if(this.lineT > 0.34){ this.lineT = 0; this.printed++; this.scroll = Math.max(0, this.printed - this.maxLines); if(this.printed%2===0) Snd.clack(); }
    }
  },
  key(k){
    if(k==='ArrowUp'){ this.scroll = Math.max(0, this.scroll-1); Snd.blip(); }
    if(k==='ArrowDown'){ this.scroll = Math.min(Math.max(0,this.lines.length-this.maxLines), this.scroll+1); Snd.blip(); }
    if(k===' '||k==='Enter'){ if(this.printed<this.lines.length) this.printed = this.lines.length; else { go('desktop'); G.openMap = true; } }
    if(k==='Escape'){ go('desktop'); G.openMap = true; }
  },
  tap(){ if(this.printed<this.lines.length) this.printed = this.lines.length; else { go('desktop'); G.openMap = true; } },
  draw(){
    skyBg(this.t); clouds(this.t, 16, 4, 0.18);
    const P = CONFIG.P, cx = W/2;
    // сердечки на фоне
    for(let i=0;i<14;i++){
      const a = this.t*0.5+i*0.9;
      heart((Math.sin(a)*0.4+0.5)*(W-10), H - ((this.t*14+i*29)%(H+30)) + 6, 1, 'rgba(255,93,143,.45)');
    }
    const pp = this.paper();
    const pw = this.maxW, px0 = Math.round(cx-pw/2), py0 = pp.py0, ph = pp.ph;
    const start = this.startLine();
    const vis = this.lines.slice(start, Math.min(this.lines.length, start + this.maxLines));
    const printing = this.printed < this.lines.length;
    // принтер над бумагой
    ctx.fillStyle='#3a2560'; ctx.fillRect(cx-32, py0-26, 64, 26);
    ctx.fillStyle='#5d3f96'; ctx.fillRect(cx-30, py0-24, 60, 22);
    ctx.fillStyle='#241445'; ctx.fillRect(cx-24, py0-20, 48, 8);
    ctx.fillStyle= printing ? (Math.floor(this.t*8)%2?P.gold:'#8ce99a') : P.pink;
    ctx.fillRect(cx-28, py0-5, 4, 3);
    // бумага
    ctx.fillStyle='#241445'; ctx.fillRect(px0-3,py0-3,pw+6,ph+6);
    ctx.fillStyle=P.paper; ctx.fillRect(px0,py0,pw,ph);
    // текст
    let yy = py0+14;
    for(let i=0;i<vis.length;i++){
      if(start+i < this.printed) text(vis[i], px0+11, yy, {sc:1, color:'#2b2140'});
      yy += this.lh;
    }
    // полоса прокрутки
    if(this.lines.length > this.maxLines){
      const h = Math.max(6, Math.round(ph * this.maxLines / this.lines.length));
      const top = py0 + Math.round((ph-h) * (start / Math.max(1,(this.lines.length - this.maxLines))));
      ctx.fillStyle='#e0d3bb'; ctx.fillRect(px0+pw-6, py0+2, 3, ph-4);
      ctx.fillStyle='#8a7a5e'; ctx.fillRect(px0+pw-6, top, 3, h);
    }
    // печать-сердечко
    if(!printing) heart(px0+pw-24, py0+ph-20, 2, P.pink);
    // подсказка
    if(printing){
      text('ПЕЧАТАЕТСЯ...', cx, Math.min(H-14, py0+ph+10), {sc:1, align:'center', color:P.dim});
    } else {
      const a = 0.5+0.5*Math.sin(this.t*3);
      ctx.globalAlpha=a;
      text(this.lines.length>this.maxLines ? 'СТРЕЛКИ — ПРОКРУТКА, ПРОБЕЛ — ДАЛЬШЕ' : 'НАЖМИ ПРОБЕЛ',
           cx, Math.min(H-14, py0+ph+10), {sc:1, align:'center', color:P.gold});
      ctx.globalAlpha=1;
    }
    // портреты по бокам
    if(bothP()){
      const s2 = 34;
      if(py0+ph+28 < H-s2){ ctx.drawImage(IMG.him, 4, H-s2-4, s2, s2); ctx.drawImage(IMG.her, W-s2-4, H-s2-4, s2, s2); }
    }
  }
};

/* ==========================================================================
   ГЛАВНЫЙ ЦИКЛ
   ========================================================================== */
let last = performance.now();
function frame(now){
  let dt = (now-last)/1000; last = now;
  if(dt>0.05) dt = 0.05;
  // короткая «заморозка» после сильного удара
  if(G.stop>0){ G.stop -= dt; dt *= 0.18; }
  // замедление времени (комбо, «лихорадка»)
  if(G.slowT>0){ G.slowT -= dt; dt *= G.slow; }
  // переход между экранами
  if(G.tr){
    G.tr.t += dt;
    if(G.tr.t >= G.tr.d){ const ts = G.tr.to; G.tr = null; goNow(ts[0], ts[1]); }
  }
  if(G.fade>0){
    G.fade -= dt*4;
    if(G.fade<=0 && G.fadeTo){ const [s,a] = G.fadeTo; G.fadeTo=null; goNow(s,a); }
  }
  const scr = G.screens[G.state];
  if(scr && scr.update) scr.update(dt);
  ctx.save();
  if(G.shake>0){
    G.shake -= dt*24; if(G.shake<0) G.shake=0;
    ctx.translate(Math.round(rnd(-G.shake,G.shake)), Math.round(rnd(-G.shake,G.shake)));
    G.tilt = lerp(G.tilt, rnd(-0.012,0.012)*clamp(G.shake/6,0,1), 0.3);
  } else G.tilt = lerp(G.tilt, 0, 0.2);
  if(G.tilt){ ctx.translate(W/2, H/2); ctx.rotate(G.tilt); ctx.translate(-W/2, -H/2); }
  if(scr && scr.draw) scr.draw();
  ctx.restore();
  if(G.toastT>0){
    G.toastT -= dt;
    const tw = textW(G.toast,1)+10;
    ctx.globalAlpha = clamp(G.toastT*2,0,1);
    panel(Math.round(W/2-tw/2), 4, tw, 18, 'rgba(20,10,36,.9)', '#6b4fa0');
    text(G.toast, W/2, 9, {sc:1, align:'center', color:CONFIG.P.gold});
    ctx.globalAlpha = 1;
  }
  // переход-растворение поверх кадра
  drawTransOverlay();
  // вспышка экрана
  if(G.flashA>0){
    G.flashA -= dt*3.2;
    ctx.globalAlpha = clamp(G.flashA,0,1);
    ctx.fillStyle = G.flashCol; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  ptr.tap = 0; ptr.dx = 0;
  requestAnimationFrame(frame);
}
G.needRelayout = function(){
  // при смене ориентации перезапускаем текущий экран
  if(G.state==='level' && LEVELS[G.level] && LEVELS[G.level].enter) LEVELS[G.level].enter();
  if(G.state==='map' && G.screens.map.enter) G.screens.map.enter();
};

/* --- рябь от клика (анимация) --- */
const RIPPLES = [];
function ripple(x,y,col){ RIPPLES.push({x:x, y:y, t:0, col:col||'rgba(255,209,102,.9)'}); }
function drawRipples(dt){
  for(let i=RIPPLES.length-1;i>=0;i--){
    const r = RIPPLES[i]; r.t += dt;
    if(r.t>0.45){ RIPPLES.splice(i,1); continue; }
    const k = r.t/0.45;
    ctx.strokeStyle = r.col; ctx.globalAlpha = 1-k;
    ctx.beginPath(); ctx.arc(r.x, r.y, 2+k*12, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* --- курсор: стрелка и «песочные часы» --- */
const CUR_ARROW = [
  "X.......",
  "XX......",
  "XoX.....",
  "XooX....",
  "XoooX...",
  "XooooX..",
  "XoooooX.",
  "XooooooX",
  "Xooooooo",
  "XoooXXX.",
  "XXoXX...",
  "Xo.X....",
  "..XX....",
  "..X....."
];
const CUR_BUSY = [
  "oooooooo",
  "oXXXXXXo",
  ".oXXXXo.",
  "..oXXo..",
  "...oo...",
  "...ss...",
  "..osso..",
  ".osssso.",
  "osssssso",
  "oooooooo"
];
function drawCursor(x, y, busy, t){
  x = Math.round(x); y = Math.round(y);
  if(busy){
    px(CUR_BUSY, x, y, 1, {o:'#120a24', X:'#c9bde8', s:'#ffd166'});
    // песок «сыплется»
    const k = Math.floor((t*3)%4);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(x+3, y+5+k, 2, 1);
    ctx.fillStyle = '#6b4fa0';
    ctx.fillRect(x+3, y+1, 2, Math.min(3, k));
  } else {
    px(CUR_ARROW, x, y, 1, {o:'#120a24', X:'#fff6e8'});
  }
}

/* --- CRT: развёртка, блик, лёгкое мерцание --- */
function crtOverlay(t){
  ctx.globalAlpha = 0.055; ctx.fillStyle = '#000000';
  for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  ctx.globalAlpha = 1;
  // блик в левом верхнем углу
  const g = ctx.createLinearGradient(0,0,W*0.6,H*0.6);
  g.addColorStop(0,'rgba(255,255,255,.045)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // редкая «вспышка» развёртки
  const fl = Math.sin(t*0.7);
  if(fl > 0.985){
    ctx.globalAlpha = 0.06; ctx.fillStyle='#fff6e8'; ctx.fillRect(0, Math.floor((t*260)%H), W, 2); ctx.globalAlpha = 1;
  }
}

/* --- рамка ноутбука вокруг всего экрана (тонкая, сверху) --- */
function bezel(){
  ctx.fillStyle = '#0d0818'; ctx.fillRect(0,0,W,3); ctx.fillRect(0,H-3,W,3);
  ctx.fillStyle = '#1a1030'; ctx.fillRect(0,3,W,1); ctx.fillRect(0,H-4,W,1);
}

/* ==========================================================================
   ОКНА
   ========================================================================== */
const Win = {
  open(kind, title, o){
    o = o || {};
    const w = Math.min(W-12, o.w || 216);
    const h = Math.min(H-30, o.h || 170);
    const win = {
      kind:kind, title:title, w:w, h:h,
      x: Math.round((W-w)/2), y: Math.round(Math.max(14,(H-16-h)/2) + (o.dy||0)),
      anim:0, closing:false, from:o.from||null, t:0, data:o.data||{}
    };
    G.win = win; Snd.blip();
    return win;
  },
  close(){ if(G.win && !G.win.closing){ G.win.closing = true; Snd.clack(); } },
  update(dt){
    const w = G.win; if(!w) return;
    w.t += dt;
    if(w.closing){ w.anim -= dt*5.5; if(w.anim<=0){ G.win = null; return; } }
    else if(w.anim < 1){ w.anim = Math.min(1, w.anim + dt*5); }
  },
  rect(w){
    const k = clamp(w.anim,0,1);
    const e = k<1 ? (1-Math.pow(1-k,3)) : 1;      // плавный «выезд»
    if(!w.from) return {x:w.x, y:w.y, w:w.w, h:w.h, a:e};
    return {
      x: Math.round(lerp(w.from.x, w.x, e)),
      y: Math.round(lerp(w.from.y, w.y, e)),
      w: Math.max(8, Math.round(lerp(w.from.w, w.w, e))),
      h: Math.max(8, Math.round(lerp(w.from.h, w.h, e))),
      a: e
    };
  },
  hit(w,x,y){ const r = this.rect(w); return x>=r.x-2 && x<=r.x+r.w+2 && y>=r.y-2 && y<=r.y+r.h+2; },
  titleHit(w,x,y){ const r = this.rect(w); return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+13; },
  closeHit(w,x,y){ const r = this.rect(w); return x>=r.x+r.w-12 && x<=r.x+r.w-2 && y>=r.y+2 && y<=r.y+11; },
  inner(w){ const r = this.rect(w); return {x:r.x+1, y:r.y+14, w:r.w-2, h:r.h-15, a:r.a}; }
};

function drawWinFrame(win, active){
  const r = Win.rect(win);
  ctx.globalAlpha = clamp(r.a,0,1);
  // тень
  ctx.fillStyle = 'rgba(8,4,18,.5)'; ctx.fillRect(r.x+3, r.y+3, r.w, r.h);
  // внешняя рамка
  ctx.fillStyle = UI.dark; ctx.fillRect(r.x-2, r.y-2, r.w+4, r.h+4);
  ctx.fillStyle = UI.line; ctx.fillRect(r.x-1, r.y-1, r.w+2, r.h+2);
  // тело
  ctx.fillStyle = UI.face; ctx.fillRect(r.x, r.y, r.w, r.h);
  // шапка
  ctx.fillStyle = active ? UI.face2 : '#2a1a45';
  ctx.fillRect(r.x, r.y, r.w, 13);
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(r.x, r.y, r.w, 1);
  ctx.fillStyle = UI.dark; ctx.fillRect(r.x, r.y+13, r.w, 1);
  // «полосочки» на шапке — как у старых окон
  ctx.fillStyle = 'rgba(255,246,232,.18)';
  for(let i=0;i<3;i++) ctx.fillRect(r.x+2, r.y+3+i*3, r.w-20, 1);
  // заголовок
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w-15, 13); ctx.clip();
  text(win.title, r.x+3, r.y+1, {sc:1, color: active?UI.text:UI.dim});
  ctx.restore();
  // кнопка закрыть
  const bx = r.x+r.w-12, by = r.y+2;
  ctx.fillStyle = UI.face; ctx.fillRect(bx,by,10,9);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(bx,by,10,1); ctx.fillRect(bx,by,1,9);
  ctx.fillStyle = UI.dark; ctx.fillRect(bx+9,by,1,9); ctx.fillRect(bx,by+8,10,1);
  ctx.fillStyle = '#c94f6d';
  for(let i=0;i<5;i++){ ctx.fillRect(bx+3+i, by+3+i, 1,1); ctx.fillRect(bx+7-i, by+3+i, 1,1); }
  ctx.globalAlpha = 1;
  return r;
}

/* --- кнопка в стиле «старых окон» --- */
function drawBtn(x,y,w,h,label,o){
  o = o||{};
  ctx.fillStyle = UI.dark; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle = o.press ? '#1d1136' : UI.face2; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = o.press ? UI.dark : 'rgba(255,255,255,.22)';
  ctx.fillRect(x,y,w,1); ctx.fillRect(x,y,1,h);
  ctx.fillStyle = o.press ? 'rgba(255,255,255,.18)' : UI.dark;
  ctx.fillRect(x,y+h-1,w,1); ctx.fillRect(x+w-1,y,1,h);
  const col = o.dis ? '#5a4680' : (o.color || UI.text);
  text(label, Math.round(x+w/2), Math.round(y+(h-8)/2), {sc:1, align:'center', color:col});
}

/* --- полоса загрузки --- */
function drawBar(x,y,w,h,val,col,seg){
  ctx.fillStyle = UI.dark; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle = '#1d1136'; ctx.fillRect(x,y,w,h);
  const fw = Math.max(0, Math.round((w-2)*clamp(val,0,1)));
  ctx.fillStyle = col || CONFIG.P.gold;
  if(seg){ // «виндовые» сегменты
    for(let i=0;i<fw;i+=seg+2) ctx.fillRect(x+1+i, y+1, Math.min(seg,fw-i), h-2);
  } else ctx.fillRect(x+1, y+1, fw, h-2);
}

/* --- иконка файла: страница + символ --- */
function drawFileIcon(node, cx, cy, o){
  o = o||{};
  const w = 16, h = 18, x = Math.round(cx - w/2), y = Math.round(cy - h/2);
  // бумага
  ctx.fillStyle = UI.dark; ctx.fillRect(x-1, y-1, w+2, h+2);
  ctx.fillStyle = o.sel ? '#fff6e8' : UI.paper; ctx.fillRect(x, y, w, h);
  // уголок
  ctx.fillStyle = '#b3a8cc'; ctx.fillRect(x+w-5, y, 5, 5);
  ctx.fillStyle = o.sel ? '#c9bde8' : '#8f83ad'; ctx.fillRect(x+w-5, y, 1, 5); ctx.fillRect(x+w-5, y+4, 5, 1);
  ctx.fillStyle = UI.dark;
  if(node === 'txt'){
    for(let i=0;i<5;i++) ctx.fillRect(x+3, y+4+i*2, i===2?6:10, 1);
    ctx.fillStyle = CONFIG.P.sky; ctx.fillRect(x+3, y+15, 10, 1);
  } else if(node === 'bin'){
    ctx.fillStyle = '#6b4fa0';
    ctx.fillRect(x+4,y+4,8,3); ctx.fillRect(x+3,y+7,10,8); ctx.fillRect(x+2,y+15,12,2);
    ctx.fillStyle = '#3a2560';
    for(let i=0;i<3;i++) ctx.fillRect(x+5+i*3, y+8, 1, 7);
  } else {
    drawNodeIcon(node, Math.round(cx), Math.round(cy-1), o.sel ? '#3a2560' : '#4a3670');
    if(o.sel){ ctx.fillStyle='rgba(107,79,160,.35)'; ctx.fillRect(x,y,w,h); }
  }
  return {x:x, y:y, w:w, h:h};
}

/* --- маленький принтер (для анимаций) --- */
function drawPrinter(x, y, s, t, on){
  const P = CONFIG.P;
  ctx.fillStyle = '#2a2050'; ctx.fillRect(x, y+6*s, 22*s, 8*s);          // корпус
  ctx.fillStyle = '#3f3470'; ctx.fillRect(x+2*s, y+2*s, 18*s, 5*s);      // верх
  ctx.fillStyle = on ? P.green : '#6b4fa0'; ctx.fillRect(x+16*s, y+9*s, 2*s, 2*s); // лампочка
  ctx.fillStyle = '#1d1136'; ctx.fillRect(x+3*s, y+12*s, 16*s, 1*s);     // щель
}

/* --- «песочные часы» загрузки уровня (окно) --- */
function drawLoader(x, y, w, h, title, val, t){
  ctx.fillStyle = UI.face; ctx.fillRect(x,y,w,h);
  text(title, x+6, y+6, {sc:1, color:UI.text});
  drawBar(x+6, y+22, w-12, 8, val, CONFIG.P.pink);
  text('⋯ ЗАГРУЗКА ⋯'.slice(0, 6 + Math.floor((t*6)%4)), x+6, y+36, {sc:1, color:UI.dim});
}

/* ==========================================================================
   ЧАСТЬ 2 · РАБОЧИЙ СТОЛ
   Экран-ноутбук: обои, разбросанные .exe, окна, «пуск», часы, курсор.

G.win = null;

/* --- обои --- */
function drawWallpaper(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b1550'); g.addColorStop(0.55,'#1b1035'); g.addColorStop(1,'#150a2a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  nebulaBg(t, {c1:'#3a1f66', c2:'#1b3a6b', c3:'#5a1f4a', seed: 3});
  // северное сияние
  if(FXQ > .5){
    ctx.globalAlpha = .07;
    for(let b=0;b<3;b++){
      ctx.fillStyle = ['#6bc7ff','#8ce99a','#c9a0ff'][b];
      for(let x=0;x<W;x+=2){
        const y = H*(0.18 + b*0.06) + Math.sin(x*0.03 + t*.5 + b)*7;
        ctx.fillRect(x, Math.round(y), 2, Math.round(2 + 3*Math.sin(x*0.017 + t)));
      }
    }
    ctx.globalAlpha = 1;
  }
  // дальний город (силуэт)
  ctx.fillStyle = 'rgba(23,12,46,.7)';
  const R2 = mulberry32(51);
  for(let x=-4;x<W;x+=11){
    const bh = 8 + Math.round(R2()*20);
    ctx.fillRect(x, H-30-bh, 10, bh+2);
  }
  stars(t);
  motes(t, 20, '#c9bde8', .3);
  // падающая звезда
  const ph = (t*0.10)%1;
  if(ph < 0.10){
    const k = ph/0.10;
    const sx = W*0.15 + k*W*0.7, sy = H*0.10 + k*H*0.22;
    ctx.fillStyle = 'rgba(255,246,232,'+(1-k).toFixed(2)+')';
    ctx.fillRect(Math.round(sx), Math.round(sy), 2, 1);
    ctx.fillRect(Math.round(sx)-2, Math.round(sy)-1, 2, 1);
  }
  // сердце-водяной знак
  ctx.globalAlpha = 0.10; heart(Math.round(W/2)-20, Math.round(H*0.30)-15, 5, '#ff5d8f'); ctx.globalAlpha = 1;
  // город внизу
  const baseY = H - 30;
  const R = mulberry32(99);
  let x = -6;
  while(x < W){
    const bw = 14 + Math.floor(R()*20), bh = 18 + Math.floor(R()*46);
    ctx.fillStyle = '#170c2e'; ctx.fillRect(x, baseY-bh, bw, bh+34);
    ctx.fillStyle = '#221541'; ctx.fillRect(x, baseY-bh, bw, 1);
    for(let wy = baseY-bh+4; wy < baseY-5; wy += 6){
      for(let wx = x+3; wx < x+bw-3; wx += 5){
        if(R() > 0.45) continue;
        const flick = R() < 0.10 ? (Math.sin(t*3+wx*0.7) > 0.6 ? 1 : 0.2) : 1;
        ctx.globalAlpha = flick;
        ctx.fillStyle = R() < 0.28 ? '#ffd166' : '#7ee0a8';
        ctx.fillRect(wx, wy, 2, 3);
        ctx.globalAlpha = 1;
      }
    }
    x += bw + 3;
  }
  ctx.fillStyle = '#100820'; ctx.fillRect(0, baseY+2, W, H-baseY);
}

/* --- содержимое окна «карта прогресса» --- */
function mapWindowContent(win){
  const r = Win.inner(win);
  const P = CONFIG.P;
  const n = NODE_META.length;
  const cols = clamp(Math.floor(r.w/74), 2, 5);
  const rows = Math.ceil(n/cols);
  const headH = 15, footH = 15;
  const gw = r.w, gh = r.h - headH - footH;
  const cw = gw/cols, ch = gh/rows;
  const showLabels = ch >= 44;                    // иначе подписи не влезают — показываем только выбранную
  // шапка: сердечки прогресса
  const done = heartsDone();
  text('ЛЮБОВЬ УСТАНОВЛЕНА: '+done+'/'+NH, r.x+4, r.y+1, {sc:1, color:P.dim});
  drawBar(r.x+4, r.y+11, r.w-8, 5, done/NH, P.pink);
  // сетка узлов
  win.nodesXY = [];
  for(let i=0;i<n;i++){
    const c = i%cols, rr = Math.floor(i/cols);
    const nx = Math.round(r.x + cw*(c+0.5)), ny = Math.round(r.y + headH + ch*(rr+0.5));
    win.nodesXY.push({x:nx, y:ny, i:i});
    const locked = i<NH ? false : done<NH;
    const got = i<NH ? G.hearts[i] : false;
    const sel = (i===G.sel);
    const R2 = Math.min(15, Math.floor(Math.min(cw, ch)/2) - 3);
    const bob = sel ? Math.sin(win.t*5)*2 : 0;
    const x = nx, y = Math.round(ny+bob);
    if(i===NH && done===NH){           // письмо пульсирует
      const a = 0.25+0.35*Math.abs(Math.sin(win.t*2.5));
      ctx.fillStyle = 'rgba(255,209,102,'+a.toFixed(2)+')'; ctx.fillRect(x-R2-4, y-R2-4, (R2+4)*2, (R2+4)*2);
    }
    if(sel){ ctx.fillStyle='rgba(255,209,102,.16)'; ctx.fillRect(x-R2-3,y-R2-3,(R2+3)*2,(R2+3)*2); }
    ctx.fillStyle = locked ? '#1d1136' : (got ? '#4a1f3d' : '#2d1a54');
    ctx.fillRect(x-R2, y-R2, R2*2, R2*2);
    ctx.fillStyle = locked ? '#3a2560' : (sel?P.gold:(got?P.pink:'#6b4fa0'));
    ctx.fillRect(x-R2,y-R2,R2*2,2); ctx.fillRect(x-R2,y+R2-2,R2*2,2);
    ctx.fillRect(x-R2,y-R2,2,R2*2); ctx.fillRect(x+R2-2,y-R2,2,R2*2);
    drawNodeIcon(i, x, y, locked ? '#4a3670' : (got?P.pink2:P.gold));
    if(showLabels){
      const nm = NODE_META[i].name;
      text(nm, x, y+R2+2, {sc:1, align:'center', color: locked ? '#5a4680' : (sel?P.ink:P.dim)});
    }
    if(got) heart(x+R2-3, y-R2-3, 1, P.pink);
  }
  // подвал
  const sub = G.sel===NH ? 'ОТКРЫТЬ ПИСЬМО ♥' : (G.sel<NH?NODE_META[G.sel].sub:'');
  const foot = showLabels ? sub : (G.sel<NODE_META.length ? NODE_META[G.sel].name + ' — ' + sub : sub);
  text(foot, Math.round(r.x+r.w/2), r.y+r.h-13, {sc:1, align:'center', color: showLabels?P.dim:P.ink});
}

/* --- системное окошко с кнопкой ОК --- */
function openSys(title, lines, kind){
  const w = Win.open('sys', title, {w: Math.min(W-30, 190), h: 74 + lines.length*11});
  w.data.lines = lines;
  w.data.kind = kind || 'info';
  return w;
}

/* ==========================================================================
   ЭКРАН: РАБОЧИЙ СТОЛ
   ========================================================================== */
G.screens.desktop = {
  enter(){
    this.t = 0;
    if(!this.icons) this.buildIcons();
    this.layout();
    for(const it of this.icons) it.anim = 0;
    this.sel = -1; this.lastSel = -1; this.lastT = -9;
    this.startOpen = false; this.startSel = 0;
    this.curSeen = false; this.hover = -1; this.pressBtn = null;
    this.lastPY = ptr.y;
    if(G.openMap){ G.openMap = false; if(!G.win) Win.open('map', 'ПРОГРЕСС.exe', {w:Math.min(W-8,224), h:Math.min(H-30,320)}); }
  },
  buildIcons(){
    const list = [];
    const files = ['RUKA.exe','RITM.exe','SERDCA.exe','MAZE.exe','ZONT.exe','MEMORY.exe','CODE.exe','PRINT.exe'];
    for(let i=0;i<NH;i++){
      list.push({kind:'level', idx:i, icon:i, name: files[i] || ('LEVEL'+i+'.exe'), node:i});
    }
    list.push({kind:'letter', icon:7, name:'LOVE.exe', node:7});
    list.push({kind:'readme', icon:'txt', name:'README.txt'});
    list.push({kind:'bin', icon:'bin', name:'КОРЗИНА'});
    this.icons = list;
    this.jit = []; const R = mulberry32(5);
    for(let i=0;i<24;i++) this.jit.push(R());
  },
  layout(){
    const items = this.icons;
    const cols = W>=H ? 3 : 2;
    const rows = Math.ceil(items.length/cols);
    const padX = 6, top = 8, bottom = H-32;
    const cw = (W-padX*2)/cols, chh = (bottom-top)/rows;
    for(let i=0;i<items.length;i++){
      const c = i%cols, r = Math.floor(i/cols);
      const jx = (this.jit[i%this.jit.length]-0.5)*Math.min(12, cw*0.30);
      const jy = (this.jit[(i+5)%this.jit.length]-0.5)*Math.min(9, chh*0.20);
      const it = items[i];
      it.tx = Math.round(padX + cw*(c+0.5) + jx);
      it.ty = Math.round(top + chh*r + 15 + jy);
      it.delay = 0.05*i;
      if(it.anim===undefined) it.anim = 0;
    }
  },
  iconAt(x,y){
    for(let i=this.icons.length-1;i>=0;i--){
      const it = this.icons[i];
      if(Math.abs(x-it.tx) < 15 && y > it.ty-13 && y < it.ty+22) return i;
    }
    return -1;
  },
  update(dt){
    this.t += dt;
    // иконки «падают» на место
    for(const it of this.icons){ if(it.anim < 1) it.anim = Math.min(1, it.anim + dt*2.6); }
    Win.update(dt);
    drawRipples(dt);
    // перетаскивание окна за шапку
    const dy = ptr.y - this.lastPY; this.lastPY = ptr.y;
    if(ptr.dx || dy) this.curSeen = true;
    if(this.drag && G.win && ptr.down){
      G.win.x = clamp(G.win.x + ptr.dx, -G.win.w+30, W-30);
      G.win.y = clamp(G.win.y + dy, 8, H-26);
      G.win.from = null;
    }
    // отложенный запуск уровня (окно загрузки)
    if(G.pending){
      G.pending.t += dt;
      if(G.pending.t > 1.05){
        const p = G.pending; G.pending = null;
        if(G.win && G.win.kind==='load') G.win = null;
        if(p.type==='level') startLevel(p.idx);
        else if(p.type==='letter') go('letter');
      }
    }
    // курсор поверх
    this.hover = this.iconAt(ptr.x, ptr.y);
  },
  draw(){
    drawWallpaper(this.t);
    // иконки
    for(let i=0;i<this.icons.length;i++){
      const it = this.icons[i];
      const k = clamp((it.anim*1.6 - it.delay), 0, 1);
      const e = k<1 ? 1-Math.pow(1-k,3) : 1;
      const yy = Math.round(it.ty - (1-e)*70);
      const sel = (this.sel===i);
      const hov = (this.hover===i);
      ctx.globalAlpha = clamp(e*1.4,0,1);
      if(sel || hov){
        ctx.fillStyle = sel ? 'rgba(255,209,102,.22)' : 'rgba(107,79,160,.16)';
        ctx.fillRect(it.tx-15, yy-13, 30, 34);
      }
      drawFileIcon(it.icon, it.tx, yy, {sel:sel});
      if(sel){
        ctx.fillStyle = 'rgba(255,209,102,.75)';
        ctx.fillRect(it.tx-15, yy-13, 30, 1); ctx.fillRect(it.tx-15, yy+21, 30, 1);
      }
      // подпись (по ширине колонки, чтобы не наезжать на соседей)
      const icols = W>=H ? 3 : 2, icw = (W - 12)/icols;
      const lsc = fitSc(it.name, icw-2, 1);
      const tw = textW(it.name, lsc);
      if(sel){ ctx.fillStyle = '#3a2560'; ctx.fillRect(Math.round(it.tx-tw/2)-1, yy+22, tw+2, 11); }
      text(it.name, it.tx, yy+23, {sc:lsc, align:'center', color: sel?'#fff6e8':'#e6dcf7', shadow:'rgba(10,6,22,.9)'});
      // замок на закрытом письме
      if(it.kind==='letter' && heartsDone()<NH){
        ctx.fillStyle = '#5a4680';
        ctx.fillRect(it.tx+6, yy-2, 6, 5); ctx.fillRect(it.tx+7, yy-4, 4, 2);
      }
      if(it.kind==='level' && G.hearts[it.idx]) heart(it.tx+8, yy-6, 1, CONFIG.P.pink);
      ctx.globalAlpha = 1;
    }
    // окно
    if(G.win) this.drawWindow(G.win);
    // статус-строка и таскбар
    this.drawStatus();
    this.drawTaskbar();
    // меню «Пуск»
    if(this.startOpen) this.drawStart();
    // курсор
    if(this.curSeen || IS_TOUCH) drawCursor(ptr.x, ptr.y, !!G.pending, this.t);
    crtOverlay(this.t);
    bezel();
    if(G.toastT>0){ /* тосты рисует главный цикл */ }
  },
  drawWindow(win){
    if(win.kind==='map'){ drawWinFrame(win, true); mapWindowContent(win); return; }
    if(win.kind==='load'){
      drawWinFrame(win, true);
      const r = Win.inner(win);
      const p = G.pending ? clamp(G.pending.t/1.0,0,1) : 1;
      drawLoader(r.x, r.y, r.w, r.h, win.title, p, win.t);
      return;
    }
    if(win.kind==='sys'){
      drawWinFrame(win, true);
      const r = Win.inner(win);
      const lines = win.data.lines||[];
      let yy = r.y+4;
      for(const l of lines){ text(l, r.x+4, yy, {sc:1, color:UI.text}); yy += 11; }
      const bw = 40, bx = Math.round(r.x+r.w/2-bw/2), by = r.y+r.h-16;
      drawBtn(bx, by, bw, 13, 'OK', {press: this.btnDown==='ok'});
      win.data.okRect = {x:bx, y:by, w:bw, h:13};
      return;
    }
    if(win.kind==='readme'){
      drawWinFrame(win, true);
      const r = Win.inner(win);
      const lines = wrap('Привет, Мария. Это не вирус и не программа — просто я. Я написал её, потому что словами получается хуже.', r.w-8, 1);
      let yy = r.y+4;
      for(const l of lines){ text(l, r.x+4, yy, {sc:1, color:UI.text}); yy += 11; }
      if(bothP()) ctx.drawImage(IMG.him, r.x+r.w-30, r.y+r.h-30, 26, 26);
      text('— '+CONFIG.him, r.x+4, r.y+r.h-14, {sc:1, color:CONFIG.P.sky});
      return;
    }
    if(win.kind==='about'){
      drawWinFrame(win, true);
      const r = Win.inner(win);
      text('PRINT I LOVE U OS', r.x+4, r.y+4, {sc:1, color:CONFIG.P.gold});
      text('версия 1.0 (сборка «для Марии»)', r.x+4, r.y+16, {sc:1, color:UI.dim});
      text('Собрано вручную, на коленке,', r.x+4, r.y+30, {sc:1, color:UI.text});
      text('но с любовью и без багов.', r.x+4, r.y+41, {sc:1, color:UI.text});
      text('(ну, почти.)', r.x+4, r.y+55, {sc:1, color:UI.dim});
      return;
    }
    drawWinFrame(win, true);
  },
  drawStatus(){
    const y = H-28, P = CONFIG.P;
    ctx.fillStyle = 'rgba(8,4,18,.55)'; ctx.fillRect(0, y, W, 12);
    ctx.fillStyle = 'rgba(255,246,232,.10)'; ctx.fillRect(0, y, W, 1);
    const sTxt = 'Собрано сердец: ' + storyDone() + ' / ' + CH;
    const rTxt = finaleReady() ? 'ФИНАЛ ОТКРЫТ' : ('БОНУС: ' + arcDone() + ' / ' + AR_N);
    const rW = textW(rTxt, 1) + 8;
    heart(5, y+3, 1, P.pink);
    text(sTxt, 15, y+2, {sc:fitSc(sTxt, W - rW - 20, 1), color: storyDone()>=CH ? P.green : UI.text});
    if(finaleReady()){
      const a = 0.45+0.55*Math.abs(Math.sin(this.t*3));
      ctx.globalAlpha = a;
      text(rTxt, W-5, y+2, {sc:1, align:'right', color:P.gold});
      ctx.globalAlpha = 1;
    } else {
      text(rTxt, W-5, y+2, {sc:1, align:'right', color:UI.dim});
    }
  },
  drawTaskbar(){
    const y = H-16;
    // стеклянная панель задач
    ctx.fillStyle = 'rgba(8,4,18,.55)'; ctx.fillRect(0, y-1, W, 17);
    const gg = ctx.createLinearGradient(0, y, 0, y+16);
    gg.addColorStop(0, 'rgba(107,79,160,.34)');
    gg.addColorStop(1, 'rgba(29,17,54,.5)');
    ctx.fillStyle = gg; ctx.fillRect(0, y, W, 16);
    ctx.fillStyle = 'rgba(255,246,232,.22)'; ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = 'rgba(255,246,232,.07)'; ctx.fillRect(0, y+1, W, 1);
    // ПУСК
    const pw = 34;
    drawBtn(2, y+2, pw, 12, 'ПУСК', {press:this.startOpen, color: this.startOpen?CONFIG.P.gold:UI.text});
    this.startRect = {x:2, y:y+2, w:pw, h:12};
    // кнопка открытого окна
    if(G.win){
      const bw2 = 62, bx = pw+6;
      drawBtn(bx, y+2, bw2, 12, (G.win.title||'ОКНО').slice(0,9), {press:false});
      this.winBtnRect = {x:bx, y:y+2, w:bw2, h:12};
    } else this.winBtnRect = null;
    // трей
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    const sep = Math.floor(this.t)%2 ? ':' : ' ';
    const tt = hh+sep+mm;
    const tw = textW(tt,1);
    text(tt, W-4, y+3, {sc:1, align:'right', color:UI.text});
    // сердца / музыка / звук (справа налево, без наложений)
    let tx = W-4-tw-10;
    // динамик
    ctx.fillStyle = Snd.on ? CONFIG.P.gold : '#5a4680';
    ctx.fillRect(tx-9, y+5, 2, 6); ctx.fillRect(tx-7, y+4, 2, 8); ctx.fillRect(tx-5, y+2, 2, 12);
    this.sndRect = {x:tx-12, y:y+1, w:12, h:14};
    // нота (музыка)
    ctx.fillStyle = Snd.musicOn ? CONFIG.P.green : '#5a4680';
    ctx.fillRect(tx-23, y+8, 2, 6); ctx.fillRect(tx-21, y+7, 5, 2); ctx.fillRect(tx-23, y+4, 2, 4);
    this.musRect = {x:tx-26, y:y+1, w:12, h:14};
  },
  drawStart(){
    const items = this.startItems();
    const w = 96, h = items.length*14 + 8;
    const x = 2, y = H-16-h-2;
    ctx.fillStyle = UI.dark; ctx.fillRect(x-1, y-1, w+2, h+2);
    ctx.fillStyle = UI.face; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = CONFIG.P.pink; ctx.fillRect(x, y, 3, h);
    for(let i=0;i<items.length;i++){
      const it = items[i];
      const iy = y+4+i*14;
      const hov = ptr.x>=x && ptr.x<=x+w && ptr.y>=iy && ptr.y<=iy+13;
      if(hov){ ctx.fillStyle = 'rgba(107,79,160,.45)'; ctx.fillRect(x+3, iy, w-3, 13); this.startSel = i; }
      text(it.t, x+7, iy+2, {sc:1, color: hov? '#fff6e8' : UI.dim});
    }
    this.startRectItems = {x:x, y:y, w:w, h:h, n:items.length};
  },
  startItems(){
    return [
      {t:'ПРОГРЕСС.exe', f:()=>{ this.openMapWin(); }},
      {t:'О ПРОГРАММЕ', f:()=>{ Win.open('about','О ПРОГРАММЕ',{w:170,h:82}); }},
      {t:'МУЗЫКА: '+(Snd.musicOn?'ВКЛ':'ВЫКЛ'), f:()=>{ Snd.musicOn = !Snd.musicOn; Snd.blip(); }},
      {t:'ЗВУК: '+(Snd.on?'ВКЛ':'ВЫКЛ'), f:()=>{ Snd.on = !Snd.on; Snd.blip(); }},
      {t:'НАЧАТЬ ЗАНОВО', f:()=>{ G.hearts = new Array(NH).fill(false); save(); G.fails = {}; Snd.bad(); Win.open('map','ПРОГРЕСС.exe',{w:Math.min(W-8,224), h:Math.min(H-30,320)}); }}
    ];
  },
  openMapWin(){
    if(G.win && G.win.kind==='map'){ Win.close(); return; }
    Win.open('map','ПРОГРЕСС.exe',{w:Math.min(W-8,224), h:Math.min(H-30,320)});
  },
  launch(it, dbl){
    if(it.kind==='level'){
      if(!dbl){                                   // один тап — окно прогресса с выбранным уровнем
        Snd.blip(); ripple(it.tx, it.ty);
        G.sel = it.idx;
        if(G.win && G.win.kind==='map'){ Snd.blip(); }
        else Win.open('map','ПРОГРЕСС.exe',{w:Math.min(W-8,224), h:Math.min(H-30,320), from:{x:it.tx-20,y:it.ty-16,w:40,h:32}});
        return;
      }
      Snd.coin(); ripple(it.tx, it.ty);
      G.pending = {type:'level', idx:it.idx, t:0};
      Win.open('load', 'ЗАПУСК ' + NODE_META[it.idx].name + '.exe', {w:170, h:56, from:{x:it.tx-20, y:it.ty-16, w:40, h:32}});
    } else if(it.kind==='letter'){
      if(heartsDone()>=NH){
        Snd.fanfare(); G.pending = {type:'letter', t:0};
        Win.open('load','ПЕЧАТЬ ПИСЬМА...',{w:170,h:56,from:{x:it.tx-20,y:it.ty-16,w:40,h:32}});
      } else {
        Snd.bad(); shake(3);
        openSys('ОТКАЗАНО', ['Письмо запечатано.','Собери все '+NH+' сердец,','тогда распечатаю.']);
      }
    } else if(it.kind==='readme'){
      Snd.blip(); Win.open('readme','README.txt',{w:Math.min(W-20,200), h:104, from:{x:it.tx-20,y:it.ty-16,w:40,h:32}});
    } else if(it.kind==='bin'){
      Snd.bad(); shake(2);
      openSys('КОРЗИНА', ['Сердца удалять нельзя.','Я проверял.']);
    }
  },
  /* --- ввод --- */
  key(k){
    if(k==='Escape'){ if(this.startOpen){ this.startOpen=false; return; } if(G.win){ Win.close(); return; } }
    if(k==='m'||k==='M'||k==='ь'||k==='Ь'){ return; }   // обрабатывается в G.onKey
    if(k==='n'||k==='N'||k==='т'||k==='Т'){ return; }
    if(G.win && G.win.kind==='map'){
      if(G.screens.map.key){ G.screens.map.key(k); return; }   // новая карта сама разбирается
      const cols = W>=H ? 5 : 3;
      if(k==='ArrowLeft'){ G.sel = (G.sel+NODE_META.length-1)%NODE_META.length; Snd.blip(); }
      if(k==='ArrowRight'){ G.sel = (G.sel+1)%NODE_META.length; Snd.blip(); }
      if(k==='ArrowUp'){ G.sel = (G.sel+NODE_META.length-cols)%NODE_META.length; Snd.blip(); }
      if(k==='ArrowDown'){ G.sel = (G.sel+cols)%NODE_META.length; Snd.blip(); }
      if(k===' '||k==='Enter'){ G.screens.map.choose(); }
      return;
    }
    if(G.win && G.win.kind==='sys'){ if(k===' '||k==='Enter'){ Win.close(); } return; }
    // по иконкам
    const cols = W>=H ? 5 : 3;
    if(k==='ArrowLeft'){ this.sel = (this.sel<0?0:(this.sel+this.icons.length-1)%this.icons.length); Snd.blip(); }
    if(k==='ArrowRight'){ this.sel = (this.sel<0?0:(this.sel+1)%this.icons.length); Snd.blip(); }
    if(k==='ArrowUp'){ this.sel = Math.max(0,(this.sel<0?0:this.sel)-cols); Snd.blip(); }
    if(k==='ArrowDown'){ this.sel = Math.min(this.icons.length-1,(this.sel<0?0:this.sel)+cols); Snd.blip(); }
    if(k===' '||k==='Enter'){ if(this.sel>=0) this.launch(this.icons[this.sel], true); else this.openMapWin(); }
  },
  tap(x,y){
    ripple(x,y);
    // меню «Пуск»
    if(this.startOpen){
      const s = this.startRectItems;
      if(s && x>=s.x && x<=s.x+s.w && y>=s.y && y<=s.y+s.h){
        const i = clamp(Math.floor((y-s.y-4)/14), 0, s.n-1);
        this.startOpen = false;
        const items = this.startItems(); items[i] && items[i].f();
        return;
      }
      if(this.startRect && x>=this.startRect.x-2 && x<=this.startRect.x+this.startRect.w+2 && y>=this.startRect.y-4 && y<=this.startRect.y+this.startRect.h+2){ this.startOpen=false; Snd.blip(); return; }
      this.startOpen = false;
      Snd.blip();
      return;
    }
    if(this.startRect && x>=this.startRect.x && x<=this.startRect.x+this.startRect.w && y>=this.startRect.y && y<=this.startRect.y+this.startRect.h){
      this.startOpen = true; Snd.blip(); return;
    }
    if(this.sndRect && x>=this.sndRect.x && x<=this.sndRect.x+this.sndRect.w && y>=this.sndRect.y && y<=this.sndRect.y+this.sndRect.h){
      Snd.on = !Snd.on; Snd.blip(); G.toast = Snd.on?'ЗВУК ВКЛ':'ЗВУК ВЫКЛ'; G.toastT=1.2; return;
    }
    if(this.musRect && x>=this.musRect.x && x<=this.musRect.x+this.musRect.w && y>=this.musRect.y && y<=this.musRect.y+this.musRect.h){
      Snd.musicOn = !Snd.musicOn; Snd.blip(); G.toast = Snd.musicOn?'МУЗЫКА ВКЛ':'МУЗЫКА ВЫКЛ'; G.toastT=1.2; return;
    }
    // окно
    if(G.win){
      if(Win.closeHit(G.win, x, y)){ Win.close(); return; }
      if(Win.titleHit(G.win, x, y)){ this.drag = true; return; }
      if(Win.hit(G.win, x, y)){
        if(G.win.kind==='map'){
          if(G.win.onTap){ G.win.onTap(x,y); return; }        // новая карта (вкладки + узлы)
          const ns = G.win.nodesXY || [];
          for(const nn of ns){ if(Math.abs(x-nn.x)<18 && Math.abs(y-nn.y)<22){ G.sel = nn.i; Snd.blip(); G.screens.map.choose(); return; } }
          return;
        }
        if(G.win.kind==='sys'){
          const r = G.win.data.okRect;
          if(r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h){ Win.close(); Snd.blip(); }
          return;
        }
        return;
      }
    }
    if(this.winBtnRect && x>=this.winBtnRect.x && x<=this.winBtnRect.x+this.winBtnRect.w && y>=this.winBtnRect.y && y<=this.winBtnRect.y+this.winBtnRect.h){
      Win.close(); return;
    }
    // иконки
    const i = this.iconAt(x,y);
    if(i>=0){
      Snd.blip();
      const now = this.t;
      const dbl = (this.sel===i && now-this.lastT < 0.5);
      this.sel = i;
      if(dbl) this.lastT = -9; else this.lastT = now;
      this.launch(this.icons[i], dbl);
      return;
    }
    this.sel = -1;
  },
  tapUp(){ this.drag = false; }
};

/* отпускание пальца — прекращаем тащить окно */
addEventListener('pointerup', ()=>{ if(G.screens.desktop) G.screens.desktop.drag = false; });

/* ==========================================================================
   ЧАСТЬ 3 · ЗАГРУЗКА HeartOS + ВХОД В СИСТЕМУ
   ========================================================================== */

const BOOT_LINES = [
  'Инициализация системы любовного назначения v1.0...',
  'Загрузка самых тёплых воспоминаний...'
];
const BOOT_DONE = 'Готово! Нажмите [Пробел], чтобы войти в моё сердце.';

G.screens.boot = {
  enter(){ this.t = 0; this.li = 0; this.ch = 0; this.done = false; this.gone = false; this.bar = 0; },
  update(dt){
    this.t += dt;
    if(this.li < BOOT_LINES.length){
      const line = BOOT_LINES[this.li];
      this.ch += dt*42;
      if(this.ch >= line.length){
        this.ch = 0; this.li++;
        Snd.note(1200, 0.03, 'square', 0.035);
        if(this.li < BOOT_LINES.length) this.ch -= 0.6;      // пауза между строками
      }
    } else {
      this.bar = Math.min(1, this.bar + dt*0.75);
      if(this.bar >= 1 && !this.done){ this.done = true; Snd.coin(); }
    }
  },
  finish(){
    if(this.gone) return; this.gone = true;
    Snd.unlock(); go('desktop');
  },
  key(k){ if(k===' '||k==='Enter'||k==='Escape'){ if(this.done) this.finish(); else this.bar = 1; } },
  tap(){ if(this.done) this.finish(); else this.bar = 1; },
  draw(){
    ctx.fillStyle = '#08061a'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(76,201,240,.05)';
    for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
    const cx = Math.round(W/2);
    // заголовок системы
    const a0 = 0.55+0.45*Math.abs(Math.sin(this.t*1.6));
    ctx.globalAlpha = a0;
    text('HeartOS', cx, 16, {sc:2, align:'center', color:CONFIG.P.pink});
    ctx.globalAlpha = 1;
    text('v1.0', cx, 34, {sc:1, align:'center', color:UI.dim});
    heart(cx, 46, 1, CONFIG.P.pink);
    // строки
    let y = Math.round(H*0.34);
    for(let i=0;i<Math.min(this.li+1, BOOT_LINES.length);i++){
      const full = BOOT_LINES[i];
      const s = (i===this.li) ? full.slice(0, Math.max(0, Math.floor(this.ch))) : full;
      const rows = wrap(s, W-16, 1);
      rows.forEach((l,k)=>{
        text(l, cx, y, {sc:1, align:'center', color:'#c9bde8'});
        if(i===this.li && k === rows.length-1 && Math.floor(this.t*3)%2===0){
          ctx.fillStyle = '#c9bde8';
          ctx.fillRect(cx + Math.round(textW(l, 1)/2) + 1, y, 5, 1);
        }
        y += 12;
      });
    }
    // прогресс
    if(this.li >= BOOT_LINES.length){
      drawBar(10, y+4, W-20, 7, this.bar, CONFIG.P.pink);
      text(Math.round(this.bar*100)+'%', cx, y+13, {sc:1, align:'center', color:CONFIG.P.gold});
    }
    // приглашение
    if(this.done){
      const rows = wrap(BOOT_DONE, W-24, 1);
      const bh = 10 + rows.length*12 + 12;
      const yy = Math.round(H*0.62);
      ctx.fillStyle = 'rgba(18,10,36,.78)';
      ctx.fillRect(6, yy-4, W-12, bh);
      ctx.fillStyle = CONFIG.P.pink; ctx.fillRect(6, yy-4, 2, bh);
      const a = 0.5+0.5*Math.abs(Math.sin(this.t*3));
      ctx.globalAlpha = a;
      rows.forEach((l,i)=>text(l, cx, yy+2+i*12, {sc:1, align:'center', color:CONFIG.P.green}));
      ctx.globalAlpha = 1;
      text(IS_TOUCH ? 'ТАПНИ, ЧТОБЫ ВОЙТИ' : '[ ПРОБЕЛ ]', cx, yy+bh-6, {sc:1, align:'center', color:CONFIG.P.gold});
    }
    heart(W-24, H-26, 2, 'rgba(255,93,143,'+(0.35+0.35*Math.abs(Math.sin(this.t*3))).toFixed(2)+')');
    bezel();
    crtOverlay(this.t);
  }
};

/* ==========================================================================
   ЭКРАН ВХОДА (запасной, если кто-то зайдёт напрямую)
   ========================================================================== */
G.screens.title = {
  enter(){ this.t = 0; },
  update(dt){ this.t += dt; },
  draw(){
    drawWallpaper(this.t*0.4);

    ctx.fillStyle = UI.line; ctx.fillRect(px0-1,py0-1,pw+2,ph+2);
    ctx.fillStyle = UI.face; ctx.fillRect(px0, py0, pw, ph);
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    text(hh+(Math.floor(this.t)%2?':':' ')+mm, cx, py0+8, {sc:3, align:'center', color:'#e6dcf7'});
    const ps = 30;
    if(bothP()){
      ctx.drawImage(IMG.him, cx-ps-10, py0+40, ps, ps);
      ctx.drawImage(IMG.her, cx+10, py0+40, ps, ps);
    }
    heart(cx-4, py0+38, 2, P.pink);
    let ty = py0+ps+46;
    text(CONFIG.her.toUpperCase(), cx, ty, {sc:1, align:'center', color:P.pink}); ty += 12;
    text('— ' + CONFIG.him.toUpperCase(), cx, ty, {sc:1, align:'center', color:P.sky}); ty += 14;
    text(CONFIG.title, cx, ty, {sc:1, align:'center', color:UI.dim});
    const a = 0.45+0.55*Math.abs(Math.sin(this.t*3));
    ctx.globalAlpha = a;

  key(k){ if(k===' '||k==='Enter'){ Snd.unlock(); Snd.coin(); go('desktop'); } },

};

/* ==========================================================================
   ЧАСТЬ 4 · УРОВЕНЬ «КОД» (L8)
   Редактор + терминал: почини программу, чтобы принтер напечатал признание.
