   ЧАСТЬ 26 · НОВЫЕ ТЕКСТЫ: командная строка и пасхалки
   Перехватываем termExec: сначала новый набор команд, потом старые.
   Старый терминал и его команды не сломаны — просто у них появились
   новые ответы и новые слова.
   ========================================================================== */

const TXT_C = {
  gold:'#ffd166', green:'#8ce99a', pink:'#ff5d8f', sky:'#4cc9f0',
  purple:'#6b4fa0', grey:'#a08cc0', ink:'#e6dcf7'
};

/* --- построчный вывод с паузами (очередь живёт в игровом цикле) --- */
function termQueue(win, lines, done){
  win.data.q = lines.map(l => Array.isArray(l) ? {t:l[0], c:l[1]}
                        : (l && typeof l === 'object' ? {t:l.t, c:l.c || TXT_C.green} : {t:l, c:TXT_C.green}));
  win.data.qT = 0.06;
  win.data.qDone = done || null;
}
function termFlush(win){
  if(!win) return;
  if(win.data.q && win.data.q.length){
    for(const l of win.data.q) _termPrint0.call(null, win, l.t, l.c);
    win.data.q = [];
  }
  if(win.data.qDone){ const f = win.data.qDone; win.data.qDone = null; f(win); }
}
function termTick(dt){
  const w = G.win;
  if(!w || w.kind !== 'term') return;
  if(w.data.q && w.data.q.some(l => !l || typeof l.t !== 'string')) w.data.q = [];   // страховка
  if(w.data.q && w.data.q.length){
    w.data.qT -= dt;
    if(w.data.qT <= 0){
      w.data.qT = 0.30;
      const l = w.data.q.shift();
      _termPrint0.call(null, w, l.t, l.c);
      Snd.type();
      if(!w.data.q.length && w.data.qDone){
        const f = w.data.qDone; w.data.qDone = null; f(w);
      }
    }
  }
}
/** напечатать несколько строк сразу */
function termSay(win, lines){
  for(const l of lines){
    if(Array.isArray(l)) _termPrint0.call(null, win, l[0], l[1]);
    else _termPrint0.call(null, win, l, TXT_C.green);
  }
}

const TERM_HELP = [
  ['help      — список команд', TXT_C.gold],

  ['open      — открыть программу', TXT_C.green],

  const P = CONFIG.P, q = raw.trim().toLowerCase();

      ['Без случайных игроков.', C.grey],
      ['Только для одного человека.', C.purple],
      ['Для ' + CONFIG.her + '.', C.pink]
    ]);
    return;
  }
  if(q.indexOf('color') === 0 || q.indexOf('цвет') === 0){
    const cols = {pink:P.pink, gold:P.gold, green:'#8ce99a', sky:P.sky, red:P.red, white:P.ink, purple:'#b197fc'};
    const cn = (q.split(/\s+/)[1] || '').replace(/ё/g, 'е');
    if(cols[cn]){
      win.data.col = cols[cn];
      termPrint(win, 'ЦВЕТ ИЗМЕНЁН: ' + cn, cols[cn]);
      G.toast = 'ЦВЕТ ИЗМЕНЁН'; G.toastT = 1.4;
      Snd.coin();
    } else {
      termPrint(win, 'НЕИЗВЕСТНЫЙ ЦВЕТ.', P.red);
      termPrint(win, 'ДОСТУПНО:', C.grey);
      termPrint(win, 'pink gold green sky red white purple', C.green);
      Snd.bad();
    }
    return;
  }
  if(q === 'crt' || q === 'эффекты'){
    G.crt = G.crt ? 0 : 1;
    termPrint(win, 'CRT EFFECT: ' + (G.crt ? 'ON' : 'OFF'), C.gold);
    termPrint(win, G.crt ? 'Система выглядит старше.' : 'Теперь всё слишком чисто.', C.grey);
    Snd.blip();
    return;
  }
  if(q === 'clear' || q === 'cls' || q === 'очистить'){ win.data.lines = []; return; }
  if(q === 'exit' || q === 'quit' || q === 'выход'){ Win.close(); return; }
  if(q === 'open' || q === 'запуск' || q === 'старт'){
    const name = (raw.trim().split(/\s+/)[1] || '').toUpperCase();
    if(name === 'ARCHIVE' || name === 'АРХИВ' || name === 'АРХИВ.EXE'){ _termExec0.call(this, win, 'archive'); return; }
    if(name === 'MARIYA' || name === 'MARIYA.TXT'){ if(typeof launchMariya === 'function') launchMariya(); return; }
  }
  // неизвестная команда — новый текст
  if(q){
    termPrint(win, 'КОМАНДА НЕ НАЙДЕНА.', P.red);
    termPrint(win, 'Но попробовать было красиво.', C.grey);
    termPrint(win, 'Набери help.', C.purple);
    Snd.bad();
    return;
  }
  return _termExec0.call(this, win, raw);
};

/* ------------------------------------------------------------------
   Универсальное окно с текстом (прокрутка)
   ------------------------------------------------------------------ */
function openTxtFile(name, from, back){
  const doc = (name === 'README_FINAL.txt') ? README_FINAL : DEVLOGS[name];
  if(!doc){ openSys('НЕТ ТАКОГО ФАЙЛА', ['Файл не найден.']); return; }
  Snd.blip();
  const w = Math.min(W-14, 200), h = Math.min(H-30, 150);
  const win = Win.open('txtfile', name, {w:w, h:h, from:from || null});
  win.data.name = name;
  win.data.doc = doc;
  win.data.scroll = 0;
  win.data.maxScroll = 0;
  win.data.fade = 0;
  win.data.back = back || null;
  return win;
}
function txtLines(doc, maxW){
  const out = [];
  if(doc.day) out.push({t:doc.day, c:'#ffd166'});
  out.push({t:'-'.repeat(Math.min(18, Math.floor(maxW/6))), c:'#4a3670'});
  for(const l of doc.lines){
    if(l === '') out.push({t:'', c:'#e6dcf7'});
    else for(const w of wrap(l, maxW, 1)) out.push({t:w, c:'#e6dcf7'});
  }
  if(doc.tail) for(const l of doc.tail) out.push({t:l, c:'#ff5d8f'});
  return out;
}
function drawTxtFile(win){
  const P = CONFIG.P, r = Win.inner(win), t = win.t, d = win.data;
  const maxW = r.w - 10;
  const lines = txtLines(d.doc, maxW);
  const lh = 11, rows = Math.max(1, Math.floor((r.h - 16)/lh));
  d.maxScroll = Math.max(0, lines.length - rows);
  if(d.scroll > d.maxScroll) d.scroll = d.maxScroll;
  ctx.fillStyle = '#150c26'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = 'rgba(107,79,160,.18)'; ctx.fillRect(r.x, r.y, r.w, 1);
  // портрет автора в углу
  const av = d.name === 'README_FINAL.txt';
  if(av) ctx.globalAlpha = .9;
  if(bothP() && d.name.indexOf('FINAL') >= 0) ctx.drawImage(IMG.him, r.x+r.w-28, r.y+r.h-28, 24, 24);
  ctx.globalAlpha = 1;
  // строки
  const vis = lines.slice(d.scroll, d.scroll + rows);
  let y = r.y + 4;
  for(const l of vis){
    if(l.t) text(l.t, r.x+5, y, {sc:1, color:l.c});
    y += lh;
  }
  // подсказка прокрутки
  if(d.maxScroll > 0){
    const a = 0.45+0.35*Math.abs(Math.sin(t*3));
    ctx.globalAlpha = a;
    text(IS_TOUCH ? 'ЛИСТАЙ ВНИЗ' : 'СТРЕЛКИ - ЛИСТАТЬ', r.x+r.w/2, r.y+r.h-11, {sc:1, align:'center', color:P.gold});
    ctx.globalAlpha = 1;
    // полоска
    const bx = r.x+r.w-5, bh = r.h-10;

const MR = {
  seen:  new Array(MR_N).fill(0),
  room:  false,                       // комната уже открывалась
  pack(){ return {s:this.seen.slice(), r:this.room?1:0}; },
  unpack(o){
    if(!o) return;
    if(Array.isArray(o.s)) for(let i=0;i<MR_N;i++) this.seen[i] = o.s[i]?1:0;
    this.room = !!o.r;
  },
  load(){
    try{
      const d = JSON.parse(localStorage.getItem(ARCH_KEY)||'null');
      if(d && d.m) this.unpack(d.m);
    }catch(e){}
  },
  count(){ let n=0; for(const v of this.seen) n += v?1:0; return n; },
  all(){ return this.count() >= MR_N; },
  forget(){ this.seen.fill(0); this.room = false; }
};
(function(){
  const prev = save;
  save = function(){
    try{
      const d = JSON.parse(localStorage.getItem(ARCH_KEY)||'null') || {};

G.screens.memroom = {
  enter(){ this.t = 0; this.open = -1; this.tOpen = 0; this.chars = 0; },
  update(dt){
    this.t += dt;
    if(this.open >= 0) this.tOpen += dt;
  },
  /* --- геометрия --- */
  geom(){
    const pw = Math.min(72, Math.max(34, Math.round(W/3.7)));
    const ph = Math.round(pw*0.76);
    const gap = Math.max(8, Math.round(pw*0.22));
    const tot = MR_N*pw + (MR_N-1)*gap;
    const x0 = Math.round((W - tot)/2), y0 = 32;
    const photos = [];
    for(let i=0;i<MR_N;i++) photos.push({x:x0 + i*(pw+gap), y:y0, w:pw, h:ph});
    const floorY = Math.round(Math.min(H*0.72, H-96));
    const deskW = Math.min(88, W-40);
    const desk = {x:Math.round((W-deskW)/2), y:floorY-Math.round(deskW*0.42), w:deskW, h:Math.round(deskW*0.42)};
    const mw = Math.round(deskW*0.42), mh = Math.round(mw*0.78);
    const exe = {x:Math.round(desk.x + deskW/2 - mw/2) - 3, y:Math.max(photos[MR_N-1].y + ph + 10, desk.y - 3 - mh - 2), w:mw+6, h:mh+8};
    return {pw:pw, ph:ph, photos:photos, floorY:floorY, desk:desk, exe:exe};
  },
  hitPhoto(g, x, y){
    for(let i=0;i<MR_N;i++){
      const p = g.photos[i], m = 3;
      if(x > p.x-m && x < p.x+p.w+m && y > p.y-m && y < p.y+p.h+m) return i;
    }
    return -1;
  },
  openPhoto(i){ this.open = i; this.tOpen = 0; this.chars = 0; Snd.clack(); MR.seen[i] = 1; save(); },
  closePhoto(){ this.open = -1; this.tOpen = 0; Snd.clack(); },
  key(k){
    const n = {'1':0,'2':1,'3':2,'q':0,'w':1,'e':2}[k];
    if(n !== undefined && this.open < 0){ this.pick = n; this.openPhoto(n); return; }
    if(k === 'Escape'){
      if(this.open >= 0){ this.closePhoto(); return; }
      Snd.blip(); go('map'); return;
    }
    if(k === ' ' || k === 'Enter'){
      if(this.open >= 0) this.nextZoom(); else this.openPhoto(this.pick || 0);
    }
  },
  /* первый тап дописывает текст, второй закрывает */

    else this.closePhoto();
  },
  tap(x, y){
    if(this.open >= 0){ this.nextZoom(); return; }
    const g = this.geom(), mz = g.exe;
    if(x > mz.x && x < mz.x+mz.w && y > mz.y && y < mz.y+mz.h){   // ФИНАЛ.exe
      MR.room = true; save();
      Snd.fanfare(); go('finale'); return;
    }
    const i = this.hitPhoto(g, x, y);
    if(i >= 0){ this.openPhoto(i); return; }
    if(y > H-18){ Snd.blip(); go('map'); return; }
  },
  /* --- фон комнаты --- */
  d_room(t, g){
    const P = CONFIG.P;
    ctx.drawImage(bgCache('mroom', p=>{
      ditherGradVTo(p,0,0,W,H,'#160e2e','#2a1a3e',14);
      veilBlobTo(p, W*0.5, g.floorY, Math.max(W,H)*0.6, 'rgba(255,190,120,.10)');
    }), 0, 0);
    // обои
    for(let yy=16, row=0; yy<g.floorY; yy+=10, row++)
      for(let xx=(row%2)?5:0; xx<W; xx+=10){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(xx,yy,4,4); }
    // плинтус и пол
    ctx.fillStyle = '#3a2a4e'; ctx.fillRect(0, g.floorY, W, 2);
    ctx.fillStyle = '#241a34'; ctx.fillRect(0, g.floorY+2, W, H-g.floorY-2);
    for(let xx=0; xx<W; xx+=8){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(xx, g.floorY+4, 6, 1); }
    // окно: ночь и луна
    const wx = W - 40, wy = Math.round(g.photos[0].y + g.photos[0].h + 26), ww = 28, wh = 26;
    ctx.fillStyle = '#1b2a4a'; ctx.fillRect(wx, wy, ww, wh);
    ctx.fillStyle = '#c8d8ff'; ctx.fillRect(wx+18, wy+5, 5, 5);
    ctx.fillStyle = '#2a3a5a'; ctx.fillRect(wx+19, wy+6, 3, 1); ctx.fillRect(wx+20, wy+7, 1, 1);
    ctx.fillStyle = '#3a2560';
    ctx.fillRect(wx-1, wy-1, ww+2, 1); ctx.fillRect(wx-1, wy+wh, ww+2, 1);
    ctx.fillRect(wx-1, wy-1, 1, wh+2); ctx.fillRect(wx+ww, wy-1, 1, wh+2);
    ctx.fillRect(wx+(ww>>1)-1, wy, 2, wh);
    ctx.globalAlpha = 0.08 + 0.02*Math.sin(t*0.7);
    ctx.fillStyle = '#c8d8ff';
    for(let i=0;i<26;i++) ctx.fillRect(wx+3+i, wy+wh+i, 20-i*0.6, 1);
    ctx.globalAlpha = 1;
    // настенные часы: 03:17
    this.d_clock(g, Math.max(6, wx-20), wy+4);
    // тёплый торшер
    this.d_lamp(g, t);
    // ковёр
    const rw = Math.min(130, W-40), rx = Math.round((W-rw)/2);
    const ry = Math.min(H-34, g.floorY + Math.max(14, Math.round((H-g.floorY)/2) - 8));
    ctx.fillStyle = '#4a2a44';
    ctx.fillRect(rx, ry, rw, 10);
    ctx.fillStyle = '#5c3450';
    ctx.fillRect(rx+3, ry+2, rw-6, 6);
    ctx.fillStyle = 'rgba(255,214,150,.18)'; ctx.fillRect(rx+8, ry+4, rw-16, 2);
    // стол с компьютером
    this.d_desk(g, t);
  },
  d_clock(g, x, y){
    ctx.fillStyle = '#2a1c40'; ctx.fillRect(x-1, y-1, 15, 15);
    ctx.fillStyle = '#e8dcc0'; ctx.fillRect(x, y, 13, 13);
    ctx.fillStyle = '#3a2560';
    ctx.fillRect(x+6, y+2, 1, 5);      // часовая на 3
    ctx.fillRect(x+6, y+6, 3, 1);      // минутная на 17 мин
    ctx.fillStyle = '#a08c66'; ctx.fillRect(x+1, y+6, 1, 1); ctx.fillRect(x+11, y+6, 1, 1);
  },
  d_lamp(g, t){
    const P = CONFIG.P, x = 16, y = g.floorY - 46;
    ctx.globalAlpha = .12 + .03*Math.sin(t*1.6);
    glowAt(x+6, y+6, 46, P.gold, 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3a2a4e'; ctx.fillRect(x+5, y+6, 2, 40);     // стойка
    ctx.fillRect(x+2, y+44, 9, 2);                              // основание
    ctx.fillStyle = '#c8a35a'; ctx.fillRect(x+1, y, 12, 7);     // абажур
    ctx.fillStyle = '#ffe6a8'; ctx.fillRect(x+3, y+5, 8, 2);
  },
  d_desk(g, t){
    const P = CONFIG.P, d = g.desk;
    // ножки и столешница
    ctx.fillStyle = '#2c1f42'; ctx.fillRect(d.x+2, d.y, 4, d.h); ctx.fillRect(d.x+d.w-6, d.y, 4, d.h);
    ctx.fillStyle = '#4a3358'; ctx.fillRect(d.x, d.y-3, d.w, 4);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(d.x, d.y-3, d.w, 1);
    // монитор
    const mw = Math.round(d.w*0.42), mh = Math.round(mw*0.78);
    const mx = g.exe.x + 3, my = g.exe.y + 2;
    const all = MR.all();
    const pulse = all ? .10 + .06*Math.abs(Math.sin(t*2.4)) : .04;
    ctx.globalAlpha = all ? pulse : 0;
    glowAt(mx+mw/2, my+mh/2, mw*1.3, P.gold, 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#241a38'; ctx.fillRect(mx-2, my-2, mw+4, mh+4);
    ctx.fillStyle = all ? '#241a44' : '#1a1430'; ctx.fillRect(mx, my, mw, mh);
    // «рабочий стол» на экране
    ctx.fillStyle = all ? '#3f7a4a' : '#2a2a44';
    ctx.fillRect(mx+1, my+mh-2, mw-2, 2);
    text('ФИНАЛ.EXE', mx+mw/2, my+mh-10, {sc:fitSc('ФИНАЛ.EXE', mw-4, 1), align:'center', color: all ? '#ffe6a8' : '#4a4670'});
    // ярлык на полу под столом
    const cap2 = all ? 'ВСЁ, МОЖНО' : 'МОЖНО И СЕЙЧАС';
    text(cap2, d.x+d.w/2, d.y+d.h+3, {sc:fitSc(cap2, W-16, 1), align:'center', color: all ? P.gold : '#6b5a8f'});
  },
  /* --- фотография --- */
  d_photo(i, x, y, w, h, t, dim){
    const m = MR_MEM[i];
    ctx.fillStyle = '#2a1c40'; ctx.fillRect(x-2, y-2, w+4, h+4);
    ctx.fillStyle = dim ? '#1a1330' : '#120a20'; ctx.fillRect(x, y, w, h);
    const u = w/44;
    if(i === 0){                                   // первый снег
      ctx.fillStyle = '#2b3a63'; ctx.fillRect(x, y, w, h);
      // домик на горизонте
      ctx.fillStyle = '#1e2440';
      ctx.fillRect(x+Math.round(3*u), y+Math.round(h*0.40), Math.round(10*u), Math.round(h*0.20));
      ctx.fillStyle = '#3a2a4a';
      ctx.fillRect(x+Math.round(2*u), y+Math.round(h*0.36), Math.round(12*u), Math.round(3*u));
      ctx.fillStyle = '#c9d6e8'; ctx.fillRect(x, y+Math.round(h*0.55), w, h);
      ctx.fillStyle = '#eef3fb';
      for(let q=0;q<12;q++) ctx.fillRect(x+Math.round((q*6.7+2)*u)%w, y+Math.round((q*4.3+2)*u)%Math.max(1,Math.round(h*0.5)), Math.max(1,Math.round(u)), Math.max(1,Math.round(u)));
      // двое
      const fy0 = y+Math.round(h*0.78);
      ctx.fillStyle = '#3a2f5c';
      ctx.fillRect(x+Math.round(w*0.30), fy0-Math.round(8*u), Math.round(4*u), Math.round(8*u));
      ctx.fillRect(x+Math.round(w*0.54), fy0-Math.round(7*u), Math.round(4*u), Math.round(7*u));
      ctx.fillStyle = '#f0c8d8';
      ctx.fillRect(x+Math.round(w*0.30), fy0-Math.round(7*u), Math.round(4*u), Math.max(1,Math.round(u)));
      heart(x+w/2, fy0-Math.round(3*u), 1, '#ff8fb4');
    } else if(i === 1){                            // ночь без интернета
      ctx.fillStyle = '#141026'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#2b2148'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#ffd98a'; ctx.fillRect(x+Math.round(4*u), y+Math.round(3*u), Math.round(w-8*u), Math.round(h-7*u));
      ctx.fillStyle = '#3a2f18';
      ctx.fillRect(x+Math.round(7*u), y+Math.round(6*u), Math.round(4*u), Math.round(h-12*u));
      ctx.fillRect(x+Math.round(w-13*u), y+Math.round(7*u), Math.round(4*u), Math.round(h-14*u));
      ctx.fillStyle = '#2a2140';
      ctx.fillRect(x+Math.round(5*u), y+Math.round(h-2*u), Math.round(w-10*u), Math.round(2*u));
    } else {                                       // 03:17
      ctx.fillStyle = '#171029'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#2b3a63'; ctx.fillRect(x+2, y+Math.round(h*0.10), w-4, Math.round(h*0.45));
      ctx.fillStyle = '#c8d8ff'; ctx.fillRect(x+Math.round(3*u), y+Math.round(4*u), Math.round(3*u), Math.round(3*u));
      ctx.fillStyle = '#101828'; ctx.fillRect(x+Math.round(w-9*u), y+h-Math.round(8*u), Math.round(7*u), Math.round(6*u));
      const fy = y+Math.round(h*0.64);
      const hx = x+Math.round(w*0.27);
      ctx.fillStyle = '#2f2a4a';
      ctx.fillRect(hx-Math.round(2*u), fy-Math.round(5*u), Math.round(4*u), Math.round(7*u));
      ctx.fillRect(hx-Math.round(1*u), fy+Math.round(2*u), Math.max(1,Math.round(u)), Math.round(3*u));
      ctx.fillRect(hx, fy+Math.round(2*u), Math.max(1,Math.round(u)), Math.round(3*u));
      const ex = x+Math.round(w*0.70);
      const fw = Math.round(7*u), fh = Math.round(8*u);
      ctx.drawImage(IMG.her, ex-(fw>>1), fy-Math.round(9*u), fw, fh);
      ctx.globalAlpha = 0.45 + 0.25*Math.sin(t*3);
      ctx.fillStyle = '#ff5d8f';
      ctx.fillRect(ex+Math.round(4*u), fy-Math.round(9*u), Math.max(1,Math.round(u)), Math.max(1,Math.round(u)));
      ctx.globalAlpha = 1;
    }
    if(!dim){
      ctx.globalAlpha = 0.10 + 0.04*Math.sin(t*1.1 + i);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, Math.max(2, Math.round(3*u)));
      ctx.globalAlpha = 1;
    }
  },
  d_photoFrame(i, g, t){
    const P = CONFIG.P, p = g.photos[i], seen = !!MR.seen[i];
    if(this.open === i){
      ctx.globalAlpha = .5 + .3*Math.sin(t*4);
      ctx.fillStyle = P.pink; ctx.fillRect(p.x-3, p.y-3, p.w+6, p.h+6);
      ctx.globalAlpha = 1;
    }
    this.d_photo(i, p.x, p.y, p.w, p.h, t, false);
    if(!seen){
      const a = .4 + .35*Math.abs(Math.sin(t*2.2 + i));
      ctx.globalAlpha = a;
      text('?', p.x+p.w-4, p.y+1, {sc:1, color:P.gold});
      ctx.globalAlpha = 1;
    }
    if(seen)
      text(MR_MEM[i].tag, p.x+p.w/2, p.y+p.h+5, {sc:fitSc(MR_MEM[i].tag, p.w, 1), align:'center', color:'#a89ad0'});
  },
  /* --- крупный просмотр: текст -> зум -> подпись --- */
  d_zoom(g, t){
    const P = CONFIG.P, i = this.open, m = MR_MEM[i], p = g.photos[i];
    const to = this.tOpen;
    ctx.fillStyle = 'rgba(6,3,14,' + (0.55 + 0.3*clamp(to/0.5,0,1)).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
    const tw = Math.min(W-36, 150), th = Math.round(tw*0.78);
    const k = easeOut(clamp((to-0.30)/0.75, 0, 1));
    const x = lerp(p.x, (W-tw)/2, k), y = lerp(p.y, Math.round(H*0.30 - th/2), k);
    const w = lerp(p.w, tw, k), h = lerp(p.h, th, k);
    if(i === 2 && k > .4){
      ctx.globalAlpha = (k-.4)*.5;
      glowAt(x+w/2, y+h/2, w*0.7, P.pink, 1);
      ctx.globalAlpha = 1;
    }
    this.d_photo(i, Math.round(x), Math.round(y), Math.round(w), Math.round(h), G.t, false);
    // текст печатается
    if(to > 0.25){
      const a = clamp((to-0.25)/0.4, 0, 1);
      ctx.globalAlpha = a;
      text(m.name, W/2, Math.round(y) - 12, {sc:fitSc(m.name, W-20, 1), align:'center', color:'#a89ad0'});
      ctx.globalAlpha = 1;
    }
    if(to > 0.9){
      const shown = Math.floor((to-0.9)*38);
      const live = clamp(Math.max(this.chars, shown), 0, m.say.length);
      this.chars = live;
      const txt = safeLine(m.say).slice(0, live);
      const lh = 11, ty = Math.round(y+h) + 10;
      ctx.fillStyle = 'rgba(10,6,20,.6)'; ctx.fillRect(6, ty-4, W-12, Math.min(H-ty-4, 54));
      let yy = ty;
      for(const l of wrap(txt, W-24, 1).slice(0, 3)){ text(l, W/2, yy, {sc:1, align:'center', color:'#e8dff5'}); yy += lh; }
      // подпись — в конце
      if(live >= safeLine(m.say).length && to > 1.7){
        const a = clamp((to-1.7)/0.7, 0, 1);
        ctx.globalAlpha = a;
        text(m.cap, W/2, yy+2, {sc:1, align:'center', color:P.gold});
        ctx.globalAlpha = 1;
        if(m.id === 'MEMORY_03'){
          ctx.globalAlpha = a*.7;
          text('...', W/2, yy+14, {sc:2, align:'center', color:P.pink});
          ctx.globalAlpha = 1;
        }
      }
    }
    if(to > 0.5){
      const a = .45+.35*Math.abs(Math.sin(to*3));
      ctx.globalAlpha = a;
      text(this.chars < m.say.length ? (IS_TOUCH?'ТАПНИ - ДОПИСАТЬ':'ПРОБЕЛ - ДОПИСАТЬ') : (IS_TOUCH?'ТАПНИ - ЗАКРЫТЬ':'ПРОБЕЛ - ЗАКРЫТЬ'),
           W/2, H-14, {sc:1, align:'center', color:'#6b4fa0'});
      ctx.globalAlpha = 1;
    }
  },
  draw(){
    const P = CONFIG.P, t = this.t, g = this.geom();
    this.d_room(t, g);
    for(let i=0;i<MR_N;i++) this.d_photoFrame(i, g, t);
    // заголовок
    ctx.fillStyle = 'rgba(10,6,20,.72)'; ctx.fillRect(0, 0, W, 14);
    text('MEMORY ROOM', W/2, 3, {sc:fitSc('MEMORY ROOM', W-20, 1), align:'center', color:P.gold});
    // прогресс
    const n = MR.count();
    const hw = MR_N*12, hx = Math.round(W/2 - hw/2);
    for(let i=0;i<MR_N;i++) heart(hx+i*12+2, 18, 1, MR.seen[i] ? P.pink : '#3a2560');
    // подпись снизу
    ctx.fillStyle = 'rgba(10,6,20,.6)'; ctx.fillRect(0, H-16, W, 16);
    const hint = this.open >= 0 ? '' : (IS_TOUCH ? 'ТАПНИ ФОТО - НИЗ - ВЫЙТИ' : '1-3 - ФОТО. ESC - ВЫЙТИ');
    if(hint){
      const hs = fitSc(hint, W-12, 1);
      if(textW(hint, hs) <= W-12) text(hint, 6, H-12, {sc:hs, color:'#6b4fa0'});
    }
    if(this.open >= 0) this.d_zoom(g, t);
    motes(G.t, 12, '#ffd166', .18);
    vignette(0.45); crtOverlay(G.t);
  }
};

/* ===== ЧАСТЬ: 30_bonus_plus.js ===== */
/* ==========================================================================
   ЧАСТЬ 30 · ВТОРАЯ ВОЛНА — новые механики и графика для 8 бонусных игр
   Ничего не ломаем: оборачиваем enter/update/draw и добавляем своё состояние
   с префиксом bp_. Все новые поля опциональны — если их нет, игра работает
   как раньше.
   5 РУКА       — ГОРЯЧАЯ РУКА (искры ловятся рукой, двойной обогрев)
   6 РИТМ       — ЦЕПЬ (серия из 6 попаданий: слоумо + вспышка)
   7 ДОЖДЬ      — ЛИВЕНЬ + МОЛНИЯ (магнит на 3 секунды)
   8 ЛАБИРИНТ   — СВЕТЛЯЧОК (отстающий огонёк, подсказка к цели)
   9 НЕ ПРОМОКНИ— РЫВОК (рывок + инерция, каденция 2.6 с)
   10 МЕМОРИ    — ПОДГЛЯНУТЬ (показать все карты на 0.8 с)
   11 КОД        — КОНСОЛЬ (живой лог режима и ошибок)
   12 ПЕЧАТЬ     — ЛЕНТА (бумага с текстом, разворот в финале)
   ========================================================================== */

const BP = {};
const BP_R = Math.PI*2;

/** безопасно обернуть метод уровня */
function bpWrap(L, name, after){
  const old = L[name];
  L[name] = function(){
    const r = old.apply(this, arguments);
    after.call(this, arguments);
    return r;
  };
  return old;
}
/** новые поля уровня (bp_*) */
function bpFields(L, def){
  const old = L.enter;
  L.enter = function(){
    if(old) old.apply(this, arguments);
    for(const k in def) this[k] = def[k];
  };
}
function bpNow(){ return G.state === 'level' && LEVELS[G.level] === this; }

/* маленький прибор: заряд-шкала в едином стиле */
function bpGauge(x, y, w, h, v, col, glowCol){
  ctx.fillStyle = '#120a24'; ctx.fillRect(x-1, y-1, w+2, h+2);
  ctx.fillStyle = '#241445'; ctx.fillRect(x, y, w, h);
  const f = Math.max(0, Math.round((w-2)*clamp(v,0,1)));
  ctx.fillStyle = col; ctx.fillRect(x+1, y+1, f, h-2);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x+1, y+1, f, 1);
  if(glowCol && f > w*0.85){
    ctx.globalAlpha = 0.20 + 0.20*Math.abs(Math.sin(performance.now()/120));
    ctx.fillStyle = glowCol; ctx.fillRect(x-2, y-2, w+4, h+4);
    ctx.globalAlpha = 1;
  }
}

/* ==========================================================================
   5 · РУКА — ГОРЯЧАЯ РУКА
   ========================================================================== */
(function(){
const L = LEVELS[5]; if(!L) return;
BP.ruka = L;
bpFields(L, {bpHeat:0, bpHot:0, bpSparks:[], bpSparkT:0});
const _say = L.say;
L.say = function(t, col){
  _say.call(this, t, col);
  if(t === 'ИДЕАЛЬНО!') this.bpHeat = Math.min(100, this.bpHeat + 13);
  else if(t === 'ЗОЛОТОЙ УЛОВ!') this.bpHeat = Math.min(100, this.bpHeat + 22);
  else if(t === 'МИМО' || t === 'ПУСТОТА') this.bpHeat = Math.max(0, this.bpHeat - 12);
};
const R = Math.PI*2;
bpWrap(L, 'update', function(){
  const dt = 1/60;
  if(this.bpHot > 0){
    this.bpHot -= dt;
    this.bpSparkT -= dt;
    if(this.bpSparkT <= 0){
      this.bpSparkT = 0.42;
      this.bpSparks.push({a:rnd(0,R), r:this.R + 26, sp:rnd(26,44), t:0});
    }
    for(let i=this.bpSparks.length-1;i>=0;i--){
      const s = this.bpSparks[i];
      s.t += dt; s.r -= s.sp*dt; s.a += dt*0.5;
      const px = this.cx + Math.cos(s.a)*s.r, py = this.cy + Math.sin(s.a)*s.r;
      let d = s.a - this.a;
      while(d > Math.PI) d -= R; while(d < -Math.PI) d += R;
      if(s.r < this.R + 20 && Math.abs(d) < 0.19){
        this.meter = Math.min(100, this.meter + 7);
        popText(px, py-6, '+7', CONFIG.P.gold);
        ring(px, py, CONFIG.P.gold, 16, 0.26);
        fx(px, py, 5, CONFIG.P.gold, 60, 0.4, {g:30});
        Snd.coin();
        this.bpSparks.splice(i,1);
        if(this.meter >= 100 && bpNow.call(this)){ this.meter = 100; this.win(); }
        continue;
      }
      if(s.r < 8 || s.t > 4) this.bpSparks.splice(i,1);
    }
    if(this.bpHot <= 0){
      this.bpHot = 0; this.bpSparks.length = 0;
      this.say('РУКА ОСТЫЛА', CONFIG.P.dim);
    }
  } else if(this.bpHeat >= 100){
    this.bpHeat = 0; this.bpHot = 6.5; this.bpSparkT = 0;
    Snd.fanfare(); punch(.10); flashScreen(CONFIG.P.gold, .30); shake(5);
    ring(this.cx, this.cy, CONFIG.P.gold, this.R+30, .8, 1);
    ring(this.cx, this.cy, CONFIG.P.pink, this.R+14, .6, 1);
    this.say('РУКА ГОРЯЧАЯ!', CONFIG.P.gold);
  }
});
bpWrap(L, 'draw', function(){
  const P = CONFIG.P, t = this.t;
  // искры
  for(const s of this.bpSparks){
    const px = Math.round(this.cx + Math.cos(s.a)*s.r), py = Math.round(this.cy + Math.sin(s.a)*s.r);
    const a = clamp(1 - s.t/3, 0, 1);
    ctx.globalAlpha = a;
    if(FXQ > .4) glowAt(px, py, 9, P.gold, .25);
    ctx.fillStyle = P.gold; ctx.fillRect(px-1, py-1, 3, 3);
    ctx.fillStyle = '#fff6e8'; ctx.fillRect(px, py, 1, 1);
    ctx.globalAlpha = 1;
  }
  // шкала тепла — в левом нижнем углу, над счётчиком серии
  const pw = 74, ph = 15, px0 = 4, py0 = H-ph-18;
  ctx.fillStyle = 'rgba(9,5,20,.78)'; ctx.fillRect(px0, py0, pw, ph);
  ctx.fillStyle = this.bpHot > 0 ? 'rgba(255,209,103,.7)' : 'rgba(107,79,160,.5)';
  ctx.fillRect(px0, py0, 1, ph);
  if(this.bpHot > 0){
    ctx.globalAlpha = .10 + .05*Math.sin(t*8);
    ctx.fillStyle = P.gold; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  const lab = this.bpHot > 0 ? ('ГОРЯЧАЯ ' + Math.ceil(this.bpHot)) : 'ТЕПЛО';
  text(lab, px0+5, py0+1, {sc:1, color: this.bpHot>0 ? P.gold : P.dim});
  bpGauge(px0+4, py0+9, pw-8, 5,
          this.bpHot > 0 ? this.bpHot/6.5 : this.bpHeat/100,
          this.bpHot > 0 ? P.gold : P.pink2, P.gold);
  if(this.bpHot > 0 && FXQ > .4) glowAt(px0+pw/2, py0+ph/2, 30, P.gold, .12);
});
})();

/* ==========================================================================
   6 · РИТМ — ЦЕПЬ
   ========================================================================== */
(function(){
const L = LEVELS[6]; if(!L || !L.hit) return;
BP.ritm = L;
bpFields(L, {bpChain:0, bpEcho:[]});
const _say = L.say;
L.say = function(t, col){
  _say.call(this, t, col);
  if(t === 'МИМО') this.bpChain = 0;
};
bpWrap(L, 'hit', function(){
  this.bpChain++;
  this.bpEcho.push({t:0, k:this.bpChain});
  if(this.bpEcho.length > 6) this.bpEcho.shift();
  if(this.bpChain % 6 === 0){
    slowmo(0.5, 0.12);
    flashScreen(CONFIG.P.gold, .14);
    ring(this.tx, this.ty, CONFIG.P.gold, 40, .45, 1);
    popText(this.tx, this.ty-34, 'ЦЕПЬ x'+this.bpChain, CONFIG.P.gold);
    Snd.fanfare();
  }
});
bpWrap(L, 'update', function(){

   ЧАСТЬ 31 · ТРЕТЬЯ ВОЛНА — графика и детали для сюжетных уровней,

   0 ШИФР      — живая подсветка активного кольца + курсор
   2 ВОСПОМИН. — звёздное поле и падающие звёзды
   3 ЛАБИРИНТ  — дождь и фонарь, идущий за тобой
   4 КОД       — зелёный «терминал» и сканлайн

/* ---------- общее: используем готовое звёздное поле из 18_juice2 ---------- */
/* падающая звезда — изредка, на 1.2 секунды */
function starfall(t){
  const p = (t % 11) / 11;
  if(p > 0.14) return;
  const k = p/0.14;
  const x = W*(0.15 + 0.7*((t*0.37)%1));
  const y = H*0.12 + k*H*0.45;
  const tail = 14 + k*10;
  ctx.globalAlpha = 0.8*(1-k*0.6);
  for(let i=0;i<tail;i++){
    const f = i/tail;
    ctx.fillStyle = i<3 ? '#fff6e8' : 'rgba(201,189,232,'+(0.5*f).toFixed(2)+')';
    ctx.fillRect(Math.round(x - f*10), Math.round(y - f*4), 1, 1);
  }
  ctx.globalAlpha = 1;
}

/* мелкая пыль, кэшируется по размеру экрана */
const APD = [];
function apDust(n){
  const key = Math.round(W)+'x'+Math.round(H);
  if(APD.key === key) return APD.a;
  const R = mulberry32(909);
  const a = [];
  const cnt = n || Math.round(clamp(W*H/3000, 18, 46));
  for(let i=0;i<cnt;i++) a.push({x:R()*W, y:R()*H, b:R(), s:Math.random()<.15?2:1});
  APD.a = a; APD.key = key;
  return a;
}
function drawDust(t, alpha, top, col){
  const a = apDust();
  ctx.fillStyle = col || '#ffe6a8';
  for(const d of a){
    const yy = ((d.y + t*3.2*d.b) % (H+8)) - 4;
    if(yy < (top||0)) continue;
    ctx.globalAlpha = alpha*(0.35 + 0.65*Math.abs(Math.sin(t*0.9 + d.b*11)));
    ctx.fillRect(Math.round(d.x), Math.round(yy), d.s, d.s);
  }
  ctx.globalAlpha = 1;
}
/* дождь для детектива */
function drawRain(t, n, col, alpha){
  ctx.fillStyle = col || '#8fb0e8';
  for(let i=0;i<(n||24);i++){
    const y = ((i*83 + t*230) % (H+20)) - 10;
    const x = ((i*47 + t*26) % (W+20)) - 10;
    ctx.globalAlpha = alpha*(0.5 + 0.5*((i%3)/2));
    ctx.fillRect(Math.round(x), Math.round(y), 1, 3);
  }
  ctx.globalAlpha = 1;
}

(function(){
const R = G.screens.reward; if(!R || !R.draw) return;
const _d = R.draw;
let sparks = [];
R.enter = function(){
  this.t = 0; this.done = false; Snd.fanfare();
  sparks = [];
  for(let i=0;i<26;i++) sparks.push({a:Math.random()*6.28, r:6+Math.random()*30, s:0.6+Math.random()*1.4, p:Math.random()*6.28});
};
R.draw = function(){
  const P = CONFIG.P, t = this.t, cx = W/2, cy = H/2-10;
  // лучи из сердца
  const rays = 12;
  ctx.globalAlpha = 0.10 + 0.05*Math.abs(Math.sin(t*1.6));
  for(let i=0;i<rays;i++){
    const a = i/rays*6.283 + t*0.18;
    const r0 = 22 + 3*Math.sin(t*3 + i), r1 = 46 + 10*Math.sin(t*2 + i*1.3);
    for(let r=r0;r<r1;r+=3){
      const al = 1 - (r-r0)/(r1-r0);
      ctx.globalAlpha = 0.10*al;
      ctx.fillStyle = i%2 ? P.gold : P.pink;
      ctx.fillRect(Math.round(cx+Math.cos(a)*r), Math.round(cy+Math.sin(a)*r*0.8), 2, 2);
    }
  }
  ctx.globalAlpha = 1;
  _d.call(this);
  // искры вокруг сердца
  for(const s of sparks){
    s.p += 1/60*s.s;
    const a = s.a + t*0.7, r = s.r + 6*Math.sin(t*1.4 + s.p);
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r*0.8;
    ctx.globalAlpha = 0.5 + 0.4*Math.sin(t*3 + s.p);
    ctx.fillStyle = s.s > 1.4 ? P.gold : P.pink2;
    ctx.fillRect(Math.round(x)-1, Math.round(y)-1, 2, 2);
    ctx.globalAlpha = 1;
  }
  // печать «ПОЛУЧЕНО»
  if(t > 0.9){
    const k = clamp((t-0.9)/0.35, 0, 1);
    const s2 = lerp(2.2, 1, easeOut(k));
    const ang = -0.18;
    const tw = textW('ПОЛУЧЕНО', s2);
    ctx.save();
    ctx.translate(cx, cy-34); ctx.rotate(ang); ctx.scale(k, k);
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = 'rgba(90,20,50,.5)';
    ctx.fillRect(-tw/2-4, -9, tw+8, 18);
    ctx.globalAlpha = 0.95;
    text('ПОЛУЧЕНО', 0, -3, {sc:s2, align:'center', color:'#ffd6e2'});
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  // имя уровня — мелким шрифтом внизу
  const nm = (G.reward && G.reward.i != null && LEVELS[G.reward.i]) ? LEVELS[G.reward.i].name : '';
  if(nm && t > 1.3){
    ctx.globalAlpha = 0.55;
    text(nm, cx, cy+78, {sc:fitSc(nm, W-20, 1), align:'center', color:P.dim});
    ctx.globalAlpha = 1;
  }
};
})();

   Ретро-цифровой, нежный, атмосферный тон. Тексты Танжара.

/* Длинный абзац режем на короткие реплики — так диалог читается спокойнее
   и всегда влезает в три строки даже на самом узком экране. */
function speak(lines, max){
  max = max || 48;
  const out = [];
  for(const para of lines){
    if(para.length <= max){ out.push(para); continue; }
    let cur = '';
    for(const w of para.split(' ')){
      if(!cur.length) cur = w;
      else if((cur+' '+w).length <= max) cur += ' ' + w;
      else { out.push(cur); cur = w; }
    }
    if(cur) out.push(cur);
  }
  return out.map(t => D('him', t));
}

/* --------------------------------------------------------------------------
   Плавающая плашка с длинным текстом (внизу экрана, сама гаснет)
   -------------------------------------------------------------------------- */
const NOTE2 = {t:'', col:null, left:0, dur:4.4, y:0, screen:''};
function note2(t, col, dur, yTop){
  NOTE2.t = t; NOTE2.col = col || CONFIG.P.gold; NOTE2.left = dur || 4.4; NOTE2.dur = NOTE2.left; NOTE2.y = yTop || 0; NOTE2.screen = G.state;
}
function drawNote2(){
  if(NOTE2.left <= 0 || !NOTE2.t) return;
  if(NOTE2.screen !== G.state) { NOTE2.left = 0; return; }   // плашка живёт только на своём экране
  ctx.save();
  const a = clamp(NOTE2.left*1.6, 0, 1);
  const lines = wrap(NOTE2.t, W-24, 1).slice(0, 4);
  const h = lines.length*11 + 8;
  const y = NOTE2.y || (H - h - 19);
  ctx.globalAlpha = a*0.92;
  ctx.fillStyle = 'rgba(14,8,28,.94)'; ctx.fillRect(6, y, W-12, h);
  ctx.fillStyle = NOTE2.col; ctx.fillRect(6, y, 2, h);
  ctx.fillStyle = 'rgba(107,79,160,.5)'; ctx.fillRect(6, y+h-1, W-12, 1);
  let yy = y+4;
  for(const l of lines){ text(l, W/2, yy, {sc:1, align:'center', color:NOTE2.col}); yy += 11; }
  ctx.globalAlpha = 1;
  ctx.restore();
}
/* подключаем плашку ко всем экранам (таймер тикает прямо в отрисовке) */
for(const _k in G.screens){
  const _s = G.screens[_k];
  if(_k === 'dialog' || _k === 'boot') continue;
  if(_s && _s.draw && !_s.bpNote){
    const _d = _s.draw;
    _s.draw = function(){
      if(NOTE2.left > 0) NOTE2.left -= 1/60;
      _d.call(this);
      drawNote2();
    };
    _s.bpNote = true;
  }
}

const PROGRESS_DESC =
  'Монитор восстановления системы HeartOS. На этой карте отображается путь восстановления наших воспоминаний. Каждая пройденная точка зажигает одно из сердец в реестре. Когда все 8 сердец будут восстановлены, откроется главный файл системы.';
const PROGRESS_STATUS = [
  {when:'0 / 8',  t:'Система ожидает первого шага. Начни с первой иконки.'},
  {when:'в процессе', t:'Фрагменты восстанавливаются. Поток нежности стабилен.'},
  {when:'8 / 8',  t:'Все фрагменты найдены! Доступ к финальному файлу разблокирован.'}
];
const _mapC0 = mapWindowContent;
mapWindowContent = function(win){
  _mapC0.call(this, win);
  const P = CONFIG.P, r = Win.inner(win);
  const n = storyDone();
  const s = n >= CH ? PROGRESS_STATUS[2] : (n === 0 ? PROGRESS_STATUS[0] : PROGRESS_STATUS[1]);
  const lines = wrap(s.t, r.w-12, 1).slice(0, 3);
  const h = lines.length*10 + 6;
  const y = r.y + r.h - h - 4;
  ctx.fillStyle = 'rgba(8,4,18,.86)'; ctx.fillRect(r.x+2, y, r.w-4, h);
  ctx.fillStyle = n >= CH ? P.green : P.dim; ctx.fillRect(r.x+2, y, 2, h);
  let yy = y+3;
  for(const l of lines){ text(l, r.x+7, yy, {sc:1, color: n>=CH ? P.green : '#c9bde8'}); yy += 10; }
  // описание модуля — один раз, внизу карты
  if(!win.data || !win.data.seenDesc){
    win.data = win.data || {};
    win.data.seenDesc = true;
    setTimeout(() => {}, 0);
    note2(PROGRESS_DESC, P.gold, 6.5);
  }
  // подпись выбора
  const pick = (G.sel != null && NODE_META[G.sel]) ? NODE_META[G.sel] : null;
  const line = pick ? 'Каждая точка на этой карте — лишь лишний повод напомнить, как сильно я тебя люблю.'
                     : 'Куда бы ты ни решила отправиться дальше, я буду идти рядом с тобой на каждом шагу.';
  ctx.globalAlpha = .55;
  const capSc = Math.min(1, (r.w-10) / Math.max(1, textW(line, 1)));
  text(line, r.x + r.w/2, y - 12, {sc:capSc, align:'center', color:P.dim});
  ctx.globalAlpha = 1;
};

(function(){

const _k = L.key;
L.key = function(k){
  if(k === 'p' || k === 'P' || k === 'з' || k === 'З'){
    this.bpPause = !this.bpPause;
    Snd.blip();

  _k.call(this, k);
};
const _u2 = L.update;
L.update = function(dt){
  if(this.bpPause) return;
  _u2.call(this, dt);
};
const _d2 = L.draw;

const ACH_ENTER = 'Здесь собраны твои игровые победы, но моё самое главное и лучшее достижение в жизни — это ты.';
function drawAchievements(win){
  const P = CONFIG.P, r = Win.inner(win), d = win.data;
  if(d.introT === undefined) d.introT = 0;
  d.introT = Math.min(1, d.introT + 0.03);
  ctx.fillStyle = '#12091f'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = 'rgba(107,79,160,.20)'; ctx.fillRect(r.x, r.y, r.w, 1);
  // шапка
  const head = ACH_ENTER;
  const hl = wrap(head, r.w-56, 1).slice(0, 2);
  let hy = r.y+4;
  ctx.globalAlpha = d.introT;
  for(const l of hl){ text(l, r.x+6, hy, {sc:1, color:'#c9bde8'}); hy += 10; }
  ctx.globalAlpha = 1;
  const n = ACH.got.size;
  text(n + '/' + ACH_DEF.length, r.x+r.w-6, r.y+4, {sc:1, align:'right', color: n===ACH_DEF.length?P.gold:P.dim});
  const listY = hy + 9;
  ctx.fillStyle = 'rgba(107,79,160,.45)'; ctx.fillRect(r.x+5, listY-3, r.w-10, 1);
  // список: у каждой строки своя высота
  const maxW = r.w - 28;
  const rows = [];
  for(const a of ACH_DEF){
    const has = ACH.got.has(a.id);
    rows.push({t:a.t, has:has, h:13});
    for(const l of wrap(a.d, maxW, 1).slice(0,3)) rows.push({t:l, has:has, sub:true, h:10});
    rows.push({t:'', has:has, gap:true, h:4});
  }
  const viewH = r.y + r.h - 24 - listY;
  d.maxScroll = Math.max(0, rows.length - 1);
  if(d.scroll > d.maxScroll) d.scroll = d.maxScroll;
  if(d.scroll < 0) d.scroll = 0;
  let y = listY;
  for(let i=0;i<rows.length;i++){
    const row = rows[i];
    if(y + row.h > listY + viewH) break;
    if(row.gap){ y += row.h; continue; }
    if(!row.sub){
      heart(r.x+6, y+2, 1, row.has ? P.pink : '#3a2560');
      text(row.t, r.x+14, y, {sc:1, color: row.has ? '#fff6e8' : '#5a4680'});
    } else {
      ctx.globalAlpha = row.has ? 0.6 : 0.32;
      text(row.t, r.x+14, y, {sc:0.85, color: row.has ? '#c9bde8' : '#4a3a70'});
      ctx.globalAlpha = 1;
    }
    y += row.h;
  }
  // полоса прокрутки
  const total = rows.length*10;
  if(rows.length > 1){
    const th = Math.max(10, Math.round(viewH*10*rows.length/total));
    const ty = listY + Math.round(Math.max(0, viewH-th)*(d.scroll/Math.max(1,d.maxScroll)));
    ctx.fillStyle = 'rgba(255,209,102,.45)'; ctx.fillRect(r.x+r.w-4, ty, 2, th);
  }
  const hint = IS_TOUCH ? 'ТАП - ЛИСТАТЬ. ESC - ЗАКРЫТЬ' : 'СТРЕЛКИ - ЛИСТАТЬ. ESC - ЗАКРЫТЬ';
  text(hint, r.x+r.w/2, r.y+r.h-11, {sc:fitSc(hint, r.w-8, 1), align:'center', color:'#6b4fa0'});
}

const _dk0 = G.screens.desktop.key;
G.screens.desktop.key = function(k){

  if(win && win.kind === 'achv' && !win.closing){
    const d = win.data;
    if(k === 'Escape'){ Snd.blip(); Win.close(); return; }
    if(k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter'){ d.scroll = Math.min(d.maxScroll, d.scroll+3); Snd.blip(); return; }
    if(k === 'ArrowUp' || k === 'PageUp'){ d.scroll = Math.max(0, d.scroll-3); Snd.blip(); return; }
    return;
  }
  return _dk0.call(this, k);
};
const _dt0 = G.screens.desktop.tap;
G.screens.desktop.tap = function(x, y){
  const win = G.win;
  if(win && win.kind === 'achv' && !win.closing){
    const d = win.data, r = Win.inner(win);
    if(x > r.x+r.w/2 || y < r.y+r.h*0.6){
      d.scroll = Math.min(d.maxScroll, d.scroll+3); Snd.blip(); return;
    }
    Snd.blip(); Win.close(); return;
  }
  return _dt0.call(this, x, y);
};

const _frame0 = frame;
let _lastT = 0;
frame = function(now){
  const dt = _lastT ? Math.min(.05, (now - _lastT)/1000) : .016;
  _lastT = now;
  _frame0(now);
  // сердечки/конфетти поверх всего кадра
  updateHeartFX(dt);
  drawHeartFX();
  // магия команды love — розовые пиксели и звёздочки поверх всего
  updateLoveFX(dt);
  drawLoveFX();
  // «удар» рамкой
  drawPunch(dt);
  // новые слои: след сердец, экранная шторка
  updateHeartTrail(dt);
  drawHeartTrail();
  updateWipe(dt);
  drawWipe();
};

/* --- авто-качество: если стабильно тормозит — упрощаем эффекты --- */
let _slowT = 0, _frames = 0, _acc = 0, _probeT = 0;
const _origUpdate = G.screens.__probe = null;
(function(){
  const probe = ()=>{
    const n0 = G.__fc || 0;
    setTimeout(()=>{
      const fps = (G.__fc - n0)/2;
      if(fps < 26 && FXQ > .4){ FXQ = .4; } else if(fps > 50 && FXQ < 1){ FXQ = 1; }
    }, 2000);
  };
  const oldFrame = frame;
  frame = function(now){ G.__fc = (G.__fc||0)+1; oldFrame(now); };
  probe(); setInterval(probe, 6000);
})();
