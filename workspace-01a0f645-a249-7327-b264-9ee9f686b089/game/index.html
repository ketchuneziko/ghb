function termLine(win, t, col){ win.data.lines.push({t:t, c:col||'#8ce99a'}); }
function openTerm(fromIcon){
  const w = Math.min(W-10, 246), h = Math.min(H-34, 176);
  const win = Win.open('term', 'CMD — командная строка', {
    w:w, h:h,
    from: fromIcon ? {x:fromIcon.tx-20, y:fromIcon.ty-14, w:40, h:30} : null
  });
  win.data.lines = [];
  win.data.cmd = '';
  win.data.hist = [];
  win.data.hi = 0;
  win.data.matrix = 0;
  win.data.t = 0;
  win.data.prompt = 'C:\\ПИТЕР>';
  const d = new Date();
  win.data.lines.push({t:'HeartOS  v1.0', c:'#ffd166'});
  win.data.lines.push({t:'(C) '+CONFIG.him+' для '+CONFIG.her, c:'#6b4fa0'});
  win.data.lines.push({t:'Набери HELP и нажми Enter.', c:'#a08cc0'});
  win.data.lines.push({t:'', c:'#8ce99a'});
  Snd.type();
  return win;
}
function termPrint(win, t, col){
  // перенос по ширине окна
  const w = win.w - 14;
  for(const l of wrap(t, w, 1)) win.data.lines.push({t:l, c:col||'#8ce99a'});
  while(win.data.lines.length > 40) win.data.lines.shift();
}
function termKey(win, k){
  const d = win.data;
  if(d.matrix > 0) return;
  if(k === 'Enter'){
    const cmd = d.cmd.trim();
    d.hist.push(cmd); d.hi = d.hist.length;
    d.cmd = '';
    termPrint(win, d.prompt+' '+cmd, '#ffd166');
    termExec(win, cmd);
    return;
  }
  if(k === 'Backspace'){ d.cmd = d.cmd.slice(0,-1); Snd.blip(); return; }
  if(k === 'ArrowUp'){ if(d.hi > 0){ d.hi--; d.cmd = d.hist[d.hi]; Snd.blip(); } return; }
  if(k === 'ArrowDown'){ if(d.hi < d.hist.length-1){ d.hi++; d.cmd = d.hist[d.hi]; } else { d.hi = d.hist.length; d.cmd=''; } Snd.blip(); return; }
  if(k === 'Tab'){ d.cmd = 'open '; return; }
  if(k && k.length === 1 && d.cmd.length < 40){ d.cmd += k; Snd.type(); }
}
function termExec(win, raw){
  const d = win.data, P = CONFIG.P;
  const q = raw.trim().toLowerCase();
  if(!q){ return; }
  const files = G.screens.desktop.icons.map(i=>i.name);
  if(q === 'help' || q === 'помощь' || q === '?'){
    termPrint(win, 'Доступные команды: help — справка, hearts — статус сердечек, love — запустить магию.', '#ffd166');
    return;
  }
  if(q === 'ls' || q === 'dir' || q === 'файлы'){
    for(const f of files) termPrint(win, '  '+f, f.endsWith('.exe')?'#8ce99a':'#a08cc0');
    return;
  }
  if(q === 'open' || q === 'запуск' || q === 'старт'){
    const name = (raw.trim().split(/\s+/)[1]||'').toUpperCase();
    const it = G.screens.desktop.icons.find(i=>i.name.toUpperCase() === name);
    if(!it){ termPrint(win, 'Не найдено: '+name, P.red); termPrint(win, 'Список — команда ls', '#a08cc0'); Snd.bad(); return; }
    if(it.kind === 'level'){
      if(G.hearts[it.idx]){ termPrint(win, it.name+': уже пройдено', '#6b4fa0'); return; }
      termPrint(win, 'Запуск '+it.name+'...', P.gold);
      Win.close();
      G.pending = {type:'level', idx:it.idx, t:0};
      Win.open('load','ЗАПУСК '+NODE_META[it.idx].name+'.exe',{w:170,h:56});
    } else {
      termPrint(win, 'Запуск '+it.name+'...', P.gold);
      G.screens.desktop.launch(it, true);
    }
    return;
  }
  if(q === 'hearts' || q === 'сердца'){
    termPrint(win, 'Собрано сердец: '+storyDone()+' / '+CH, storyDone()>=CH?P.gold:P.pink);
    termPrint(win, 'Главная линия: '+G.hearts.slice(0,EP_N).map(h=>h?'+':'-').join(' '), '#8ce99a');
    termPrint(win, 'Бонус: '+arcDone()+' / '+AR_N, '#6b4fa0');
    return;
  }
  if(q === 'whoami'){
    termPrint(win, CONFIG.him, P.pink);
    termPrint(win, 'статус: влюблён, '+(heartsDone()>=NH?'счастлив':'жду письма'), '#a08cc0');
    return;
  }
  if(q === 'date' || q === 'дата'){
    const dd = new Date();
    termPrint(win, dd.toLocaleString('ru-RU'), '#8ce99a');
    return;
  }
  if(q === 'love' || q === 'люблю'){
    termPrint(win, 'Выполнение команды love...', P.pink);
    termPrint(win, 'Предупреждение: уровень нежности зашкаливает! Вокруг экрана рассыпаются розовые пиксельные частицы и мерцающие звёздочки.', '#a08cc0');
    Snd.fanfare(); flashScreen(P.pink, 0.30);
    loveMagic(5.0);
    spawnLove(40);
    return;
  }
  if(q === 'sudo love'){
    termPrint(win, '[sudo] любовь к '+CONFIG.her+': разрешено', P.gold);
    termPrint(win, 'пароль не спрашивали. он и так твой.', '#6b4fa0');
    Snd.coin();
    return;
  }
  if(q === 'matrix'){
    d.matrix = 4.5;
    termPrint(win, 'Wake up, '+CONFIG.her+'...', P.green);
    Snd.slide(220, 900, 1.2, 'sawtooth', 0.08);
    return;
  }
  if(q.indexOf('color') === 0){
    const cols = {pink:P.pink, gold:P.gold, green:'#8ce99a', sky:P.sky, red:P.red, white:P.ink, purple:'#b197fc'};
    const cn = (q.split(/\s+/)[1]||'').replace(/ё/g,'е');
    if(cols[cn]){ win.data.col = cols[cn]; termPrint(win, 'Цвет: '+cn, cols[cn]); }
    else termPrint(win, 'Цвета: pink gold green sky red white purple', P.red);
    return;
  }
  if(q === 'about' || q === 'о программе'){
    termPrint(win, 'HeartOS v1.0', P.gold);
    termPrint(win, '5 эпизодов, 8 сердец, 1 финал,', '#8ce99a');
    termPrint(win, '0 внешних файлов, 0 интернета.', '#8ce99a');
    termPrint(win, 'Сделано с нуля и с любовью.', '#6b4fa0');
    return;
  }
  if(q === 'clear' || q === 'cls' || q === 'очистить'){ d.lines = []; return; }
  if(q === 'exit' || q === 'quit' || q === 'выход'){ Win.close(); return; }
  if(q === 'crt' || q === 'эффекты'){
    G.crt = G.crt ? 0 : 1;
    termPrint(win, 'Эффекты экрана: '+(G.crt?'ВКЛ':'ВЫКЛ'), P.gold);
    return;
  }
  termPrint(win, q+': команда не найдена', P.red);
  termPrint(win, 'Набери help.', '#6b4fa0');
  Snd.bad();
}

/* --- рисование окна-терминала --- */
function drawTerm(win){
  drawWinFrame(win, true);
  const r = Win.inner(win), d = win.data;
  ctx.fillStyle = '#060a12'; ctx.fillRect(r.x, r.y, r.w, r.h);
  // «стеклянные» блики
  ctx.globalAlpha = 0.05; ctx.fillStyle = '#8ce99a';
  ctx.fillRect(r.x, r.y, r.w, 4); ctx.fillRect(r.x, r.y+r.h-4, r.w, 4);
  ctx.globalAlpha = 1;
  if(d.matrix > 0){
    d.t = (d.t||0) + 1;
    const R = mulberry32(Math.floor(d.t*7));
    ctx.fillStyle = 'rgba(140,233,154,.20)';
    for(let i=0;i<18;i++) ctx.fillRect(r.x, r.y+i*2, r.w, 1);
    const chars = '01{} love()print_IO ЯЛЮБЛЮТЕБЯ';
    const col = d.col || '#8ce99a';
    const cols2 = Math.floor(r.w/6);
    for(let c=0;c<cols2;c++){
      const head = ((d.t*3 + c*7) % (r.h + 14)) - 14;
      for(let k=0;k<7;k++){
        const yy = r.y + head - k*8;
        if(yy < r.y || yy > r.y+r.h-10) continue;
        ctx.globalAlpha = 1 - k/7;
        text(chars[Math.floor(R()*chars.length)], r.x+2+c*6, yy, {sc:1, color: k===0?'#e9ffe9':col});
      }
    }
    ctx.globalAlpha = 1;
    d.matrix -= 1/60;
    return;
  }
  const lh = 10, btnH = 14;
  const inputY = r.y + r.h - btnH - 12;            // строка ввода
  const rowsH = inputY - r.y - 2;
  const maxRows = Math.max(1, Math.floor(rowsH/lh));
  const lines = d.lines.slice(-maxRows);
  let y = r.y + 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, rowsH); ctx.clip();
  for(const l of lines){ text(l.t, r.x+3, y, {sc:1, color:l.c}); y += lh; }
  ctx.restore();
  // строка ввода
  const prompt = d.prompt+' ';
  const ptxt = prompt + d.cmd;
  text(ptxt, r.x+3, inputY, {sc:1, color:'#ffd166'});
  ctx.fillStyle = (Math.floor(d.t*2) % 2 === 0) ? '#8ce99a' : '#060a12';
  ctx.fillRect(r.x+3+textW(ptxt,1), inputY-3, 5, 9);
  // быстрые кнопки (чтобы работало и без клавиатуры)
  const qs = [['help',''],['ls',''],['hearts',''],['clear','']];
  let bx = r.x+2, by = r.y+r.h-13;
  ctx.fillStyle = 'rgba(13,8,32,.9)'; ctx.fillRect(r.x+1, by-1, r.w-2, 14);
  for(const q of qs){
    const w = textW(q[0],1)+8;
    drawBtn(bx, by, w, 12, q[0], {color:'#8ce99a'});
    (d.quickR = d.quickR || {})[q[0]] = {x:bx, y:by, w:w, h:12};
    bx += w+3;
  }
  if(d.quickR){
    for(const k in d.quickR) d.quickR[k].t = k;
  }
}

G.screens.title.draw = function(){
  const t = this.t;
  drawWallpaper(t*0.4);

  // появление: панель выезжает и проявляется
  const k = clamp(t*2.2, 0, 1);
  const ease = 1-Math.pow(1-k, 3);
  const py0 = Math.round(H/2 - ph/2 - (1-ease)*10);
  const px0 = Math.round(cx - pw/2);
  ctx.globalAlpha = ease;
  ctx.fillStyle = 'rgba(8,4,18,.45)'; ctx.fillRect(px0+3, py0+4, pw, ph);
  ctx.fillStyle = UI.dark; ctx.fillRect(px0-2, py0-2, pw+4, ph+4);

/* --- русский алфавит для шифров (с Ё) --- */
const ALPH = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
const AL_N = ALPH.length;                       // 33
const aIdx = ch => ALPH.indexOf(ch.toUpperCase());
const aCh  = n => ALPH[((n-1)%AL_N+AL_N)%AL_N]; // 1..33 -> буква

/* --- обёртка: сцена внутри уровня (u_/d_/t_/k_ + имя сцены) --- */
function scenes(lv){
  lv.t = 0; lv.scene = lv.scene || 'start'; lv.sceneT = 0;
  lv.setScene = function(name){
    this.scene = name; this.sceneT = 0;
    if(typeof this['on_'+name] === 'function') this['on_'+name]();
  };
  lv.update = function(dt){
    this.t += dt; this.sceneT += dt;
    if(this.extraUpdate) this.extraUpdate.call(this, dt);   // доп. логика уровня
    const f = this['u_'+this.scene]; if(f) f.call(this, dt);
  };
  lv.draw = function(){
    const f = this['d_'+this.scene]; if(f) f.call(this);
  };
  lv.key = function(k){ const f = this['k_'+this.scene]; if(f) f.call(this, k); };
  lv.tap = function(x,y){ const f = this['t_'+this.scene]; if(f) f.call(this, x, y); };
  return lv;
}

/* --- общий фон эпизодов: тёмное «звёздное» стекло + лёгкая виньетка --- */
function epBg(t, opt){
  opt = opt || {};
  const top = opt.top || '#0b0620', bot = opt.bot || '#1d0f33';

  // редкие пылинки
  ctx.fillStyle = 'rgba(255,246,232,.16)';

}
/** Мягкое свечение-точка (для звёзд/свечей). */
function starAt(x, y, r, col, a){
  ctx.globalAlpha = a;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.globalAlpha = a*0.35;
  ctx.beginPath(); ctx.arc(x, y, r*2.2, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  if(r >= 1.4){
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x-r*2.6), Math.round(y-0.5), Math.round(r*5.2), 1);
    ctx.fillRect(Math.round(x-0.5), Math.round(y-r*2.6), 1, Math.round(r*5.2));
  }
}

/* --- экранная клавиатура из уникальных символов --- */
function makeKeys(chars, opt){
  opt = opt || {};
  const kbW = opt.w || Math.min(W-8, 220);
  const keyH = opt.h || 17;
  const maxCols = Math.max(4, Math.floor(kbW/19));
  const keyW = Math.floor(kbW/maxCols);
  const rowsN = Math.ceil(chars.length/maxCols);
  const kbX = Math.round((W - maxCols*keyW)/2);
  const kbY = (opt.y != null) ? opt.y : (H - 10 - rowsN*(keyH+3));
  return {
    keys: chars.map((ch,i)=>({ch:ch, x:kbX+(i%maxCols)*keyW, y:kbY+Math.floor(i/maxCols)*(keyH+3), w:keyW-2, h:keyH})),
    top: kbY, rows: rowsN, keyW:keyW, keyH:keyH, x:kbX, w:maxCols*keyW
  };
}
function drawKeys(K, hov, label){
  for(const k of K.keys){
    const on = hov && hov.x>k.x && hov.x<k.x+k.w && hov.y>k.y && hov.y<k.y+k.h;
    drawBtn(k.x, k.y, k.w, k.h, label ? (label(k)||k.ch) : k.ch, {press:on});
  }
}
function keyAt(K, x, y){
  for(const k of K.keys) if(x>k.x && x<k.x+k.w && y>k.y && y<k.y+k.h) return k;
  return null;
}

/* --- «лента» шифра: прокручивающаяся алфавитная полоса --- */
function drawStrip(chars, cx, cy, w, h, sel, col){
  ctx.fillStyle = '#1d1136'; ctx.fillRect(cx-w/2, cy-h/2, w, h);
  ctx.fillStyle = '#3a2560'; ctx.fillRect(cx-w/2, cy-h/2, w, 1); ctx.fillRect(cx-w/2, cy+h/2-1, w, 1);
  const step = 9, n = Math.floor(w/step);
  const off = (sel - Math.floor(n/2))*step + Math.sin(0)*0;
  for(let i=0;i<n;i++){
    const ci = sel - Math.floor(n/2) + i;
    const ch = chars[((ci%chars.length)+chars.length)%chars.length];
    const x = cx - w/2 + 2 + i*step;
    const mid = (i === Math.floor(n/2));
    text(ch, x, cy-3, {sc:1, color: mid ? (col||CONFIG.P.gold) : '#a08cd8'});
    if(mid){
      ctx.fillStyle = col || CONFIG.P.gold;
      ctx.fillRect(x-1, cy-h/2+2, 1, 2); ctx.fillRect(x+5, cy-h/2+2, 1, 2);
    }
  }
}

function blitBits(rows, cx, cy, s, col){

/* --- кнопка-стрелка: треугольник рисуем пикселями, а не шрифтом --- */
function dirBtn(x, y, w, h, dir, o){
  o = o || {};
  const r = glassBtn(x, y, w, h, '', o);
  const cx = x + w/2, cy = y + h/2, u = Math.min(9, Math.round(h/2) + 1);
  ctx.fillStyle = o.dis ? '#6b5a8f' : (o.tc || '#fff6e8');
  for(let i=0;i<u;i++){
    const len = u - i;
    let px, py;
    if(dir === 'l'){ px = cx - u/2 + i;     py = cy - len/2; }
    else if(dir === 'r'){ px = cx + u/2 - i - 1; py = cy - len/2; }
    else if(dir === 'u'){ px = cx - len/2;  py = cy - u/2 + i; }
    else { px = cx - len/2; py = cy + u/2 - i - 1; }
    ctx.fillRect(Math.round(px), Math.round(py), 1, len);
  }
  return r;
}

/* --- пиксельные знаки, которых нет в шрифте --- */
function symShape(kind, x, y, col, s){
  const u = s || 7;
  ctx.fillStyle = col;
  if(kind === 'up'){                                  // △
    for(let i=0;i<u;i++){ const w2 = i*2+1; ctx.fillRect(Math.round(x-w2/2), Math.round(y+u/2-i), w2, 1); }
  } else if(kind === 'dn'){                           // ○ (кольцо)
    ctx.fillStyle = col;
    for(let i=0;i<u;i++){
      const w2 = Math.max(1, Math.round(Math.sqrt(Math.max(0, u*u - (i-u/2)*(i-u/2)*4))));
      ctx.fillRect(Math.round(x-w2/2), Math.round(y-u/2+i), w2, 1);
    }
    ctx.fillStyle = '#120a24';
    for(let i=2;i<u-2;i++) ctx.fillRect(Math.round(x-(u-4)/2), Math.round(y-u/2+i), u-4, 1);
  } else {                                            // □
    ctx.fillRect(Math.round(x-u/2), Math.round(y-u/2), u, u);
    ctx.fillStyle = '#120a24';
    ctx.fillRect(Math.round(x-u/2+2), Math.round(y-u/2+2), u-4, u-4);
  }
}
function pxTri(x, y, dir, col, s){                     // стрелка влево/вправо

  for(let i=0;i<u;i++) ctx.fillRect(Math.round(x + dir*(u/2-i) - (dir<0?0:0)), Math.round(y-u/2+i), 1, u-i*2);

function pxCheck(x, y, col){                           // галочка

/* ==========================================================================

   Свечения, стеклянные панели, параллакс, HUD, ударная «juice»
   Всё кэшируется — можно звать каждый кадр
   ========================================================================== */

let FXQ = 1;                              // 1 — всё красиво, 0 — экономно

/* ---------- кэш спрайтов ---------- */
const SPR = {};
function spr(key, w, h, build){
  let s = SPR[key];
  if(s) return s;
  s = document.createElement('canvas');
  s.width = Math.max(1, Math.round(w)); s.height = Math.max(1, Math.round(h));
  const c = s.getContext('2d');
  build(c, s.width, s.height);
  SPR[key] = s;
  return s;
}
function hex2rgb(c){
  c = (c||'#ffffff').replace('#','');
  if(c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  const n = parseInt(c, 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function rgba(c, a){
  const p = hex2rgb(c);
  return 'rgba('+p[0]+','+p[1]+','+p[2]+','+a+')';
}

/* ---------- мягкое свечение-точка ---------- */
function glowSprite(col, r){
  return spr('gl|'+col+'|'+r, r*2+2, r*2+2, (c,w,h)=>{
    const g = c.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
    g.addColorStop(0,   rgba(col, .95));
    g.addColorStop(.28, rgba(col, .45));
    g.addColorStop(.62, rgba(col, .13));
    g.addColorStop(1,   rgba(col, 0));
    c.fillStyle = g; c.fillRect(0,0,w,h);
  });
}
/** Большое мягкое свечение (аддитивно не мешает поверх пиксель-арта) */
function glowAt(x, y, r, col, a){
  if(FXQ < .5 && r > 14) r = 10;
  // не выпускаем свечение за экран — экономим заливку и не ловим «вылеты» в тестах
  if(x - r < 0) r = Math.max(1, x);
  if(y - r < 0) r = Math.max(1, y);
  if(x + r > W) r = Math.max(1, W - x);
  if(y + r > H) r = Math.max(1, H - y);
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.drawImage(glowSprite(col, Math.max(3, Math.round(r))), Math.round(x-r-1), Math.round(y-r-1));
  ctx.globalAlpha = 1;
}
/** Крест-лучи вокруг точки (как у ярких звёзд) */
function starburst(x, y, r, col, a, arms){
  const n = arms || 4;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = col;
  const L = r*2.6;
  for(let i=0;i<n;i++){
    const ang = i*(Math.PI*2/n) + Math.PI/4;
    for(let k=0;k<L;k++){
      const w2 = Math.max(0, 1 - k/r*1.6);
      if(w2 <= 0) break;
      ctx.fillRect(Math.round(x+Math.cos(ang)*k), Math.round(y+Math.sin(ang)*k), Math.max(1,Math.round(w2)), Math.max(1,Math.round(w2)));
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- подгонка текста под ширину ---------- */
/** Подбирает масштаб, чтобы строка влезла в ширину. */
function fitSc(str, maxW, want){
  want = want || 1;
  if(textW(str, want) <= maxW) return want;
  for(const s2 of [.875, .75, .625, .5]) if(textW(str, s2) <= maxW) return s2;
  return .5;
}

/* ---------- стеклянная панель (новый стиль) ---------- */
/**
 * glassPanel(x,y,w,h,{col,a,title,icon,sheen})
 * Полупрозрачная панель с двойной рамкой, уголками и бегущим бликом.
 */
function glassPanel(x, y, w, h, o){
  o = o || {};
  const col = o.col || '#6b4fa0';
  const a = o.a == null ? .82 : o.a;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  // тень
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x+2, y+3, w, h);
  // тело
  ctx.fillStyle = 'rgba(12,7,26,'+a+')'; ctx.fillRect(x, y, w, h);
  // вертикальный градиент внутри
  const g = ctx.createLinearGradient(0, y, 0, y+h);
  g.addColorStop(0, rgba(col, .22));
  g.addColorStop(.5, rgba(col, .07));
  g.addColorStop(1, rgba(col, .015));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  // рамки
  ctx.fillStyle = rgba(col, .85); ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y+h-1, w, 1);
  ctx.fillStyle = rgba(col, .35); ctx.fillRect(x, y, 1, h); ctx.fillRect(x+w-1, y, 1, h);
  // уголки
  const cb = o.cb == null ? 6 : o.cb, cc = o.corner || '#ffd166';
  ctx.fillStyle = cc;
  ctx.fillRect(x, y, cb, 1); ctx.fillRect(x, y, 1, cb);
  ctx.fillRect(x+w-cb, y, cb, 1); ctx.fillRect(x+w-1, y, 1, cb);
  ctx.fillRect(x, y+h-1, cb, 1); ctx.fillRect(x, y+h-cb, 1, cb);
  ctx.fillRect(x+w-cb, y+h-1, cb, 1); ctx.fillRect(x+w-1, y+h-cb, 1, cb);
  // бегущий блик
  if(o.sheen !== false && FXQ > .5){
    const per = 2600 + (o.sheen || 0);
    const k = ((G.t*1000) % per) / per;                 // 0..1
    if(k < .35){
      const sw = 26, sx = x - sw + (w + sw*2) * (k/.35);
      const lg = ctx.createLinearGradient(sx, 0, sx+sw, 0);
      lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(.5, 'rgba(255,255,255,.10)'); lg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = lg; ctx.fillRect(Math.round(sx), y+1, sw, h-2);
    }
  }
  if(o.title){
    const th = 13;
    ctx.fillStyle = rgba(col, .5); ctx.fillRect(x+1, y+1, w-2, th);
    ctx.fillStyle = rgba(col, .95); ctx.fillRect(x+1, y+th, w-2, 1);
    let tx = x+5;
    if(o.icon){ drawIconAt(o.icon, x+8, y+1+Math.round(th/2)-1, 1, '#ffd166'); tx = x+16; }
    text(o.title, tx, y+3, {sc:1, color:'#fff6e8'});
    return {x:x+3, y:y+th+2, w:w-6, h:h-th-4, x0:x, y0:y, w0:w, h0:h};
  }
  return {x:x+3, y:y+3, w:w-6, h:h-6, x0:x, y0:y, w0:w, h0:h};
}

/* ---------- аккуратный длинный текст ---------- */
/** Многострочный текст по центру, максимум n строк. Возвращает высоту. */
function textBlock(t, cx, y, maxW, o){
  o = o || {};

  const lines = wrap(t, maxW, sc).slice(0, o.max || 2);
  lines.forEach((l,i)=>text(l, cx, y + i*(o.lh || 12), {sc:sc, align:'center', color:o.color || '#c9bde8'}));
  return lines.length*(o.lh || 12);

function circleOutline(cx, cy, r, col, wgt){

function circleFill(cx, cy, r, col, a){

/* ---------- кнопка нового стиля ---------- */
function glassBtn(x, y, w, h, label, o){
  o = o || {};

  const col = dis ? '#4a3670' : (o.color || '#6b4fa0');
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x+1, y+2, w, h);
  const g = ctx.createLinearGradient(0, y, 0, y+h);

/** Полоска прогресса с делениями и блеском */
function meterBar(x, y, w, h, v, col, o){

/** Маленькая «таблетка» с подписью */

/* ---------- фоны: параллакс и туманности ---------- */
function nebulaBg(t, o){

/** Три слоя звёзд с параллаксом — «дорогое» небо */
const SKYLAY = [];
function starLayers(t, o){

    const R = mulberry32(o.seed || 11);
    for(let L=0;L<3;L++){
      const n = [46, 26, 12][L], arr = [];
      for(let i=0;i<n;i++) arr.push({x:R()*W, y:R()*H*0.82, r:(1.6-L*.3)*(0.5+R()), p:R()*6.28, k:.25+L*.45});
      SKYLAY.push(arr);

    const sp = (L+1)*.55, arr = SKYLAY[L];
    const col = L===0 ? 'rgba(200,190,230,.5)' : (L===1 ? 'rgba(255,246,232,.75)' : '#fff6e8');
    for(const s of arr){
      const x = ((s.x - t*sp) % (W+20) + W+20) % (W+20) - 10;
      const tw = .55 + .45*Math.sin(t*1.6 + s.p);
      ctx.fillStyle = col; ctx.globalAlpha = tw * (L===0?.5:.9);

/** Пылинки/пыль в воздухе (медленный параллакс) */
let MOTES = null;
function motes(t, n, col, a){

    MOTES = [];

  n = Math.min(n, FXQ > .5 ? MOTES.length : 22);
  for(let i=0;i<n;i++){
    const m = MOTES[i];
    const x = (m.x + Math.sin(t*.35 + m.p)*10 + t*m.w*3) % (W+8) - 4;
    const y = (m.y - t*m.v) % (H+10); const yy = y < -5 ? y + H + 10 : y;
    ctx.globalAlpha = a * (.35 + .35*Math.sin(t*1.3 + m.p));
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(yy), Math.max(1,Math.round(m.r)), Math.max(1,Math.round(m.r)));
  }
  ctx.globalAlpha = 1;
}
/** Дождь/искры со сносом — универсальный «лито» */
function rainFX(t, n, col, spd, slant){
  slant = slant == null ? .25 : slant;
  const R = mulberry32(31);
  for(let i=0;i<n;i++){
    const x0 = R()*W, y0 = R()*H, len = 5 + R()*9, sp = spd*(.6+R()*.9);
    const y = (y0 + t*sp) % (H+12) - 6;
    const x = x0 + y*slant;
    ctx.globalAlpha = .35 + .3*R();
    ctx.fillStyle = col;
    for(let k=0;k<len;k++){
      const px = Math.round(x + k*slant*1.6), py = Math.round(y - k);
      if(px < 0 || px >= W || py < 0 || py >= H) continue;   // не рисуем за краем экрана
      ctx.fillRect(px, py, 1, 1);
    }
  }
  ctx.globalAlpha = 1;
}
/** Световой луч «лазер» между точками */
function beam(x1, y1, x2, y2, col, t, wgt){
  wgt = wgt || 1;
  const n = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
  for(let k=0;k<=n;k++){
    const x = x1 + (x2-x1)*k/n, y = y1 + (y2-y1)*k/n;
    const f = k/n;
    const w2 = Math.max(1, Math.round(wgt * (1 - Math.abs(f-.5)*1.1)));
    ctx.fillStyle = rgba(col, .9 - Math.abs(f-.5)*.5);
    ctx.fillRect(Math.round(x - w2/2), Math.round(y - w2/2), w2, w2);
  }
}
/** Пунктирная линия «по кадрам» (для таймлайнов, досок) */
function dashLine(x1, y1, x2, y2, col, t, dash, wgt){
  dash = dash || 5; wgt = wgt || 1;
  const n = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
  const ph = Math.floor(t*14) % (dash*2);
  for(let k=0;k<=n;k++){
    if(((k + ph) % (dash*2)) >= dash) continue;
    const x = x1 + (x2-x1)*k/n, y = y1 + (y2-y1)*k/n;
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), wgt, wgt);
  }
}

/* ---------- «juice» ---------- */
let PUNCH = 0;
function punch(k){ PUNCH = Math.max(PUNCH, k==null?.06:k); }
/** Световая рамка по краям кадра — «удар» без сдвига координат */
function drawPunch(dt, col){
  if(PUNCH > 0){
    PUNCH = Math.max(0, PUNCH - dt);
    const k = PUNCH/0.07;
    const c = col || '#ffd166';
    ctx.globalAlpha = k*.5;
    const bw = Math.max(2, Math.round(3 + k*7));
    ctx.fillStyle = c;
    ctx.fillRect(0, 0, W, bw); ctx.fillRect(0, H-bw, W, bw);
    ctx.fillRect(0, 0, bw, H); ctx.fillRect(W-bw, 0, bw, H);
    ctx.globalAlpha = k*.18;
    glowAt(W/2, H/2, Math.max(W,H)*.55, c, k*.2);
    ctx.globalAlpha = 1;
  }
}
/** Удар: вспышка + кольцо + тряска + пиксели */
function smash(x, y, col, mag, to){
  impact(x, y, col, mag||5, to||26);
  punch(0.07);
  if(FXQ > .5) for(let i=0;i<10;i++) fx(x, y, 2, col, 70, .5);
}
/** Конфетти/сердечки из точки */
function burstHearts(x, y, n, col){
  for(let i=0;i<(n||8);i++){
    const a = Math.random()*6.28, sp = 20 + Math.random()*45;
    HEARTFX.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 26, t:0, life:.9+Math.random()*.5, col:col||CONFIG.P.pink2, sc:Math.random()<.35?2:1});
  }
}
const HEARTFX = [];
function updateHeartFX(dt){
  for(let i=HEARTFX.length-1;i>=0;i--){
    const p = HEARTFX[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 150*dt; p.vx *= 0.99;
    if(p.t > p.life) HEARTFX.splice(i,1);
  }
}
function drawHeartFX(){
  for(const p of HEARTFX){
    ctx.globalAlpha = clamp(1 - p.t/p.life, 0, 1);
    heart(p.x, p.y, p.sc, p.col);
  }
  ctx.globalAlpha = 1;
}
/** Счётчик, «наезжающий» на число */
function rollNum(cur, target, dt, speed){
  if(cur.n == null){ cur.n = target; }
  const d = target - cur.n;
  if(Math.abs(d) < 0.01){ cur.n = target; return target; }
  cur.n += d * clamp(dt*(speed||4), 0, 1);
  return Math.round(cur.n);
}
/** Печатная машинка (для подсказок/реплик) */
function typed(s, k){ return s.slice(0, Math.floor(k)); }

/* ---------- «маленький» HUD-чип с прогрессом уровня ---------- */
function epProgress(cur, total, x, y, col){
  for(let i=0;i<total;i++){
    const on = i < cur, cn = i === cur-1 && cur < total;
    ctx.fillStyle = on ? (col||CONFIG.P.gold) : 'rgba(58,37,96,.9)';
    ctx.fillRect(x+i*9, y, 7, 7);
    if(on){
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x+i*9, y, 7, 1);
      if(FXQ > .5 && cn){
        ctx.globalAlpha = .4 + .6*Math.abs(Math.sin(G.t*3));
        glowAt(x+i*9+3, y+3, 7, col||CONFIG.P.gold, .3);
        ctx.globalAlpha = 1;
      }
    } else {
      ctx.fillStyle = 'rgba(107,79,160,.5)'; ctx.fillRect(x+i*9+2, y+2, 3, 3);
    }
  }
}

/* ===== ЧАСТЬ: 11_ep1_cipher.js ===== */
/* ==========================================================================
   ЧАСТЬ 11 · ЭПИЗОД 1 — ШИФР
   Сдвинь символы на шаг назад — и прочти послание
   ========================================================================== */

const CIP = {
  clue: 'Сдвинь символы на один шаг назад по алфавиту.',
  enc: 'А МЯВМЯ УЁВА ЕП ВЁТЛОЁШОПТУЙ Й ВЁТЛОЁШОПТТЬ ОЁ РСЁЁМ',
  plain: 'Я ЛЮБЛЮ ТЕБЯ ДО БЕСКОНЕЧНОСТИ И БЕСКОНЕЧНОСТЬ НЕ ПРЕДЕЛ',
  shift: 1
};
/* ВНИМАНИЕ: в enc потерялись две буквы «П» (должно быть ВЁТЛПОЁШОПТУЙ и
   ВЁТЛПОЁШОПТТЬ). Текст enc и plain оставлены ровно как заданы, поэтому
   при правильном сдвиге на экран выводится именно plain. */
const solved = sh => sh === CIP.shift;
/* «живая» расшифровка: сдвиг назад на shift (алфавит с Ё, 0-based) */
function decShift(str, sh){
  const n = ((sh % AL_N) + AL_N) % AL_N;
  return str.split('').map(ch => (ch===' ' || ch==='-') ? ch : ALPH[(aIdx(ch) - n + AL_N) % AL_N]).join('');
}

const EP1 = {
  name:'ШИФР', sub:'сдвинь и прочти', hint:'СТРЕЛКИ — СДВИГ', hintY:false,
  intro:[D('him','Мария, есть вещи, которые я не могу сказать вслух.'),
         D('him','Поэтому я их зашифровал. Сдвинь буквы на шаг назад — и прочтёшь сам.')],
  outro:[D('him','Вот теперь ты знаешь, что я хотел сказать.'),
         D('him','Первое сердце. Одно из восьми.')],
  hearts: 1,
  enter(){
    scenes(this);
    this.sh = 0; this.read = 0; this.ok = false; this.okT = 0; this.t0 = 0;

    }
    motes(t, 22, '#ffd166', .3);
    const good = solved(this.sh);
    const dec = good ? CIP.plain : decShift(CIP.enc, this.sh);
    // HUD
    hudTop({icon:'cipher', title:'ШИФР', col:'#6b4fa0', h:20, right: good ? 'ПРОЧИТАНО' : 'ЗАГАДКА'});
    // подсказка
    text(fitSc(CIP.clue, W-16, 1)===1?CIP.clue:CIP.clue, W/2, 24, {sc:fitSc(CIP.clue, W-16, 1), align:'center', color:'#9b8ac0'});
    // зашифрованный блок

    glassPanel(6, ey, W-12, eh, {col:'#3a2560', title:'ЗАШИФРОВАНО'});
    wrap(CIP.enc, W-30, 1).slice(0,2).forEach((l,i)=>text(l, 11, ey+16+i*10, {sc:1, color:'#8a76b8'}));
    // расшифровка
    const py = ey+eh+6, ph = 56;
    glassPanel(6, py, W-12, ph, {col: good?P.green:'#6b4fa0', title: good?'ПРОЧИТАНО':'РАСШИФРОВКА'});
    const dl = wrap(dec, W-30, 1);
    dl.slice(0,3).forEach((l,i)=>text(l, 11, py+16+i*12, {sc:1, color: good?P.green:'#c9bde8'}));
    if(dl.length > 3) text('...', 11, py+16+3*12, {sc:1, color:'#4a3670'});
    // прогресс совпадения
    let m = 0;
    for(let i=0;i<Math.min(dec.length, CIP.plain.length);i++) if(dec[i]===CIP.plain[i]) m++;
    meterBar(6, py+ph+4, W-12, 5, m/CIP.plain.length, good?P.green:'#6b4fa0');
    // лента алфавита
    const wy = py+ph+18;
    drawStrip(ALPH, W/2, wy+7, Math.min(W-16, 236), 14, Math.round(this.strip), good?P.green:P.gold);
    text('СДВИГ', 6, wy+4, {sc:1, color:'#5a4680'});
    text(String(this.sh), W-6, wy+4, {sc:1, align:'right', color: good?P.green:P.gold});
    // кнопки
    const by = wy+20, bw = Math.floor((W-20)/3);
    this.rM = {x:6, y:by, w:bw, h:16};
    this.rP = {x:6+bw+4, y:by, w:bw, h:16};
    this.rR = {x:6+2*(bw+4), y:by, w:bw, h:16};
    dirBtn(6, by, bw, 16, 'l', {press:this.hovB===0, color:P.sky});
    dirBtn(6+bw+4, by, bw, 16, 'r', {press:this.hovB===1, color:P.sky});
    glassBtn(6+2*(bw+4), by, bw, 16, good?'ПРОЧИТАТЬ':'ЗАГАДКА', {press:this.hovB===2, color: good?P.green:'#5a4680', dis:!good});
    // она за пультом
    const gy = Math.min(H-14, by+52);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(W/2-11, gy+1, 22, 3);
    drawGirl(W/2, gy, CONFIG.cHer, 2, 0);
    textBlock('Она сидит за терминалом и ждёт ключ.', W/2, gy+8, W-20, {color:'#5a4680'});
    vignette(0.5); crtOverlay(t);
  },
  gear(cx, cy, r, rot, teeth){
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.fillStyle = 'rgba(107,79,160,.15)';
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
    for(let i=0;i<teeth;i++){
      const a = i*6.283/teeth;
      ctx.fillRect(Math.round(Math.cos(a)*r)-2, Math.round(Math.sin(a)*r)-2, 4, 4);
    }
    ctx.fillStyle = 'rgba(11,6,24,.5)';
    ctx.beginPath(); ctx.arc(0,0,r*0.35,0,7); ctx.fill();
    ctx.restore();
  },
  u_main(dt){
    this.strip = lerp(this.strip, this.sh, 1-Math.pow(0.001, dt));
    if(this.ok){ this.okT += dt; if(this.okT > 1.2) winLevel(LEVELS.indexOf(this)); }
  },
  k_main(k){
    if(k==='ArrowLeft' || k==='a' || k==='A' || k==='ф' || k==='Ф') this.rot(-1);
    if(k==='ArrowRight'|| k==='d' || k==='D' || k==='в' || k==='В') this.rot(1);
    if(k===' '||k==='Enter') this.readIt();
  },
  rot(d){
    this.sh = ((this.sh + d) % AL_N + AL_N) % AL_N;
    Snd.blip();
    if(solved(this.sh) && !this.ok){
      Snd.coin(); punch(.07);
      popText(W/2, this.roomRect ? 40 : 40, 'ПРОЧИТАНО!', CONFIG.P.green);
    }
  },
  readIt(){
    if(!solved(this.sh) || this.ok){ Snd.bad(); return; }
    this.ok = true; this.okT = 0; Snd.fanfare();
    flashScreen(CONFIG.P.gold, .4);
    for(let i=0;i<14;i++) burstHearts(W/2, H*0.4, 2, CONFIG.P.pink2);
  },
  t_main(x, y){
    this.hovB = -1;
    const on = (r)=> r && x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h;
    if(on(this.rM)){ this.hovB = 0; this.rot(-1); return; }
    if(on(this.rP)){ this.hovB = 1; this.rot(1); return; }
    if(on(this.rR)){ this.hovB = 2; this.readIt(); return; }
  }
};

/* ===== ЧАСТЬ: 12_ep2_rhythm.js ===== */
/* ==========================================================================
   ЧАСТЬ 12 · ЭПИЗОД 2 — РИТМ СЕРДЦА
   Она ловит настоящий такт: «Тук... тук... тук-тук!»
   Жми в момент, когда кольцо сойдётся на сердце.
   ========================================================================== */

const RTH = {
  spb: 0.62,        // длительность доли
  beats: 21,        // три такта по семь долей
  win: 10,          // сколько сильных долей нужно поймать
  misses: 6,        // сколько промахов простить
  good: 0.24,       // окно «в такт» (с запасом на реакцию)
  perfect: 0.10,    // окно «идеально»
  pattern: 'x..x.xx'
};
/* сколько сильных долей во всей игре — их и нужно поймать */
RTH.accentTotal = (function(){
  let n = 0;
  for(let i=1;i<=RTH.beats;i++) if(RTH.pattern[(i-1) % RTH.pattern.length] === 'x') n++;
  return n;
})();

const EP2 = {
  name:'РИТМ СЕРДЦА', sub:'поймай такт', hint:'ПРОБЕЛ В ТАКТ', hintY:false,
  intro:[D('him','Когда ты рядом, у меня в груди всё стучит не по инструкции.'),
         D('him','Поймай этот стук. Жми на сильные доли и не спеши — я подскажу.')],
  outro:[D('him','Попала. Я слышу, как оно стучит — ровно, как сейчас.'),
         D('him','Второе сердце.')],
  hearts: 1,
  enter(){
    scenes(this);
    this.hit = 0; this.beat = 0; this.beatT = 0;
    this.hitT = 0; this.missT = 0; this.ok = false; this.okT = 0;
    this.pulse = 0; this.combo = 0; this.trail = []; this.miss = 0; this.lock = 0;
    this.msg = ''; this.msgT = 0; this.phase = 0; this.pressed = -1;
    this.setScene('play');
  },
  on_play(){ this.hit = 0; this.beat = 0; this.beatT = 0; this.ok = false; this.combo = 0; this.miss = 0; this.lock = 0; this.phase = 0; this.pressed = -1; },
  /* насколько близко к доле: 0 — ровно в такт */
  offBeat(){ const b = this.beatT/RTH.spb; return Math.min(b, 1-b)*RTH.spb; },
  u_play(dt){
    this.t += dt;
    this.pulse = Math.max(0, this.pulse - dt*3);
    if(this.hitT > 0) this.hitT -= dt;
    if(this.missT > 0) this.missT -= dt;
    if(this.msgT > 0) this.msgT -= dt;
    if(this.lock > 0) this.lock -= dt;
    for(let i=this.trail.length-1;i>=0;i--){ this.trail[i].t -= dt; if(this.trail[i].t<=0) this.trail.splice(i,1); }
    if(this.ok){ this.okT += dt; if(this.okT > 1.5) winLevel(LEVELS.indexOf(this)); return; }
    if(this.phase === 2) return;
    this.beatT += dt;
    this.pulse = Math.max(this.pulse, Math.max(0, 1 - this.offBeat()/0.14));
    if(this.beatT >= RTH.spb){
      this.beatT -= RTH.spb;
      this.beat++;
      if(this.beat > RTH.beats){
        if(this.hit >= RTH.win){ this.ok = true; this.okT = 0; Snd.fanfare(); flashScreen(CONFIG.P.gold,.35); punch(.1); }
        else this.fail();
        return;
      }
      this.pulse = 1;
      Snd.note(beatFreq(this.beat), 0.05, 'square', 0.05);
    }
  },
  fail(){ this.phase = 2; this.missT = 2.2; loseLevel('Сбилась с такта. Ещё раз!'); },
  d_play(){
    const P = CONFIG.P, t = this.t;
    ctx.drawImage(bgCache('ep2bg', paint=>{ ditherGradVTo(paint,0,0,W,H,'#2a0f2e','#12061e',14); }), 0, 0);
    if(FXQ > .5){
      ctx.globalAlpha = .07;
      for(let i=0;i<3;i++){
        ctx.fillStyle = ['#ff5d8f','#ffd166','#6bc7ff'][i];
        const bx = W*(0.2+i*0.3) + Math.sin(t*0.5+i)*8;
        for(let y=0;y<H*0.7;y+=3) ctx.fillRect(Math.round(bx-(3+y*0.1)/2 + y*0.1), y, Math.round(3+y*0.1), 3);
      }
      ctx.globalAlpha = 1;
    }
    motes(t, 20, '#ff5d8f', .35);
    // она дирижирует
    drawGirl(W/2, H-34, CONFIG.cHer, 2, this.pulse);
    hudTop({icon:'music', title:'РИТМ СЕРДЦА', col:'#ff5d8f', h:20, right:this.hit+' / '+RTH.win});
    epProgress(this.hit, RTH.win, W/2 - 44, 22, P.pink2);
    // сердце
    const cx = W/2, cy = Math.round(H*0.46);
    const accent = (this.beat>=1 && this.beat<=RTH.beats) ? RTH.pattern[(this.beat-1) % RTH.pattern.length]==='x' : true;
    const sc = Math.max(2, Math.round(6*(1 + this.pulse*0.10)));
    const col = this.hitT>0 ? P.green : (this.missT>0 ? '#5a4680' : (accent ? P.pink : '#6b4fa0'));
    glowAt(cx, cy, 40, col, .18 + this.pulse*.26);
    heart(cx - 4*sc, cy - 3*sc, sc, col);
    // кольцо сходится к сердцу в такт
    if(this.beat >= 1 && this.beat <= RTH.beats){
      const k = clamp(this.beatT/RTH.spb, 0, 1);
      const rr = Math.round(lerp(40, 13, k));
      const near = 1 - clamp(Math.abs(k-1)/0.3, 0, 1);
      circleOutline(cx, cy, rr, near > 0.5 ? P.gold : '#4a3670');
      if(near > 0.5 && FXQ > .5) glowAt(cx, cy, 24, P.gold, .2*near);
    }
    // строка состояния
    let msg = 'ТУК... ТУК... ТУК-ТУК!', mc = '#8a6fbf';
    if(this.ok){ msg = 'ИДЕАЛЬНЫЙ ТАКТ!'; mc = P.green; }
    else if(this.hitT > 0){ msg = this.msg; mc = P.green; }
    else if(this.missT > 0){ msg = this.msg; mc = P.red; }
    else if(this.lock > 0){ msg = 'ДЫШИ... СЛЕДУЮЩИЙ ТАКТ'; mc = '#5a4680'; }
    text(msg, cx, 42, {sc:fitSc(msg, W-20, 1), align:'center', color:mc});
    // метроном: ближайшие доли
    const n = 7, bw2 = 10, gap = 4, x0 = cx - (n*(bw2+gap)-gap)/2, by = Math.round(H*0.58);
    for(let i=0;i<n;i++){
      const idx = (this.beat + i) % RTH.pattern.length;
      const acc = RTH.pattern[idx] === 'x';
      const on = acc, x = x0 + i*(bw2+gap);
      const cur = (i === (RTH.beats - this.beat) % n);
      const hh = on ? 9 : 4;
      ctx.fillStyle = cur ? (on ? P.gold : '#4a3670') : (on ? '#8a2b4a' : '#2a1a44');
      ctx.fillRect(x, by+(9-hh), bw2, hh);
      if(cur && FXQ > .5){
        ctx.globalAlpha = .4;
        ctx.fillRect(x-1, by-1, bw2+2, 11);
        ctx.globalAlpha = 1;
      }
    }
    text('Жми, когда кольцо сойдётся', cx, by+12, {sc:fitSc('Жми, когда кольцо сойдётся', W-20, 1), align:'center', color:'#5a4680'});
    text('Тёмные доли лучше пропустить', cx, by+23, {sc:fitSc('Тёмные доли лучше пропустить', W-20, 1), align:'center', color:'#4a3670'});
    // промахи
    for(let i=0;i<RTH.misses;i++) heart(6+i*10, 26, 1, (RTH.misses-1-i) < this.miss ? '#3a2560' : P.red);
    text('ПРОМАХИ', 6+4*10+4, 26, {sc:1, color:'#5a4680'});
    // следы
    for(const p of this.trail){
      const a = clamp(p.t/0.8, 0, 1);
      ctx.globalAlpha = a;
      popTextAt(p.x, p.y, p.good, p.col);
      ctx.globalAlpha = 1;
    }
    this.rTap = {x:cx-46, y:H-16, w:92, h:14};
    glassBtn(cx-46, H-16, 92, 14, 'ЖМИ В ТАКТ', {press:ptr.x>cx-46&&ptr.x<cx+46&&ptr.y>H-16&&ptr.y<H-2, color:P.pink2});
    vignette(0.5); crtOverlay(t);
  },
  tapNow(){
    if(this.ok || this.phase === 2) return;
    if(this.lock > 0) return;
    if(this.beat < 1 || this.beat > RTH.beats) return;
    if(this.pressed === this.beat) return;    // эта доля уже оценена
    this.pressed = this.beat;
    this.lock = 0.18;                          // короткий откат, чтобы не спамить
    const off = this.offBeat();
    const accent = RTH.pattern[(this.beat-1) % RTH.pattern.length] === 'x';
    const mark = (good, s, col)=>{
      if(good){ this.hit++; this.combo++; this.hitT = .45; this.pulse = 1.4; Snd.coin(); }
      else { this.combo = 0; this.miss++; this.missT = .45; Snd.bad(); if(this.missT) shake(2.5);
             if(this.miss >= RTH.misses){ this.trail.push({x:W/2, y:H*0.42, t:0, good:false, col:col}); this.fail(); return; } }
      this.msg = s; this.msgT = .45;
      this.trail.push({x:W/2, y:H*0.42, t:0, good:good, col:col});
      if(this.trail.length > 4) this.trail.shift();
      if(good && this.combo > 1 && this.combo % 4 === 0) popText(W/2, H*0.34, 'СЕРИЯ x'+this.combo, CONFIG.P.gold);
    };
    if(!accent){ mark(false, 'ЭТО БЫЛА ПАУЗА', CONFIG.P.red); return; }
    if(off <= RTH.perfect){ mark(true, 'ИДЕАЛЬНО!', CONFIG.P.gold); if(FXQ>.5) fx(W/2, H*0.42, 10, CONFIG.P.gold, 70, .5, {shape:'plus'}); }
    else if(off <= RTH.good){ mark(true, 'В ТАКТ!', CONFIG.P.green); }
    else { mark(false, off > RTH.spb*0.45 ? 'РАНО' : 'ПОЗДНО', CONFIG.P.red); }
  },
  k_play(k){ if(k===' '||k==='Enter') this.tapNow(); },
  t_play(x, y){
    if(this.rTap && x>this.rTap.x&&x<this.rTap.x+this.rTap.w&&y>this.rTap.y&&y<this.rTap.y+this.rTap.h){ this.tapNow(); return; }
    if(y > H*0.28) this.tapNow();
  }
};
function beatFreq(i){ return (RTH.pattern[(i-1) % RTH.pattern.length]==='x') ? 880 : 440; }
function popTextAt(x, y, s, col){ text(s, x, y, {sc:1, align:'center', color:col}); }

/* ===== ЧАСТЬ: 13_ep3_memory.js ===== */
/* ==========================================================================
   ЧАСТЬ 13 · ЭПИЗОД 3 — ВОСПОМИНАНИЯ И ЛЮДИ
   Лента времени: три момента, из-за которых мир стал добрее
   ========================================================================== */

const MEM = {
  t: 26,             // на одно воспоминание
  places: [
    {id:'da',   t:'ПЕРВАЯ ВСТРЕЧА',  d:'Мы познакомились в Дайвинчике — кто же знал, что именно там я найду любовь всей своей жизни!', c:'#ffd166'},
    {id:'call', t:'РАЗГОВОРЫ ПО ТЕЛЕФОНУ', d:'разговоры по телефону это самые лучшие моменты дня для меня именно там я нахожу свое счастье(тебя)', c:'#6bc7ff'},
    {id:'night',t:'РАЗГОВОРЫ ДО ЗОРИ', d:'Разговоры до зори: я люблю каждую бессоную ночь с тобой это лучший способ провести время', c:'#ff8787'}
  ]
};

const EP3 = {
  name:'ВОСПОМИНАНИЯ', sub:'три момента', hint:'ИДИ ПО ЛЕНТЕ ВРЕМЕНИ', hintY:false,
  intro:[D('him','Тут три момента, которые я запомнил навсегда.'),
         D('him','Останови каждый на полосе и прочитай, что он мне значит.')],
  outro:[D('him','Вот ради этих трёх минут я и старался.'),
         D('him','Третье и четвёртое сердца — наши.')],
  hearts: 2,
  enter(){
    scenes(this);
    this.stop = 0; this.seen = [false,false,false]; this.ok = false; this.okT = 0;
    this.walk = 0; this.left = MEM.t; this.setScene('main');
  },
  on_main(){ this.stop = 0; this.ok = false; this.seen = [false,false,false]; this.walk = 0; this.left = MEM.t; },
  lane(){ return {x: 24, y: Math.round(H - 58), w: W-48}; },
  u_main(dt){
    this.walk = lerp(this.walk, this.stop, 1-Math.pow(0.001, dt));
    if(this.ok){ this.okT += dt; if(this.okT > 1.3) winLevel(LEVELS.indexOf(this)); return; }
    if(!this.seen[this.stop]){
      this.left -= dt;
      if(this.left <= 0){ this.left = 0; loseLevel('Воспоминание погасло... Скорее вспоминай!'); }
    }
  },
  d_main(){
    const P = CONFIG.P, t = this.t, L = this.lane();
    // фон
    ctx.drawImage(bgCache('ep3bg', paint=>{ ditherGradVTo(paint,0,0,W,H,'#1a0b2e','#3a1338',14); }), 0, 0);
    nebulaBg(t, {c1:'#5a1f4a', c2:'#2b1c5e', c3:'#1b3a6b', seed: 4});
    motes(t, 24, '#ffd166', .3);
    hudTop({icon:'stars', title:'ЛЕНТА ВРЕМЕНИ', col:'#b197fc', h:20, right:this.seen.filter(Boolean).length+' / 3'});
    textBlock('Она идёт по ленте. Каждый шаг — воспоминание.', W/2, 24, W-20, {color:'#9b8ac0'});
    // карточка воспоминания
    const m = MEM.places[this.stop];
    const px0 = 6, pw = W-12, py = 38, ph = L.y - py - 18;
    glassPanel(px0, py, pw, ph, {col: m.c, title: m.t});
    wrap(m.d, pw-14, 1).forEach((l,i)=>text(l, px0+7, py+18+i*12, {sc:1, color:'#fff6e8'}));
    if(this.seen[this.stop]){
      const a = .5+.5*Math.abs(Math.sin(t*3));
      ctx.globalAlpha = a;
      text('ПРОЙДЕНО ♥', W/2, py+ph-14, {sc:1, align:'center', color:m.c});
      ctx.globalAlpha = 1;
    } else {
      const k = clamp(this.left/MEM.t, 0, 1);
      const bw2 = pw-14;
      ctx.fillStyle = 'rgba(18,10,36,.6)'; ctx.fillRect(px0+7, py+ph-10, bw2, 4);
      ctx.fillStyle = k < .3 ? P.red : (k < .6 ? CONFIG.P.gold : '#8ce99a');
      ctx.fillRect(px0+7, py+ph-10, Math.round(bw2*k), 4);
      text('НЕ ЗАБЫВАЙ, ОСТАЛОСЬ '+Math.ceil(this.left)+'с', px0+7, py+ph-21, {sc:1, color: k<.3?P.red:'#8f82b8'});
    }
    // дорожка
    ctx.fillStyle = 'rgba(255,246,232,.12)'; ctx.fillRect(L.x, L.y+3, L.w, 2);
    for(let i=0;i<MEM.places.length;i++){
      const x = L.x + (i+0.5)*(L.w/3);
      const seen = this.seen[i], cur = this.stop === i;
      const col = seen ? MEM.places[i].c : '#4a3670';
      if(cur && FXQ > .5) glowAt(x, L.y+3, 18, col, .3);
      ctx.fillStyle = col; ctx.fillRect(x-5, L.y-2, 10, 10);
      ctx.fillStyle = seen ? '#120a24' : 'rgba(18,10,36,.6)';
      ctx.fillRect(x-3, L.y, 6, 6);
      text(String(i+1), x, L.y+1, {sc:1, align:'center', color: seen ? '#120a24' : '#8f82b8'});
    }
    // она идёт
    const gx = L.x + (this.walk + 0.5)*(L.w/3);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(gx-8, L.y+4, 16, 2);
    drawGirl(gx, L.y+2, CONFIG.cHer, 2, 0);
    // кнопки
    const by = H-16, tw = Math.floor((W-16)/3);
    this.rPrev = {x:6, y:by, w:tw, h:14};
    this.rGo = {x:6+tw+4, y:by, w:tw, h:14};
    this.rNext = {x:6+2*(tw+4), y:by, w:tw, h:14};
    const last = this.stop === MEM.places.length-1;
    dirBtn(6, by, tw, 14, 'l', {press:this.hovB===0, color:UI.text, dis:this.stop===0});
    text('НАЗАД', 6+tw/2+6, by+3, {sc:1, align:'center', color:this.stop===0?'#6b5a8f':'#fff6e8'});
    glassBtn(this.rGo.x, by, tw, 14, 'ЗАПОМНИТЬ', {press:this.hovB===1, color:this.seen[this.stop]?'#5a4680':m.c, dis:this.seen[this.stop]});
    glassBtn(this.rNext.x, by, tw, 14, last?'ЗАВЕРШИТЬ':'ДАЛЬШЕ', {press:this.hovB===2, color: this.seen.every(Boolean)?P.green:'#5a4680', dis:!last && !this.seen[this.stop]});
    vignette(0.5); crtOverlay(t);
  },
  memNext(){
    if(this.seen[this.stop]) return;
    this.seen[this.stop] = true;
    Snd.coin(); punch(.06);
    for(let i=0;i<6;i++) burstHearts(W/2, H*0.5, 1, MEM.places[this.stop].c);
  },
  goTo(i){
    if(i === this.stop) return;
    if(!this.seen[i]){ Snd.bad(); shake(2); popText(W/2, H*0.52, 'СНАЧАЛА ЗАПОМНИ ЭТО', CONFIG.P.red); return; }
    this.stop = i; this.left = MEM.t; Snd.blip();
  },
  k_main(k){
    if(k==='ArrowLeft'){ this.goTo(Math.max(0, this.stop-1)); }
    if(k==='ArrowRight'){ this.goTo(Math.min(MEM.places.length-1, this.stop+1)); }
    if(k===' '||k==='Enter'){
      if(!this.seen[this.stop]) this.memNext();
      else if(this.stop < MEM.places.length-1){ this.stop++; this.left = MEM.t; Snd.blip(); }
      else { this.ok = true; this.okT = 0; Snd.fanfare(); flashScreen(CONFIG.P.gold,.35); }
    }
  },
  t_main(x, y){
    this.hovB = -1;
    const on = r => r && x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h;
    if(on(this.rPrev)){ this.hovB=0; this.k_main('ArrowLeft'); return; }
    if(on(this.rGo)){ this.hovB=1; this.memNext(); return; }
    if(on(this.rNext)){ this.hovB=2; this.k_main(' '); return; }
    // тап по дорожке
    const L = this.lane();
    if(y > L.y-14 && y < L.y+18 && x > L.x && x < L.x+L.w){
      const i = clamp(Math.floor((x - L.x)/(L.w/3)), 0, MEM.places.length-1);
      if(i !== this.stop) this.goTo(i);
    }
  }
};

/* ===== ЧАСТЬ: 14_ep4_maze.js ===== */
/* ==========================================================================
   ЧАСТЬ 14 · ЭПИЗОД 4 — ЛАБИРИНТ И ДОЖДЬ
   Проведи её через холодный город к тёплому огоньку. Зонт не отпускай.
   ========================================================================== */

const MAZ = {
  cols: 11, rows: 9,          // клетки
  hint: 'Возьми зонт и не отпускай меня!'
};

const EP4 = {
  name:'ЛАБИРИНТ И ДОЖДЬ', sub:'дойди до огонька', hint:'СТРЕЛКИ — ИДТИ', hintY:false,
  intro:[D('him','Тут холодно, дождь и куча тупиков.'),
         D('him','Но в конце я оставил костёр. Иди по стрелкам и не стой на месте.')],
  outro:[D('him','Ты дошла. Я видел, как ты шла.'),
         D('him','Пятое и шестое сердца — наши.')],
  hearts: 2,
  enter(){
    scenes(this);
    const R = mulberry32(17062026);
    const C = MAZ.cols, Rr = MAZ.rows;
    this.walls = [];
    for(let r=0;r<Rr;r++){ this.walls[r]=[]; for(let c=0;c<C;c++) this.walls[r][c] = (c===0||r===0||c===C-1||r===Rr-1) ? 1 : 0; }
    // карта: ковровое покрытие — 15% стен внутри
    for(let r=1;r<Rr-1;r++) for(let c=1;c<C-1;c++) if(R() < 0.17) this.walls[r][c] = 1;
    // лужи (медленные клетки)
    this.puddles = [];
    for(let r=1;r<Rr-1;r++) for(let c=1;c<C-1;c++) if(!this.walls[r][c] && R() < 0.10) this.puddles.push({r:r,c:c});
    // гарантированный проход: старт -> вдоль верхнего ряда -> вниз -> к огоньку
    for(let c=1;c<C-1;c++) this.walls[1][c] = 0;
    for(let r=1;r<Rr-1;r++) this.walls[r][C-2] = 0;
    this.cx = 1; this.cy = 1; this.gx = 1; this.gy = 1;
    this.warm = {r:Rr-2, c:C-2};
    for(let c=C-2;c>=this.warm.c;c--) this.walls[Rr-2][c] = 0;
    this.t = 0; this.ok = false; this.okT = 0; this.slow = 0; this.steps = 0;
    this.limit = this.shortest()*2 + 14;      // лимит шагов по карте
    this.setScene('play');
  },
  on_play(){ this.ok = false; },
  /* сколько шагов от старта до огонька по стенам (волновой поиск) */
  shortest(){
    const C = MAZ.cols, R = MAZ.rows, q = [[1,1,0]], seen = {};
    seen['1,1'] = 1;
    while(q.length){
      const [r,c,d] = q.shift();
      if(r === this.warm.r && c === this.warm.c) return d;
      for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
        const nr = r+dr, nc = c+dc, k = nr+','+nc;
        if(nr<0||nc<0||nr>=R||nc>=C || seen[k] || this.walls[nr][nc]) continue;
        seen[k] = 1; q.push([nr,nc,d+1]);
      }
    }
    return 30;
  },
  cell(){
    const aw = W-10, ah = H-116;
    return Math.max(8, Math.min(26, Math.floor(Math.min(aw/MAZ.cols, ah/MAZ.rows))));
  },
  grid(){
    const s = this.cell(), gh = s*MAZ.rows;
    return {s:s, x:Math.round((W - s*MAZ.cols)/2), y:Math.max(38, Math.round((H - 74 - gh)/2))};
  },
  u_play(dt){
    this.t += dt;
    if(this.slow > 0) this.slow -= dt;
    if(this.ok){ this.okT += dt; if(this.okT > 1.5) winLevel(LEVELS.indexOf(this)); return; }
    if(this.steps > this.limit) loseLevel('Заблудилась в дожде... Он всё ещё ждёт у огонька.');
  },
  d_play(){
    const P = CONFIG.P, t = this.t, G2 = this.grid(), s = G2.s;
    // фон: дождливый город
    ctx.drawImage(bgCache('ep4bg', paint=>{ ditherGradVTo(paint,0,0,W,H,'#0b1024','#1d2440',14); }), 0, 0);
    if(FXQ > .5){
      rainFX(t, 40, '#8ca0c8', 190, .22);
      rainFX(t, 18, '#c9d8ff', 240, .28);
    }
    hudTop({icon:'maze', title:'ЛАБИРИНТ И ДОЖДЬ', col:'#5a4680', h:20, right:this.steps+' / '+this.limit});
    textBlock(MAZ.hint, W/2, 28, W-16, {color:'#9b8ac0'});
    const left = this.limit - this.steps;
    if(left < 14) text('ОСТАЛОСЬ '+Math.max(0,left)+' ШАГОВ', W/2, G2.y-10, {sc:1, align:'center', color:CONFIG.P.red});
    // сетка
    for(let r=0;r<MAZ.rows;r++) for(let c=0;c<MAZ.cols;c++){
      const x = G2.x + c*s, y = G2.y + r*s;
      const wall = this.walls[r][c];
      const pud = !wall && this.puddles.some(p=>p.r===r&&p.c===c);
      if(wall){
        ctx.fillStyle = '#39406b'; ctx.fillRect(x, y, s, s);
        ctx.fillStyle = '#4d5590'; ctx.fillRect(x, y, s, 2);
        ctx.fillStyle = '#232a4d'; ctx.fillRect(x, y+s-2, s, 2);
        ctx.fillStyle = 'rgba(140,160,200,.20)'; ctx.fillRect(x, y, 1, s);
      } else {
        ctx.fillStyle = pud ? '#1b3a5e' : '#0e1526';
        ctx.fillRect(x, y, s, s);
        if(pud){
          const a = .35 + .25*Math.sin(t*2 + c + r);
          ctx.fillStyle = 'rgba(140,200,255,'+a.toFixed(2)+')';
          ctx.fillRect(x+2, y+2, s-4, 1); ctx.fillRect(x+2, y+s-4, s-4, 1);
        }
      }
      ctx.fillStyle = 'rgba(107,79,160,.28)';
      ctx.fillRect(x, y, s, 1); ctx.fillRect(x, y, 1, s);
    }
    // огонёк
    const wx = G2.x + this.warm.c*s + s/2, wy = G2.y + this.warm.r*s + s/2;
    if(FXQ > .5) glowAt(wx, wy, 26, '#ffd166', .3 + .12*Math.sin(t*3));
    ctx.fillStyle = '#ffd166';
    for(let i=0;i<5;i++){ const w2 = 7-i; ctx.fillRect(Math.round(wx-w2/2), Math.round(wy-4-i), w2, 1); }
    // она
    const px = G2.x + this.cx*s + s/2, py = G2.y + this.cy*s + s;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(px-7, py-2, 14, 2);
    drawGirl(px, py, CONFIG.cHer, 1.6, this.slow > 0 ? 0.5 : 0);
    if(this.slow > 0){
      ctx.globalAlpha = .5;
      text('СКОЛЬЗКО', px, py-16, {sc:1, align:'center', color:'#6bc7ff'});
      ctx.globalAlpha = 1;
    }
    vignette(0.6); crtOverlay(t);
    // кнопки направления (после виньетки — чтобы стрелки не гасли)
    this.rArrows = [
      {x:6,          y:H-16, w:34, h:14, d:[-1,0]},
      {x:W-40,       y:H-16, w:34, h:14, d:[ 1,0]},
      {x:W/2-17,     y:H-16, w:34, h:14, d:[0, 1]},
      {x:W/2-17,     y:H-32, w:34, h:14, d:[0,-1]}
    ];
    dirBtn(6, H-16, 34, 14, 'l', {color:P.sky});
    dirBtn(W-40, H-16, 34, 14, 'r', {color:P.sky});
    dirBtn(W/2-17, H-16, 34, 14, 'd', {color:P.sky});
    dirBtn(W/2-17, H-32, 34, 14, 'u', {color:P.sky});
    textBlock('СТРЕЛКИ ИЛИ ПАЛЬЦЕМ ПО КАРТЕ', W/2, G2.y+G2.s*MAZ.rows+10, W-16, {color:'#7a68a0'});
  },
  mv(dx, dy){
    const nx = this.cx+dx, ny = this.cy+dy;
    if(ny<0||nx<0||ny>=MAZ.rows||nx>=MAZ.cols) return;
    if(this.walls[ny][nx]){ Snd.bad(); shake(1.5); return; }
    this.cx = nx; this.cy = ny; this.steps++;
    if(this.puddles.some(p=>p.r===ny&&p.c===nx)){ this.slow = 0.6; Snd.bad(); }
    else Snd.blip();
    if(ny===this.warm.r && nx===this.warm.c && !this.ok){
      this.ok = true; this.okT = 0; Snd.fanfare();
      flashScreen('#ffd166', .45); punch(.1);
      for(let i=0;i<12;i++) burstHearts(wx0(this), wy0(this), 2, CONFIG.P.gold);
    }
  },
  k_play(k){
    if(k==='ArrowLeft') this.mv(-1,0);
    if(k==='ArrowRight') this.mv(1,0);
    if(k==='ArrowUp') this.mv(0,-1);
    if(k==='ArrowDown') this.mv(0,1);
    if(k==='a'||k==='A'||k==='ф'||k==='Ф') this.mv(-1,0);
    if(k==='d'||k==='D'||k==='в'||k==='В') this.mv(1,0);
    if(k==='w'||k==='W'||k==='ц'||k==='Ц') this.mv(0,-1);
    if(k==='s'||k==='S'||k==='ы'||k==='Ы') this.mv(0,1);
  },
  t_play(x, y){
    for(const r of this.rArrows)
      if(x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h){ this.mv(r.d[0], r.d[1]); return; }
    // свайп по самой карте
    const G2 = this.grid(), s = G2.s;
    if(x>=G2.x && x<G2.x+G2.s*MAZ.cols && y>=G2.y && y<G2.y+G2.s*MAZ.rows){
      const tc = Math.floor((x-G2.x)/s), tr = Math.floor((y-G2.y)/s);
      const dc = tc - this.cx, dr = tr - this.cy;
      if(Math.abs(dc) >= Math.abs(dr)) this.mv(Math.sign(dc), 0);
      else this.mv(0, Math.sign(dr));
    }
  }
};
function wx0(L){ const G2 = L.grid(); return G2.x + L.warm.c*G2.s + G2.s/2; }
function wy0(L){ const G2 = L.grid(); return G2.y + L.warm.r*G2.s + G2.s/2; }

    if(this.pick < 0) return;

    if(!tsk) return;
    if(this.pick === tsk.ok){
      this.done[this.step] = true; this.pick = -1; Snd.coin();

  },

    if(k==='ArrowLeft'){ this.pick = clamp((this.pick<0?-1:this.pick)-1, -1, 2); Snd.blip(); }
    if(k==='ArrowRight'){ this.pick = clamp((this.pick<0?0:this.pick)+1, -1, 2); Snd.blip(); }
    if(k===' '||k==='Enter') this.apply();
    if(k==='Tab'){ this.step = Math.min(2, this.step+1); Snd.blip(); }
  },
  t_play(x, y){
    this.hovB = -1;
    for(const r of (this.optRects||[])) if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h){ this.pick = r.i; Snd.blip(); return; }

    }
  }
};

/* безопасный текст: убираем символы, которых нет в шрифте */
function safeLine(s){
  let o = '';
  for(const ch of s){
    if(ch === ' ') o += ' ';
    else if(ch === '—' || ch === '–') o += '-';
    else if(F.g[ch] || F.g[ch.toUpperCase()]) o += ch.toUpperCase();
    else o += '';
  }
  return o;
}

   Розовые пиксельные частицы и мерцающие звёздочки поверх всего экрана.
   ========================================================================== */

const LOVEFX = [];
let LOVE_T = 0;

/** запускает магию на dur секунд */
function loveMagic(dur){
  LOVE_T = dur || 4.5;
  LOVEFX.length = 0;
}
function spawnLove(n){
  for(let i=0;i<n;i++){
    // из краёв экрана внутрь
    const side = rndi(0, 4);
    let x, y, ang;
    if(side === 0){ x = rnd(-4, W+4); y = -4; ang = Math.PI/2; }
    else if(side === 1){ x = W+4; y = rnd(0, H); ang = Math.PI; }
    else if(side === 2){ x = rnd(0, W); y = H+4; ang = -Math.PI/2; }
    else { x = -4; y = rnd(0, H); ang = 0; }
    const star = Math.random() < 0.3;
    const sp = rnd(20, 60);
    LOVEFX.push({
      x:x, y:y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      t:0, life: rnd(2.2, 4.6), star: star,
      col: star ? (Math.random()<.5 ? CONFIG.P.gold : '#fff6e8') : (Math.random()<.5 ? CONFIG.P.pink : CONFIG.P.pink2),
      ph: rnd(0, 6.283), sc: rndi(1, 2)
    });
  }
}
function updateLoveFX(dt){
  if(LOVE_T > 0){
    LOVE_T -= dt;
    if(Math.random() < dt*26) spawnLove(3);
    if(LOVE_T <= 0) LOVEFX.length = 0;
  }
  for(let i=LOVEFX.length-1;i>=0;i--){
    const p = LOVEFX[i];
    p.t += dt; p.ph += dt*6;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.995; p.vy = p.vy*0.995 - 6*dt;
    if(p.t > p.life) LOVEFX.splice(i,1);
  }
}
function drawLoveFX(){
  if(!LOVEFX.length) return;
  for(const p of LOVEFX){
    const k = p.t/p.life;
    let a = clamp(1 - k*k, 0, 1);
    if(p.star) a *= 0.35 + 0.65*Math.abs(Math.sin(p.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    if(p.star){
      const s = p.sc+1, x = Math.round(p.x), y = Math.round(p.y);
      ctx.fillRect(x-2, y, 5, 1); ctx.fillRect(x, y-2, 1, 5);
      ctx.fillRect(x-1, y-1, 3, 3);
    } else {
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sc, p.sc);
    }
  }
  ctx.globalAlpha = 1;
}

function cardInfo(){

    name: meta.short || meta.name || lv.name || '',

                     : (EP_ICON_NAMES[G.level] || 'heart');

/* --------------------------------------------------------------------------
   2 · КАРТА: бегущая дорожка между узлами + пульс «следующего» узла
   -------------------------------------------------------------------------- */
const _mapCore0 = mapCore;
mapCore = function(x, y, w, h, tab, t, sel){
  const out = _mapCore0(x, y, w, h, tab, t, sel);
  const ns = out.nodes;
  if(!ns || ns.length < 2) return out;
  const P = CONFIG.P;
  // пунктирная дорожка между соседними узлами (бежит)
  for(let i=0;i<ns.length-1;i++){
    const a = ns[i], b = ns[i+1];
    const steps = Math.max(2, Math.round(Math.hypot(b.x-a.x, b.y-a.y)/5));
    for(let s=0;s<=steps;s++){
      const k = s/steps;
      const px = Math.round(lerp(a.x, b.x, k)), py = Math.round(lerp(a.y, b.y, k));
      if(Math.random() >= .5) continue;
      const ph = (t*2.4 - k*2) % 3;
      const al = ph > 0 && ph < 1 ? .55 : .12;
      ctx.globalAlpha = al;
      ctx.fillStyle = '#6b4fa0';
      ctx.fillRect(px, py, 1, 1);
    }
  }
  ctx.globalAlpha = 1;
  // пульс на следующем доступном узле
  const nx = nextPlayable(tab);
  if(nx != null){
    const n = ns.find(v => v.i === nx);
    if(n){
      const a = .5 + .5*Math.abs(Math.sin(t*3.2));
      ctx.globalAlpha = a*.5;
      ringPix(n.x, n.y, n.r + 3 + Math.round(a*3), P.gold, 1);
      ctx.globalAlpha = 1;
      // маленькая стрелка «сюда»
      const by = n.y - n.r - 6 - Math.round(a*2);
      ctx.fillStyle = P.gold;
      ctx.fillRect(n.x-1, by, 3, 1);
      ctx.fillRect(n.x-2, by+1, 5, 1);
      ctx.fillRect(n.x-3, by+2, 7, 1);
    }
  }
  return out;
};
/** какой узел на этой вкладке можно пройти следующим */
function nextPlayable(tab){
  if(tab === 1){
    for(let i=EP_N;i<EP_N+AR_N;i++) if(!G.hearts[i]) return i;
    return null;
  }
  for(let i=0;i<EP_N;i++) if(!G.hearts[i]) return i;
  if(finaleReady()) return FINALE_NODE;
  return null;
}

/* --------------------------------------------------------------------------
   1 · ЛЕПЕСТКИ-СЕРДЕЧКИ, летящие перед камерой (воздух на улице)
   -------------------------------------------------------------------------- */
const PETALS = [];
function initPetals(n){
  PETALS.length = 0;
  for(let i=0;i<(n||14);i++) PETALS.push(newPetal(true));
}
function newPetal(anywhere){
  return {
    x: rnd(-8, W+8), y: anywhere ? rnd(-6, H) : -6,
    vy: rnd(6, 20), vx: rnd(-9, 9),
    sc: Math.random()<.25 ? 2 : 1,
    a: rnd(.15, .5), sw: rnd(0, 6.283), sp: rnd(.6, 1.6),
    col: Math.random()<.3 ? CONFIG.P.gold : CONFIG.P.pink2
  };
}
function updatePetals(dt, t, wind){
  if(Math.random() < dt*1.6) PETALS.push(newPetal(false));
  for(let i=PETALS.length-1;i>=0;i--){
    const p = PETALS[i];
    p.y += p.vy*dt;
    p.x += (p.vx + Math.sin(t*p.sp + p.sw)*8 + (wind||0)*0.25)*dt;
    if(p.y > H+6 || p.x < -12 || p.x > W+12) PETALS.splice(i,1);
  }
}
function drawPetals(t){
  for(const p of PETALS){
    ctx.globalAlpha = p.a * (.65 + .35*Math.abs(Math.sin(t*p.sp + p.sw)));
    heart(Math.round(p.x), Math.round(p.y), p.sc, p.col);
  }
  ctx.globalAlpha = 1;
}
/** уровни, где «снаружи» — включаем воздух и погоду */
const AMBIENT_LV = { 5:true, 6:true, 7:true, 8:true, 10:true, 12:true };

/* --------------------------------------------------------------------------
   2 · МОКРЫЙ ГОРОД: силуэт домов, окна, туман (для уровня с зонтом)
   -------------------------------------------------------------------------- */
const CITY = null;
function buildCity(){
  if(CITY) return CITY;
  const cols = [], R = mulberry32(11);
  let x = -4;
  while(x < W + 8){
    const w = Math.round(rnd(16, 30, R)), h = Math.round(rnd(26, 74, R));
    const wins = [];
    for(let wy=4; wy<h-4; wy+=7){
      for(let wx=3; wx<w-3; wx+=6){
        if(R() < .45) wins.push({x:wx, y:wy, on: R() < .55, ph: R()*6.283});
      }
    }
    cols.push({x:x, w:w, h:h, wins:wins});
    x += w + 1;
  }
  return (buildCity.c = cols);
}
function rnd(a, b, R){ return a + (R ? R() : Math.random())*(b-a); }
function drawCity(t, baseY, dim){
  const cols = buildCity.c || buildCity();
  for(const b of cols){

   ЧАСТЬ 18 · РАСШИРЕНИЕ «СОЧНОСТИ»
   Новые easing-функции, безопасные круги, составные эффекты,

/* ---------- easing ---------- */
const eOut    = t => 1 - Math.pow(1-clamp(t,0,1), 3);
const eIn     = t => Math.pow(clamp(t,0,1), 3);
const eInOut  = t => { t = clamp(t,0,1); return t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; };
const eBack   = t => { t = clamp(t,0,1); const c = 1.75; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const eElastic= t => { t = clamp(t,0,1); if(t===0||t===1) return t;
  return Math.pow(2,-9*t)*Math.sin((t*10-0.75)*(2*Math.PI/3))+1; };
/** кадронезависимое приближение a к b */
const approach = (a, b, k, dt) => a + (b-a)*(1 - Math.pow(k, dt*60));
/** масштаб «появился с нуля» */
const popIn = (t, dur) => eBack(clamp(t/(dur||0.25), 0, 1));
/** мягкое покачивание для простаивания */
const wobble = (t, spd, amt) => Math.sin(t*(spd||2))*(amt==null?1:amt);

/* ==========================================================================
   1 · ПИКСЕЛЬНЫЙ КРУГ БЕЗ ctx.arc
   ========================================================================== */
function ringPix(cx, cy, r, col, w){
  r = Math.round(r); w = w || 1;
  if(r <= 0) return;
  ctx.fillStyle = col;
  const px = Math.round(cx), py = Math.round(cy);
  const inner = Math.max(0, r - w);
  for(let dy=-r; dy<=r; dy++){
    const rr = r*r - dy*dy;
    if(rr < 0) continue;
    const dx = Math.floor(Math.sqrt(rr));
    const ir = inner <= 0 ? 0 : Math.floor(Math.sqrt(Math.max(0, inner*inner - dy*dy)));
    const y = py + dy;
    if(px-ir-1 >= px-dx) ctx.fillRect(px-dx, y, (px-ir)-(px-dx), 1);
    if(px+dx >= px+ir+1)   ctx.fillRect(px+ir+1, y, (px+dx)-(px+ir+1), 1);
  }
}
/** маленькая звёздочка */
function drawStar(x, y, s, col){
  s = s || 3; ctx.fillStyle = col;
  ctx.fillRect(x-s, y, s*2+1, 1);
  ctx.fillRect(x, y-s, 1, s*2+1);
  if(s > 2) ctx.fillRect(x-1, y-1, 3, 3);
}

}
function updateWipe(dt){
  if(_wipe <= 0) return;
  _wipe += dt;
  if(_wipe > .5){
    if(_wipeCb){ const c = _wipeCb; _wipeCb = null; _wipe = -1; c(); return; }
    if(_wipe > 1) _wipe = 0;
  }
}
function drawWipe(){
  if(_wipe <= 0) return;

  if(k <= 0) return;
  const cell = 6, cols = Math.max(1,Math.ceil(W/cell)), rows = Math.max(1,Math.ceil(H/cell));
  ctx.fillStyle = '#0a0518';
  for(let ry=0; ry<rows; ry++){
    for(let cx=0; cx<cols; cx++){
      const d = _wipeDir > 0 ? (cx/(cols-1)*.6 + ry/(rows-1)*.4) : (1 - (cx/(cols-1)*.6 + ry/(rows-1)*.4));
      const a = clamp((k*1.12 - d) * 5, 0, 1);
      if(a <= 0) continue;
      ctx.globalAlpha = a;
      const g = (1-k)*4;
      ctx.fillRect(cx*cell, ry*cell, Math.max(1, cell-g), Math.max(1, cell-g));
    }
  }

}

  // счётчик сердец главной линии
  const hy = y + 19;
  const cnt = 'Собрано сердец: ' + storyDone() + ' / ' + CH;
  heart(x+5, hy, 1, P.pink);
  const rw = finaleReady() ? 62 : 58;
  text(cnt, x+15, hy, {sc:fitSc(cnt, w-rw-20, 1), color: storyDone()>=CH ? P.green : UI.text});
  if(finaleReady()){
    const a = 0.4+0.4*Math.abs(Math.sin(t*3));
    ctx.globalAlpha = a;
    text('ФИНАЛ ЖДЁТ', x+w-5, hy, {sc:1, align:'right', color:P.green});
    ctx.globalAlpha = 1;
  } else {
    text('БОНУС '+arcDone()+'/'+AR_N, x+w-5, hy, {sc:1, align:'right', color:'#5a4680'});
  }
  // ряд из восьми сердец
  for(let i=0;i<CH;i++) heart(x+6+i*11, hy+11, 1, G.hearts[EP_HEART_IDX[i]] ? P.pink : '#3a2560');
  // сетка узлов
  const list = tab===0 ? EP_N+1 : AR_N;
  const base = tab===0 ? 0 : EP_N;
  const gy = hy + 23, gh = y + h - gy - 16;
  const cols = (w >= 250) ? 3 : (tab===0 ? 2 : 2);
  const rows = Math.ceil(list/cols);
  const cw = w/cols, ch = gh/rows;
  const showLabels = ch >= 38;
  const R2 = Math.max(9, Math.min(15, Math.floor(Math.min(cw, ch)/2) - 3));
  for(let k=0;k<list;k++){
    const i = (tab===0 && k===EP_N) ? FINALE_NODE : base + k;
    const isFin = (i === FINALE_NODE);
    const cx = Math.round(x + cw*(k%cols + 0.5));
    const cy = Math.round(gy + ch*(Math.floor(k/cols) + 0.5));
    const got = isFin ? finaleReady() : G.hearts[i];
    const locked = isFin && !got;
    const isSel = (i === sel);
    const bob = isSel ? Math.round(Math.sin(t*5)*2) : 0;
    const ny = cy + bob;
    out.nodes.push({x:cx, y:ny, i:i, r:R2});
    if(isFin && got){
      const a = 0.22+0.32*Math.abs(Math.sin(t*2.5));
      ctx.fillStyle = 'rgba(255,209,102,'+a.toFixed(2)+')';
      ctx.fillRect(cx-R2-4, ny-R2-4, (R2+4)*2, (R2+4)*2);
    }
    if(isSel){ ctx.fillStyle = 'rgba(255,209,102,.16)'; ctx.fillRect(cx-R2-3, ny-R2-3, (R2+3)*2, (R2+3)*2); }
    ctx.fillStyle = locked ? '#1d1136' : (got ? '#4a1f3d' : '#2d1a54');
    ctx.fillRect(cx-R2, ny-R2, R2*2, R2*2);
    ctx.fillStyle = locked ? '#3a2560' : (isSel?P.gold:(got?P.pink:'#6b4fa0'));
    ctx.fillRect(cx-R2, ny-R2, R2*2, 2); ctx.fillRect(cx-R2, ny+R2-2, R2*2, 2);
    ctx.fillRect(cx-R2, ny-R2, 2, R2*2); ctx.fillRect(cx+R2-2, ny-R2, 2, R2*2);
    drawNodeIcon(i, cx, ny, locked ? '#4a3670' : (got?P.pink2:P.gold));
    if(showLabels){
      const nm = NODE_META[i].short || NODE_META[i].name;
      const lsc = fitSc(nm, cw-4, 1);
      text(nm, cx, ny+R2+1, {sc:lsc, align:'center', color: locked?'#5a4680':(isSel?P.ink:P.dim)});
    }
    if(got && !isFin) heart(cx+R2-3, ny-R2-3, 1, P.pink);
  }
  // подвал
  const nm = NODE_META[clamp(sel,0,NODE_META.length-1)];
  const foot = (sel===FINALE_NODE) ? (finaleReady() ? 'ОТКРЫТЬ ФИНАЛ ♥' : 'СОБЕРИ ВСЕ '+CH+' СЕРДЕЦ') : nm.sub;
  text(foot, x+w/2, y+h-12, {sc:fitSc(foot, w-10, 1), align:'center', color: sel===FINALE_NODE?P.green:P.dim});
  return out;
}
/* какой узел «даёт» i-е сердце (для ряда из 8 сердец) */
const EP_HEART_IDX = (function(){
  const a = []; for(let i=0;i<EP_N;i++) for(let k=0;k<(STORY_META[i].h||1);k++) a.push(i);
  return a;
})();
function mapHit(m, x, y){
  for(const t of m.tabs) if(x>t.x && x<t.x+t.w && y>t.y && y<t.y+t.h) return {tab:true, i:m.tabs.indexOf(t)};
  for(const n of m.nodes) if(Math.abs(x-n.x)<n.r+4 && Math.abs(y-n.y)<n.r+5) return {tab:false, i:n.i};
  return null;
}
function mapPick(i){
  if(i === FINALE_NODE){
    if(finaleReady()){ Snd.fanfare(); go('finale'); }
    else { Snd.bad(); openSys('ЕЩЁ РАНО', ['Финал откроется, когда','ты соберёшь все', CH+' сердец.','Сейчас: '+storyDone()]); }
    return;
  }
  if(i >= EP_N && i < FINALE_NODE){ G.sel = EP_N; startLevel(i); return; }
  startLevel(i);
}
function mapTabOf(i){ return (i < EP_N || i === FINALE_NODE) ? 0 : 1; }

/* --- окно «ПРОГРЕСС.exe» --- */
mapWindowContent = function(win){
  const r = Win.inner(win);
  if(win.tab == null) win.tab = mapTabOf(G.sel);
  if(G.sel != null) win.tab = mapTabOf(G.sel);
  const m = mapCore(r.x, r.y, r.w, r.h, win.tab, win.t, G.sel);
  win.mapRects = m;
  win.nodesXY = m.nodes;

  };
};

  enter(){ this.t = 0; G.sel = (G.sel==null || G.sel<0) ? 0 : G.sel; this.tab = mapTabOf(G.sel); },

  choose(){ mapPick(G.sel); },
  key(k){
    const list = this.tab===0 ? EP_N+1 : AR_N, base = this.tab===0?0:EP_N;
    const cols = this.tab===0 ? (W>=250?3:2) : clamp(Math.floor(W/72), 2, 4);
    if(k==='ArrowLeft'){ G.sel = base + (G.sel - base - 1 + list) % list; Snd.blip(); }
    if(k==='ArrowRight'){ G.sel = base + (G.sel - base + 1) % list; Snd.blip(); }
    if(k==='ArrowUp'){ G.sel = base + (G.sel - base - cols + list*2) % list; Snd.blip(); }
    if(k==='ArrowDown'){ G.sel = base + (G.sel - base + cols) % list; Snd.blip(); }
    if(k==='Tab'){ this.tab = 1-this.tab; G.sel = this.tab===0?0:EP_N; Snd.blip(); }
    if(k===' '||k==='Enter') mapPick(G.sel);
  },
  tap(x,y){
    const h = mapHit(this.m, x, y);
    if(!h) return;
    if(h.tab){ this.tab = h.i; G.sel = h.i===0 ? 0 : EP_N; Snd.blip(); return; }

const _launchW = G.screens.desktop.launch;
G.screens.desktop.launch = function(it, dbl){
  if(it.kind === 'term'){ openTerm(it); return; }
  if(it.kind === 'set'){ Snd.blip(); ripple(it.tx, it.ty); openSettings(); return; }
  if(it.kind==='arcade'){
    Snd.coin(); ripple(it.tx, it.ty);
    G.sel = EP_N;
    if(!(G.win && G.win.kind==='map')) Win.open('map','ПРОГРЕСС.exe',{w:Math.min(W-8,224), h:Math.min(H-30,320), from:{x:it.tx-20,y:it.ty-16,w:40,h:32}});
    if(G.win && G.win.kind==='map') G.win.tab = 1;
    return;
  }
  if(it.kind==='level' && !dbl){
    Snd.blip(); ripple(it.tx, it.ty);
    G.sel = it.idx;
    if(G.win && G.win.kind==='map'){ G.win.tab = mapTabOf(it.idx); }
    else Win.open('map','ПРОГРЕСС.exe',{w:Math.min(W-8,224), h:Math.min(H-30,320), from:{x:it.tx-20,y:it.ty-16,w:40,h:32}});
    if(G.win && G.win.kind==='map') G.win.tab = mapTabOf(it.idx);
    return;
  }
  if(it.kind==='level' && dbl){
    Snd.coin(); ripple(it.tx, it.ty);
    G.pending = {type:'level', idx:it.idx, t:0};
    Win.open('load', 'ЗАПУСК ' + NODE_META[it.idx].name + '.exe', {w:170, h:56, from:{x:it.tx-20, y:it.ty-16, w:40, h:32}});
    return;
  }
  return _launchW.call(this, it, dbl);
};
const _deskTap = G.screens.desktop.tap;
G.screens.desktop.tap = function(x, y){
  const w = G.win;
  if(G.state==='desktop' && w && w.kind==='map' && !w.closing && w.anim > 0.9 && Win.hit(w, x, y)){
    const h = mapHit(w.mapRects||{}, x, y);
    if(h){
      if(h.tab){ w.tab = h.i; G.sel = h.i===0?0:EP_N; Snd.blip(); return; }
      G.sel = h.i; w.tab = mapTabOf(h.i);
      mapPick(h.i); return;
    }
    return;
  }
  return _deskTap.call(this, x, y);
};

/* ==========================================================================
   ЧАСТЬ 20 · HEART ARCHIVE — дополнительные мини-игры
   Реестр, окно архива, прогресс, сохранения (saveVersion 2), запуск,

const ARCH_N = 5;                       // сколько игр в архиве
const ARCH_KEY = 'printILY3';           // тот же ключ localStorage

/* --- метаданные игр. Содержание каждой игры лежит в своём файле 21…25 --- */
const ARCH_META = [
  {id:'cipher', no:'01', name:'ШИФР, КОТОРЫЙ МЕНЯЕТСЯ', short:'ШИФР',

];

/* --- состояние прогресса архива (отдельно от основных 13 узлов) --- */
const AR = {
  done:   new Array(ARCH_N).fill(false),
  tries:  new Array(ARCH_N).fill(0),
  best:   new Array(ARCH_N).fill(0),     // лучшее время, мс
  hints:  new Array(ARCH_N).fill(0),     // сколько подсказок использовано
  errors: new Array(ARCH_N).fill(0),
  /* ---- сохранения: версия 2, старые сохранения читаются как есть ---- */
  pack(){ return {d:this.done, t:this.tries, b:this.best, h:this.hints, e:this.errors}; },
  unpack(o){
    if(!o) return;
    const put=(arr,src)=>{ if(!Array.isArray(src)) return; for(let i=0;i<ARCH_N;i++) arr[i] = +src[i]||0; };
    put(this.done,o.d); put(this.tries,o.t); put(this.best,o.b); put(this.hints,o.h); put(this.errors,o.e);
    for(let i=0;i<ARCH_N;i++) this.done[i] = !!this.done[i];
  },
  load(){
    try{
      const d = JSON.parse(localStorage.getItem(ARCH_KEY)||'null');
      if(d && d.a) this.unpack(d.a);
    }catch(e){}
  },
  save(){ arSaveNow(); },
  doneCount(){ let n=0; for(const v of this.done) if(v) n++; return n; },
  hintsTotal(){ let n=0; for(const v of this.hints) n+=v; return n; },
  errorsTotal(){ let n=0; for(const v of this.errors) n+=v; return n; }
};

/* --- перехватываем сохранение: добавляем блок «a», версию 2 --- */
function arSaveNow(){
  try{
    const d = JSON.parse(localStorage.getItem(ARCH_KEY)||'null') || {};
    d.v = 2; d.h = G.hearts; d.a = AR.pack();
    localStorage.setItem(ARCH_KEY, JSON.stringify(d));
  }catch(e){}
}
const _saveA0 = save;
save = function(){ arSaveNow(); _saveA0(); };
AR.load();

/* ==========================================================================
   ЗАПУСК ИГР АРХИВА
   Свой экран уровня, чтобы не трогать LEVELS / G.hearts / счётчик 8/8.
   ========================================================================== */
const ARCH_LEVELS = {};                 // id -> объект уровня (21…25)
let G_arIdx = 0;                        // индекс открытой игры
const G_ar = { card:0, cardMax:1.75, reward:null, winT:0 };

function archMeta(i){ return ARCH_META[i]; }
function arLevel(){ return ARCH_LEVELS[archMeta(G_arIdx).id]; }

/** старт игры архива: карточка-интро → уровень */
function startArch(i){
  if(G.win) G.win = null;          // окно архива могло остаться «закрывающимся»
  G_arIdx = i;
  AR.tries[i]++;
  arSaveNow();
  goNow('arcard');
}
/** из карточки — в уровень */
function arCardStart(){
  const lv = arLevel();
  if(lv && lv.enter) lv.enter();
  goNow('arlevel');
  G_ar.card = G_ar.cardMax; G.cardT = G_ar.cardMax; G.cardAge = 0;
}
/** победа в игре архива */
function arWin(msg){
  const i = G_arIdx;
  const el = Math.round(arT()*1000);
  if(!AR.done[i] || (AR.best[i] && el < AR.best[i])) AR.best[i] = el;
  AR.done[i] = true;
  arSaveNow();
  Snd.fanfare();
  G_ar.reward = {i:i, t:0};
  if(AR.doneCount() >= ARCH_N && !AR.celebrated){
    AR.celebrated = true;
    arSaveNow();
    goNow('arcomplete');
    return;
  }
  goNow('arreward');
}
let _arT0 = 0;
function arT(){ return Math.max(0, Math.round((performance.now() - _arT0)/10)*10); }
/** поражение: не обнуляем игру, а предлагаем продолжить */
function arLose(msg){
  const i = G_arIdx;
  AR.errors[i]++;
  arSaveNow();
  Snd.bad();
  G_ar.lose = msg || 'Ничего страшного. Я рядом.';
  G.dialog = null;
  goNow('arlose');
}
/** перезапуск игры после неудачи (ошибки не обнуляем — прогресс остаётся) */
function arRetry(){
  const lv = arLevel();
  if(lv && lv.enter) lv.enter();
  goNow('arlevel');
}
/** «пропустить»: после трёх неудач */
function arSkip(){
  const i = G_arIdx, lv = arLevel();
  if(!AR.done[i]){ AR.done[i] = true; arSaveNow(); }
  Snd.coin();
  G.dialog = null;
  startDialog(lv.outro || [D('him','Ладно, в следующий раз.')], ()=>{ go('desktop'); G.openArch = true; });
  if(G.dialog) G.dialog.lastLabel = '[ ВЕРНУТЬСЯ ]';
  G.openArch = true;
}

function openArchiveWin(from, straightToList){
  const w = Win.open('arch','HEART ARCHIVE',{w:Math.min(W-8,224), h:Math.min(H-30,212), from:from});
  w.data.tab = 0;

  if(w.data.sel == null) w.data.sel = 0;

/** обрезать строку по длине (многоточия в шрифте нет) */
function cutTxt(s, n){ s = String(s); return s.length > n ? s.slice(0, n-1) + '.' : s; }
/** статус файла: НЕ ПРОЙДЕНО / ПРОЙДЕНО / ИДЕАЛЬНО */
function archStatus(i){
  if(!AR.done[i]) return 'НЕ ПРОЙДЕНО';

}
/** прошлый результат: PERFECT / SOLVED */
function archResult(i){
  if(!AR.done[i]) return '';
  return (AR.hints[i] === 0 && AR.errors[i] === 0) ? 'PERFECT' : 'SOLVED';
}

/** тап по окну архива */
function archWinTap(x,y){
  const win = G.win; if(!win) return false;
  const d = win.data;
  if(d.page === 0){
    const b = d.introBtn;
    if(b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ d.page = 1; Snd.coin(); return true; }
    return true;
  }
  for(const tb of (d.tabs||[])){
    if(x>=tb.x && x<=tb.x+tb.w && y>=tb.y && y<=tb.y+tb.h){ d.tab = d.tab===0?1:0; Snd.blip(); return true; }
  }
  for(const rw of (d.rows||[])){
    if(x>=rw.x && x<=rw.x+rw.w && y>=rw.y && y<=rw.y+rw.h){
      d.sel = rw.i; Snd.blip();
      if(d.selT) clearTimeout(d.selT);
      d.selT = setTimeout(()=>{ if(G.win === win){ Win.close(); startArch(d.sel); } }, 160);
      return true;
    }
  }
  return false;
}

  return _laA0.call(this, it, dbl);
};

/* ==========================================================================
   ЕДИНАЯ СИСТЕМА ПОДСКАЗОК
   ========================================================================== */
const AR_HINTS = {};                   // id -> [3 подсказки]
function arHints(id){ return AR_HINTS[id] || []; }
/** показать подсказку уровня n (0,1,2) */
function arHint(n){
  const i = G_arIdx;
  const list = arHints(archMeta(i).id);
  const k = (G.screens.arlevel.hintStep || 0);
  if(k >= list.length){
    G.screens.arlevel.hintNo = 0;
    G.screens.arlevel.hintT = 2.2;
    G.screens.arlevel.hintText = 'Больше подсказок нет. Ты справишься.';
    return;
  }
  G.screens.arlevel.hintStep = k+1;
  G.screens.arlevel.hintNo = k+1;
  AR.hints[i]++; arSaveNow();
  G.screens.arlevel.hintText = list[k];
  G.screens.arlevel.hintT = 6.5;
  Snd.coin();
}
function arResetHints(){ G.screens.arlevel.hintStep = 0; G.screens.arlevel.hintT = 0; G.screens.arlevel.hintNo = 0; }

/* --- кнопки, общие для всех игр архива: ПОДСКАЗКА / ВЫХОД --- */
function arBar(y, withExit){
  const P = CONFIG.P, h = 16;
  const items = [];
  items.push({x:4, w:Math.floor((W-8-4)/2), t:'ПОДСКАЗКА', f:()=>arHint(0), n:3});

  const out = [];
  for(const it of items){
    const on = ptr.x>it.x && ptr.x<it.x+it.w && ptr.y>y && ptr.y<y+h;

    out.push({x:it.x, y:y, w:it.w, h:h, f:it.f});
  }
  return out;
}

   ПОДСКАЗКА «ПРОПУСТИТЬ» В ДИАЛОГЕ ДЛЯ ИГР АРХИВА
   Основные уровни работают как раньше (skipLevel), архив — arSkip.

const _dlgK0 = G.screens.dialog.key;

const _dlgT0 = G.screens.dialog.tap;

  if(r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h && G.state === 'arlevel'){ arSkip(); return; }
